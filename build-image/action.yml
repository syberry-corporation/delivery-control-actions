        fi
        if [ "${PROVENANCE}" = "true" ]; then
          set +e
          (
            set -euo pipefail
            if ! command -v oras >/dev/null 2>&1; then
              if command -v curl >/dev/null 2>&1; then
                curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_${ARCH}.tar.gz" | tar -xz -C "${BIN_DIR}" oras
              else
                fetch_url "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_${ARCH}.tar.gz" | tar -xz -C "${BIN_DIR}" oras
              fi

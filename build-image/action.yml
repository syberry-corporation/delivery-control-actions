            oras attach --artifact-type "${SBOM_MEDIA_TYPE}" "${IMAGE_BY_DIGEST}" "sbom.cdx.json:${SBOM_MEDIA_TYPE}"
            echo "SBOM attached as an OCI referrer of ${IMAGE_BY_DIGEST}"

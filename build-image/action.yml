          set +e
          (
            set -euo pipefail
            if ! command -v syft >/dev/null 2>&1; then
              if command -v curl >/dev/null 2>&1; then
                curl -fsSL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" | sh -s -- -b "${BIN_DIR}" "${SYFT_VERSION}"

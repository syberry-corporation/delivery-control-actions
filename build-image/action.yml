        done <<BUILD_ARGS_EOF
        ${DOCKER_BUILD_ARGS:-}
        BUILD_ARGS_EOF
        docker build ${TARGET_ARG} "$@" \
          -f "${DOCKERFILE}" \
          --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
          --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
          --label "org.opencontainers.image.version=${version}" \
          -t "${IMAGE_REF}" "${BUILD_CONTEXT}"
        docker push "${IMAGE_REF}"
        IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REF}" | sed 's/.*@//')
        test -n "$IMAGE_DIGEST" || { echo "Could not resolve pushed image digest"; exit 1; }
        IMAGE_BY_DIGEST="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
        echo "Pushed ${IMAGE_REF} (${IMAGE_DIGEST})"
        BIN_DIR="$(mktemp -d)"; export PATH="${BIN_DIR}:${PATH}"

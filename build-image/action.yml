              --arg name "${ECR_URL}/${repository}" --arg imgsha "${IMAGE_DIGEST#sha256:}" \
              --arg src "${SOURCE_URI}" --arg commit "${CI_COMMIT_SHA}" \
              --arg buildtype "${PROVENANCE_BUILD_TYPE}" --arg configsrc "${CI_CONFIG_PATH:-.gitlab-ci.yml}" \
              --arg builder "${CI_SERVER_URL}/${CI_PROJECT_PATH}//${CI_CONFIG_PATH:-.gitlab-ci.yml}@refs/heads/${CI_COMMIT_REF_NAME}" \
              --arg invocation "${CI_JOB_URL}" \
              '{ _type:"https://in-toto.io/Statement/v1", subject:[{name:$name,digest:{sha256:$imgsha}}],
                 predicateType:"https://slsa.dev/provenance/v1",
                 predicate:{ buildDefinition:{ buildType:$buildtype, externalParameters:{source:$src,configSource:$configsrc}, internalParameters:{},
                   resolvedDependencies:[{uri:$src,digest:{gitCommit:$commit}}] },
                   runDetails:{ builder:{id:$builder}, metadata:{invocationId:$invocation} } } }' > provenance.json
            [ -s provenance.json ] || { echo "provenance.json is empty — refusing to attach it"; exit 1; }
            oras attach --artifact-type "${PROVENANCE_MEDIA_TYPE}" "${IMAGE_BY_DIGEST}" "provenance.json:${PROVENANCE_MEDIA_TYPE}"
            echo "SLSA provenance attached as an OCI referrer of ${IMAGE_BY_DIGEST}"
          )
          _prov_rc=$?
          set -e
          [ "$_prov_rc" -eq 0 ] || echo "WARNING: provenance generation/attach failed (non-fatal) — the SD-1.2 gate will report missing provenance"
        fi
        {
          echo "digest=${IMAGE_DIGEST}"
          echo "image=${IMAGE_BY_DIGEST}"
        } >> "$GITHUB_OUTPUT"

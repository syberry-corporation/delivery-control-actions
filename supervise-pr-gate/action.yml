        # control is told, and the way it goes wrong is silent. A zero submitted instead of skipped blocks a
        # merge request on a runner that had nothing to run here; an idempotency key that does not carry the
        # runner makes the second submission REPLACE the first, and a component with four runners reports
        # whichever went last — both look like a working gate from the outside.

        # test_summary_from <file> -> {tool, summary} on stdout, whatever the file is.
        #
        # A consumer running four runners had to convert each one's output into a summary before the gate would
        # look at it — a reader for `go test -json`, one for `opa test --format=json`, one for minitest, all three
        # of which live in this repository, in test_summary.py, where a consumer's job cannot reach them. So the
        # same three algorithms existed twice, and the copies drift silently: fix a count in one and the other
        # keeps reporting the old number, with nothing to say which one reached the control.
        #
        # The FILE NAME carries what the consumer knows and this cannot guess: `<runner>.<format>.<ext>`. So
        # `go-test.go.json` is go's event stream, read as `go`, recorded as the runner `go-test`. A name with no
        # recognised format is read as a pre-built summary — the shape this directory held before — so the two
        # coexist rather than one replacing the other.
        # test_summary_format <file> -> the reader to use, or empty when the file IS a summary.
        #
        # Split from test_summary_from so it can be tested: the READING is covered by tests/test_reports.py, which
        # runs test_summary.py directly, but the decision made from a file name is shell and has its own way of
        # being wrong — see the `go.json` case below.
        test_summary_format() {
          local base stem fmt
          base=$(basename "$1")
          stem="${base%.*}"
          # A format segment only exists when the stem still holds a dot. Without this, `go.json` — a perfectly
          # ordinary name for a PRE-BUILT summary — parses as format `go`, its contents are read as an event
          # stream that yields nothing, and the runner disappears from the evidence without a word.
          case "$stem" in
            *.*) fmt="${stem##*.}" ;;
            *)   return 0 ;;
          esac
          case "$fmt" in
            junit|jest|go|opa|minitest) printf '%s' "$fmt" ;;
            *) return 0 ;;
          esac
        }

        # test_summary_runner <file> -> the runner name the evidence records.
        test_summary_runner() {
          local base stem
          base=$(basename "$1")
          stem="${base%.*}"
          if [ -n "$(test_summary_format "$1")" ]; then
            printf '%s' "${stem%.*}"
          else
            printf '%s' "$stem"
          fi
        }

        test_summary_from() {
          local file="$1" fmt
          # CONTENT DECIDES BEFORE THE NAME. A file that already carries `tool` and `summary` IS a summary,
          # whatever it is called — so a consumer that has been writing pre-built summaries keeps working even if
          # one of them happens to be named `<x>.go.json`, which the naming rule below would otherwise read as a
          # go event stream and reduce to nothing. The name is consulted only when the content does not answer.
          if jq -e 'type == "object" and has("tool") and has("summary")' "$file" >/dev/null 2>&1; then
            jq -c '{tool, summary}' "$file"
            return
          fi
          fmt=$(test_summary_format "$file")
          if [ -n "$fmt" ]; then
            python3 - "$(test_summary_runner "$file")" "$file" "$fmt" <<'TESTSUMMARY'
        import glob, json, re, sys, xml.etree.ElementTree as ET

        # Turns whatever the suite wrote into the ONE summary the SD-2.4.2 evidence carries:
        # {tool:{name,version}, summary:{total,passed,failed,skipped,errors}}.
        #
        # Five formats are built in, because five are what the estate's runners actually produce. `junit` covers
        # gradle, maven, pytest and anything with a JUnit reporter. `jest` reads jest's own `--json` output, which
        # exists because jest writes no JUnit without the extra `jest-junit` dependency — and asking a project to
        # add one to satisfy a report means editing its lockfile, which the CI install then has to accept under
        # `--frozen-lockfile`. A format nobody can adopt without changing their dependencies is one that gets
        # worked around with a hand-rolled converter in every repository that meets it.
        #
        # `go`, `opa` and `minitest` were exactly that hand-rolled converter, living in a platform repository
        # because this file did not read what those runners write. `go test -json` is a STREAM of events rather
        # than a report, `opa test --format=json` an array of per-test results, and minitest prints a summary
        # line and nothing machine-readable at all. A repository that runs four runners has to submit four
        # summaries, and until these were here it had to write its own reader for three of them.
        tool, pattern = sys.argv[1], sys.argv[2]
        fmt = sys.argv[3] if len(sys.argv) > 3 else "auto"


        def _counted_suites(node):
            """The suites whose counts are the report's, each test once.

            A `<testsuite>` may NEST: PHPUnit writes root -> class -> data-provider suites, and every level carries the
            totals of everything under it. Summing every level counted one run three times over (141 tests read as
            458). So a suite that states `tests` is taken whole and its children are not visited; only a suite without
            counts of its own — a bare grouping element — is looked inside. Gradle and pytest write flat suites, where
            this is the same as before.
            """
            if node.tag == "testsuite" and "tests" in node.attrib:
                yield node
                return
            for child in node:
                if child.tag == "testsuite":
                    yield from _counted_suites(child)


        def junit(paths):
            t = f = e = s = 0
            for fp in paths:
                try:
                    r = ET.parse(fp).getroot()
                except Exception:
                    continue
                for su in _counted_suites(r):
                    t += int(su.get("tests", 0)); f += int(su.get("failures", 0))
                    e += int(su.get("errors", 0)); s += int(su.get("skipped", 0))
            return t, t - f - e - s, f, s, e


        def jest(paths):
            """jest --json: counts at the top level, one file per run (or per shard).

            `numRuntimeErrorTestSuites` is reported as ERRORS rather than folded into failures or dropped: a suite
            that could not be imported ran no tests at all, so counting it as zero would let a broken suite look
            like a suite with nothing to say — the shape SD-2.4.2 exists to catch.
            """
            t = p = f = s = e = 0
            for fp in paths:
                try:
                    with open(fp) as fh:
                        r = json.load(fh)
                except Exception:
                    continue
                if "numTotalTests" not in r:
                    continue                      # some other JSON that happened to match the glob
                t += r.get("numTotalTests", 0); p += r.get("numPassedTests", 0)
                f += r.get("numFailedTests", 0); s += r.get("numPendingTests", 0)
                e += r.get("numRuntimeErrorTestSuites", 0)
            return t, p, f, s, e


        def go(paths):
            """`go test -json`: a STREAM of events, one JSON object per line.

            Only events carrying a `Test` name are counted. A package-level pass/fail event repeats the verdict of
            the tests inside it, so counting both doubles every number.
            """
            p = f = s_ = 0
            for fp in paths:
                try:
                    text = open(fp).read()
                except OSError:
                    continue
                for line in text.splitlines():
                    line = line.strip()
                    if not line.startswith("{"):
                        continue
                    try:
                        event = json.loads(line)
                    except json.JSONDecodeError:
                        continue
                    if not event.get("Test"):
                        continue
                    action = event.get("Action")
                    p += action == "pass"; f += action == "fail"; s_ += action == "skip"
            return p + f + s_, p, f, s_, 0


        def opa(paths):
            """`opa test --format=json`: an array of result objects, one per test.

            A test that ERRORED carries an `error` key and is NOT a failure: the policy counts TESTS_FAILED and
            TESTS_ERRORED separately, so collapsing them reports the wrong reason for the block.
            """
            t = p = f = s_ = e = 0
            for fp in paths:
                try:
                    results = json.load(open(fp))
                except (OSError, json.JSONDecodeError):
                    continue
                if not isinstance(results, list):
                    continue
                t += len(results)
                for r in results:
                    if r.get("error"): e += 1
                    elif r.get("skip"): s_ += 1
                    elif r.get("fail"): f += 1
                    else: p += 1
            return t, p, f, s_, e


        # "12 runs, 34 assertions, 0 failures, 0 errors, 1 skips" — minitest writes no machine format, so its own
        # summary line is the report.
        MINITEST_RE = re.compile(r"(\d+) runs?, \d+ assertions?, (\d+) failures?, (\d+) errors?, (\d+) skips?")


        def minitest(paths):
            t = f = e = s_ = 0
            for fp in paths:
                try:
                    text = open(fp).read()
                except OSError:
                    continue
                for runs, failures, errors_, skips in MINITEST_RE.findall(text):
                    t += int(runs); f += int(failures); e += int(errors_); s_ += int(skips)
            return t, t - f - e - s_, f, s_, e


        def detect(paths):
            """Which reader, decided by what the suite actually wrote.

            The alternative is asking every consumer to name a format they did not choose — jest writes JSON
            because it writes no JUnit without an extra dependency, and a gradle build writes XML because that is
            what gradle does. Neither is a decision worth an input, and SD-2.4.1's analyser detection has read the
            reports rather than asked since it was written.

            JUnit first when both are present: a project that configured a JUnit reporter meant it, and a
            `build/test-results` holding both is usually a JSON that is not a report at all — coverage summaries
            live there too, which is why the jest reader ignores files without its counters.
            """
            if any(p.endswith(".xml") for p in paths):
                return "junit"
            if any(p.endswith(".json") for p in paths):
                return "jest"
            return "junit"


        # An empty glob means "wherever runners conventionally write". Asking every project to redirect its
        # reporter into one directory is asking it to configure something it already configured — gradle writes
        # build/test-results, maven writes target/surefire-reports, jest-junit defaults to ./junit.xml — and the
        # projects that get it wrong do not fail loudly: the gate finds no reports and submits a suite of zero.
        DEFAULTS = (
            "**/build/test-results/**/*.xml", "**/build/test-results/**/*.json",
            "**/test-results/**/*.xml", "**/test-results/**/*.json",
            "**/target/surefire-reports/*.xml", "**/target/failsafe-reports/*.xml",
            "**/junit*.xml", "**/jest*.json", "**/test-report*.xml", "**/test-report*.json",
        )
        # Vendored trees hold fixtures with exactly these names — a `junit.xml` under node_modules is somebody
        # else's test data, and counting it would report a suite this project never ran.
        VENDORED = ("/node_modules/", "/.git/", "/.venv/", "/vendor/", "/.tool-cache/", "/.pnpm-store/")
        patterns = [pattern] if pattern else list(DEFAULTS)
        paths = sorted({p for pat in patterns for p in glob.glob(pat, recursive=True)
                        if not any(v in f"/{p}" for v in VENDORED)})
        if fmt == "auto":
            fmt = detect(paths)
            print(f"test summary: reading {len(paths)} report(s) as {fmt}", file=sys.stderr)
        READERS = {"junit": junit, "jest": jest, "go": go, "opa": opa, "minitest": minitest}
        total, passed, failed, skipped, errors = READERS.get(fmt, junit)(paths)
        print(json.dumps({"tool": {"name": tool, "version": "ci"},
                          "summary": {"total": total, "passed": passed, "failed": failed,
                                      "skipped": skipped, "errors": errors}}))
        TESTSUMMARY
          else
            jq -c '{tool, summary}' "$file"
          fi
        }

        # extra_test_summaries <dir> [workdir] -> one normalised summary file per runner worth submitting.
        #
        # A summary totalling zero is DROPPED. A runner that found no suite in THIS component has not failed, it
        # was not applicable: pytest is not a defect in a Go module. Submitting the zero would turn "nothing to
        # run here" into NO_TESTS_EXECUTED, the vacuous pass the policy exists to reject — so a correct pipeline
        # would be blocked by a runner that correctly did nothing.
        #
        # ONE LEVEL OF SUBDIRECTORY IS AN INSTANCE: `<instance>/<tool>.<format>.<ext>`. A component running one
        # tool over several source trees submits once per tree, and the evidence id and idempotency key have to
        # differ or the second submission REPLACES the first — the component then reports whichever tree went
        # last, looking healthy.
        #
        # The directory carries it rather than the file name. `tool.name` is checked against SD-2.4.2's approved
        # set of runners, which a project cannot extend, so anything a consumer adds to the NAME to tell two trees
        # apart comes back TEST_TOOL_NOT_APPROVED — which is exactly what happened when the tree's path was put
        # there. A directory is also unique by construction, so a consumer can use the full path of the tree and
        # needs no scheme for keeping short labels from colliding.
        #
        # Files directly in the directory are unchanged: no instance, slug from `tool.name`, exactly as before.
        extra_test_summaries() {
          local dir="$1" work="${2:-}" f out tmp total inst slug n
          [ -n "$dir" ] && [ -d "$dir" ] || return 0
          [ -n "$work" ] || work=$(mktemp -d)
          mkdir -p "$work"
          tmp="$work/.reading"
          for f in "$dir"/* "$dir"/*/*; do
            [ -f "$f" ] || continue
            test_summary_from "$f" > "$tmp" 2>/dev/null || continue
            total=$(jq -r '.summary.total // 0' "$tmp" 2>/dev/null) || continue
            case "$total" in ''|*[!0-9]*) continue ;; esac
            [ "$total" -gt 0 ] || continue
            inst=""
            [ "$(dirname "$f")" = "$dir" ] || inst=$(basename "$(dirname "$f")")
            slug=$(evidence_slug "$(jq -r '.tool.name // "unknown"' "$tmp" 2>/dev/null)" "$inst")
            out="$work/$slug.summary.json"
            # Two files that reduce to one slug — one tree writing both a junit and a minitest report for the
            # same tool — would otherwise overwrite each other, which is the loss the instance exists to prevent.
            n=1
            while [ -e "$out" ]; do n=$((n + 1)); out="$work/$slug-$n.summary.json"; done
            mv "$tmp" "$out"
            printf '%s\n' "$out"
          done
          rm -f "$tmp"
        }

        # evidence_slug <tool> <instance> -> the string an evidence id and an idempotency key can carry.
        #
        # Everything outside [A-Za-z0-9_.-] becomes a dash, so names differing only in punctuation collide; that
        # is accepted rather than unnoticed, because a component with two runners named `go test` and `go/test`
        # has a naming problem this cannot fix. What must NOT happen is an empty slug, which would make every
        # runner share one key.
        #
        # LENGTH IS BOUNDED because the evidence id is built from this and the id has a limit the producer cannot
        # see. An instance naming a deep source tree pushed one past it and the request was refused by the schema
        # with a bare `INVALID_REQUEST` — no field, no reason, indistinguishable from a broken gate. Truncating
        # alone would merge two long instances into one key, so the tail carries a checksum of the full name.
        # `cksum` rather than a digest: it is POSIX and present everywhere these scripts run, and the job is to
        # keep two names apart, not to resist anyone choosing one.
        evidence_slug() {
          local name="$1" inst="${2:-}" sum
          [ -n "$name" ] && [ "$name" != "null" ] || name="unknown"
          [ -z "$inst" ] || name="$name-$inst"
          name=$(printf '%s' "$name" | tr -c 'A-Za-z0-9_.-' '-')
          if [ "${#name}" -gt 48 ]; then
            sum=$(printf '%s' "$name" | cksum | cut -d' ' -f1)
            name="$(printf '%s' "$name" | cut -c1-39)-$(printf '%s' "$sum" | cut -c1-8)"
          fi
          printf '%s' "$name"
        }

        # runner_slug <summary-file> -> the slug its evidence id and idempotency key carry.
        #
        # extra_test_summaries names its output after the slug it computed, so this reads it back rather than
        # recomputing it: the instance comes from a directory that is no longer in the path by this point, and a
        # second derivation is a second thing to get wrong. Any file this did not write — a summary handed
        # straight to the gate — falls back to `tool.name`, exactly as before.
        runner_slug() {
          local base
          base=$(basename "$1")
          case "$base" in
            *.summary.json) printf '%s' "${base%.summary.json}"; return ;;
          esac
          evidence_slug "$(jq -r '.tool.name // "unknown"' "$1" 2>/dev/null)" ""
        }

        # test_evidence_envelope <summary-file> <slug> -> the SD-2.4.2 envelope, on stdout.
        #
        # Reads the same environment the gate's other envelopes do (SUP_PROVIDER, SUP_EXTERNAL_ID, COMPONENT_NAME,
        # SUP_PIPELINE_ID, SUP_JOB_ID, OBSERVED_AT, SRC, LINKS).
        #
        # `--slurpfile` rather than `--argjson "$(cat …)"`: a summary is small, but the gate's other envelopes
        # carry a 2000-package inventory the same way, and one shape for all of them is one thing to get right.
        #
        # `{tool, summary}` PROJECTS rather than merging the file whole. A producer is free to write extra keys —
        # timings, a command line, a runner's own metadata — and `payload: (… + $summary[0])` would carry all of
        # it into evidence the policy then has to ignore. Two keys are the contract; the rest is the producer's.
        test_evidence_envelope() {
          local summary="$1" slug="$2"
          jq -n \
            --arg prov "$SUP_PROVIDER" --arg pid "$SUP_EXTERNAL_ID" --arg comp "$COMPONENT_NAME" \
            --arg pipe "$SUP_PIPELINE_ID" --arg observed "$OBSERVED_AT" --arg runner "$slug" \
            --arg idem "sd242-${slug}-${SUP_PIPELINE_ID}-${SUP_JOB_ID}" \
            --argjson src "$SRC" --slurpfile summary "$summary" --argjson links "$LINKS" \
            '{ controlId: "SD-2.4.2", scope: "REPOSITORY", idempotencyKey: $idem,
               evidence: { evidenceId: ($prov + "-" + $pid + "-" + $comp + "-pipeline-" + $pipe + "-automated-tests-" + $runner),
                 evidenceType: "TEST_REPORT", observedAt: $observed, source: $src, artifacts: [],
                 payload: ({ format: "test-report/v1" } + ($summary[0] | {tool, summary}) + $links) } }'
        }
        # Extra runners, one summary file each. `test-report/v1` carries a single tool.name, so every runner is
        # its own submission — see submit-controls.sh, which writes one envelope per file listed here.
        EXTRA_SUMMARIES=""
        while IFS= read -r summary; do
          [ -n "$summary" ] || continue
          EXTRA_SUMMARIES="${EXTRA_SUMMARIES}${summary} "
          echo "Test summary (extra): $(jq -c '{tool, summary}' "$summary")"
        done <<EOF
        $(extra_test_summaries "${TEST_SUMMARIES_DIR:-}" "$(mktemp -d)")
        EOF
        export EXTRA_SUMMARIES
        OBSERVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        # Provider-neutral view of the CI environment, for the supervisory evidence path.
        #
        # Every evidence envelope names the repository, pipeline, job, commit and ref it came from, and each forge
        # spells all five differently. Rather than teach every gate script both vocabularies, they are resolved ONCE
        # into SUP_* variables here; nothing above this file reads CI_* or GITHUB_* directly. Adding a forge is a
        # branch in one function, not a change to the envelope builders.
        #
        # CRITICAL: this file is `# @@`-inlined. Unlike fetch_url.sh, its caller DOES execute at inclusion time —
        # supervise.sh calls `ci_env_init` before it builds the source context — so keep the body function
        # definitions only, and leave the single call site explicit.

        # Reads a field out of the GitHub event payload, empty when there is no payload or no such field.
        _ci_env_gh_event() {  # $1=jq path expression
          [ -f "${GITHUB_EVENT_PATH:-}" ] || return 0
          jq -r "$1 // empty" < "$GITHUB_EVENT_PATH" 2>/dev/null || true
        }

        _ci_env_init_gitlab() {
          SUP_PROVIDER=gitlab
          SUP_EXTERNAL_ID="${CI_PROJECT_ID:-}"
          SUP_PIPELINE_ID="${CI_PIPELINE_ID:-}"
          SUP_JOB_ID="${CI_JOB_ID:-}"
          SUP_COMMIT_SHA="${CI_COMMIT_SHA:-}"
          SUP_REF="${CI_COMMIT_REF_NAME:-}"
          SUP_REVIEW_ID="${CI_MERGE_REQUEST_IID:-}"
          SUP_PIPELINE_URL="${CI_PIPELINE_URL:-}"
          SUP_JOB_URL="${CI_JOB_URL:-}"
        }

        _ci_env_init_github() {
          SUP_PROVIDER=github
          SUP_EXTERNAL_ID="${GITHUB_REPOSITORY_ID:-}"
          SUP_PIPELINE_ID="${GITHUB_RUN_ID:-}"
          # GITHUB_JOB is the job's key in the workflow, not an id — but a run can only hold one job per key per
          # attempt, so run + attempt + key identifies this execution the way CI_JOB_ID does on GitLab.
          SUP_JOB_ID="${GITHUB_RUN_ID:-}-${GITHUB_RUN_ATTEMPT:-1}-${GITHUB_JOB:-}"
          SUP_REVIEW_ID="$(_ci_env_gh_event '.pull_request.number')"
          # On a pull_request event GITHUB_SHA is the MERGE commit GitHub synthesised for the run — a commit that
          # exists in no branch and that SD-1.3 would then trace the build to. The head sha is the one the evidence
          # has to name; it is only in the event payload, so a run without one falls back to GITHUB_SHA.
          SUP_COMMIT_SHA="$(_ci_env_gh_event '.pull_request.head.sha')"
          SUP_COMMIT_SHA="${SUP_COMMIT_SHA:-${GITHUB_SHA:-}}"
          # GITHUB_REF_NAME on a PR run is "<n>/merge"; the branch under review is GITHUB_HEAD_REF.
          SUP_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          # There is no per-job URL in the environment — resolving one costs an API call per gate, for a link. The
          # attempt URL lands a reader on the run that produced the evidence, which is what the link is for.
          SUP_PIPELINE_URL="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID:-}"
          SUP_JOB_URL="${SUP_PIPELINE_URL}/attempts/${GITHUB_RUN_ATTEMPT:-1}"
        }

        # Resolves the SUP_* context for whichever forge this job runs on. Idempotent, and fail-closed on a forge
        # it does not know: guessing would submit evidence with an empty repository id, which the service rejects
        # as not matching the authenticated identity — an authorization error for what is really a porting bug.
        ci_env_init() {
          if [ -n "${SUP_PROVIDER:-}" ]; then return 0; fi
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            _ci_env_init_github
          elif [ "${GITLAB_CI:-}" = "true" ]; then
            _ci_env_init_gitlab
          else
            echo "ci_env: neither GITLAB_CI nor GITHUB_ACTIONS is set — refusing to guess the forge" >&2
            return 1
          fi
          if [ -z "$SUP_EXTERNAL_ID" ]; then
            echo "ci_env: ${SUP_PROVIDER} did not supply a repository id — cannot attribute evidence" >&2
            return 1
          fi
          export SUP_PROVIDER SUP_EXTERNAL_ID SUP_PIPELINE_ID SUP_JOB_ID SUP_COMMIT_SHA SUP_REF SUP_REVIEW_ID
          export SUP_PIPELINE_URL SUP_JOB_URL
        }

        # Mints (GitHub) or returns (GitLab) the OIDC token the evaluation API authenticates. Echoes the token on
        # stdout; non-zero and silent on stdout when it cannot be obtained, so a caller fails closed.
        #
        # GitLab hands the token to the job through `id_tokens:`, already in the environment. GitHub does not: the
        # job has to exchange its request token for one, per audience, at a URL that only exists when the workflow
        # granted `id-token: write`. That missing permission is the single most common way this is misconfigured,
        # so it gets its own message rather than a generic HTTP failure.
        ci_env_id_token() {
          if [ "${SUP_PROVIDER:-}" = "github" ]; then
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              echo "ci_env: no OIDC token endpoint — the workflow (or job) is missing 'permissions: id-token: write'" >&2
              return 1
            fi
            _aud="${SUPERVISORY_AUDIENCE:-supervisory-service}"
            _tok=$(curl -sS -H "authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${_aud}" 2>/dev/null | jq -r '.value // empty')
            if [ -z "$_tok" ]; then
              echo "ci_env: the OIDC token endpoint returned no token for audience '${_aud}'" >&2
              return 1
            fi
            printf '%s' "$_tok"
            return 0
          fi
          if [ -z "${SUPERVISORY_ID_TOKEN:-}" ]; then
            echo "ci_env: SUPERVISORY_ID_TOKEN is not set — the job is missing its 'id_tokens:' declaration" >&2
            return 1
          fi
          printf '%s' "$SUPERVISORY_ID_TOKEN"
        }

        # Advisory annotation: a control that comes back an ADVISORY FAIL passes the pipeline green — easy to miss.
        # When a review-comment token is set AND this run has a merge request / pull request, leave a note on it so
        # the failure is visible: which control, when it starts blocking, and why. Best-effort — never fails the job.
        # De-duped by a hidden marker so re-runs don't spam. No token / no review → no-op.

        # The rendered comment, shared by both forges — the wording is the message to the developer, not a detail of
        # whichever API posts it. $1=controlId $2=decision-response FILE $3=marker
        _advisory_body() {
          _when=$(jq -r '.enforcement.enforceAt // empty' < "$2"); _when=${_when:-a future release}
          _reason=$(jq -r '([.reasons[]?.message] | join("; ")) as $r | if $r == "" then "no reason reported" else $r end' < "$2")
          printf '### ⚠️ Advisory supervisory control failed — `%s`\n\n`%s` did not pass. It is **advisory** right now, so it does **not** block this pipeline.\n\n**It becomes enforced on `%s` — after that this failure WILL block the pipeline.** Please resolve it before then.\n\n**Reason:** %s\n\n%s' \
            "$1" "$1" "$_when" "$_reason" "$3"
        }

        # $1=controlId $2=decision-response FILE $3=marker. Needs a token with `api` scope.
        _advisory_note_gitlab() {
          [ -n "${SUPERVISION_ADVISOR_TOKEN:-}" ] || return 0
          _api="${CI_API_V4_URL}/projects/${SUP_EXTERNAL_ID}/merge_requests/${SUP_REVIEW_ID}/notes"
          if curl -sf -H "PRIVATE-TOKEN: ${SUPERVISION_ADVISOR_TOKEN}" "${_api}?per_page=100" 2>/dev/null \
               | jq -e --arg m "$3" 'map(.body) | any(contains($m))' >/dev/null 2>&1; then
            echo "[$1] advisory note already present on !${SUP_REVIEW_ID} — skipping" >&2; return 0
          fi
          jq -n --arg b "$(_advisory_body "$1" "$2" "$3")" '{body: $b}' \
            | curl -sf -X POST -H "PRIVATE-TOKEN: ${SUPERVISION_ADVISOR_TOKEN}" -H 'content-type: application/json' --data-binary @- "$_api" >/dev/null \
            && echo "[$1] advisory note posted to !${SUP_REVIEW_ID}" >&2 \
            || echo "[$1] advisory note POST failed (non-fatal)" >&2
        }

        # $1=controlId $2=decision-response FILE $3=marker. Needs a token with `pull-requests: write` — the
        # workflow's GITHUB_TOKEN is enough, so unlike GitLab this usually needs no secret, only the permission.
        _advisory_note_github() {
          _tok="${SUPERVISION_ADVISOR_TOKEN:-${GITHUB_TOKEN:-}}"
          [ -n "$_tok" ] || return 0
          _api="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/issues/${SUP_REVIEW_ID}/comments"
          if curl -sf -H "authorization: Bearer ${_tok}" -H 'accept: application/vnd.github+json' "${_api}?per_page=100" 2>/dev/null \
               | jq -e --arg m "$3" 'map(.body) | any(contains($m))' >/dev/null 2>&1; then
            echo "[$1] advisory note already present on #${SUP_REVIEW_ID} — skipping" >&2; return 0
          fi
          jq -n --arg b "$(_advisory_body "$1" "$2" "$3")" '{body: $b}' \
            | curl -sf -X POST -H "authorization: Bearer ${_tok}" -H 'accept: application/vnd.github+json' -H 'content-type: application/json' --data-binary @- "$_api" >/dev/null \
            && echo "[$1] advisory note posted to #${SUP_REVIEW_ID}" >&2 \
            || echo "[$1] advisory note POST failed (non-fatal)" >&2
        }

        # $1=controlId  $2=decision-response FILE.
        advisory_review_note() {
          [ -n "${SUP_REVIEW_ID:-}" ] || return 0
          _marker="<!-- supervision-advisory:$1 -->"
          if [ "${SUP_PROVIDER}" = "github" ]; then
            _advisory_note_github "$1" "$2" "$_marker"
          else
            _advisory_note_gitlab "$1" "$2" "$_marker"
          fi
        }

        # Resolves the bearer token for the evaluation API into _SUP_TOKEN, once per job. GitLab's arrives in the
        # environment and lives as long as the job; GitHub's is minted here and is short-lived, which is why
        # supervise() clears the cache and re-mints on a 401 rather than treating one as an authorization failure.
        #
        # It sets a variable instead of echoing the token, because the CALLER must run it in the current shell: a
        # `$(...)` around this would put the assignment in a subshell, the cache would never survive, and a gate
        # would mint a fresh token for every control it submits — which is exactly what it did.
        _sup_token() {
          if [ -z "${_SUP_TOKEN:-}" ]; then
            _SUP_TOKEN=$(ci_env_id_token) || return 1
          fi
        }

        # Shared submit + server-owned decision handling. $1=controlId, $2=evidence FILE. Evidence is passed as a
        # file (curl --data-binary @file), never as an argv string — an inventory/security payload can be hundreds
        # of KB and would overflow the argument list.
        supervise() {
          CONTROL="$1"; EVIDENCE="$2"; _rc=0
          BODY=$(mktemp)
          _attempt=1
          while :; do
            if ! _sup_token; then
              echo "[${CONTROL}] no supervisory token — failing closed"; rm -f "$BODY"; return 1
            fi
            CODE=$(curl -sS -o "$BODY" -w '%{http_code}' -X POST "${EVAL_URL}/v1/projects/${SUP_PROJECT}/evaluations" \
              -H 'content-type: application/json' -H "authorization: Bearer ${_SUP_TOKEN}" --data-binary @"$EVIDENCE")
            # A gate submits many controls in one job, and a minted token expires on its own schedule. One 401
            # part-way through means it lapsed, not that the identity is wrong — mint again and retry once. Only
            # where a token can be re-minted: on GitLab the same env value would come back and 401 again.
            if [ "$CODE" = "401" ] && [ "$_attempt" -eq 1 ] && [ "${SUP_PROVIDER}" = "github" ]; then
              _attempt=2; _SUP_TOKEN=""; continue
            fi
            break
          done
          echo "── ${CONTROL} → HTTP ${CODE} ──"; jq . < "$BODY" 2>/dev/null || cat "$BODY"
          if [ "$CODE" != "200" ]; then
            echo "[${CONTROL}] HTTP ${CODE} — failing closed"; _rc=1
          else
            EFFECT=$(jq -r '.effect // empty' < "$BODY"); STATUS=$(jq -r '.status // empty' < "$BODY"); MODE=$(jq -r '.enforcement.effectiveMode // empty' < "$BODY")
            if [ "$EFFECT" = "BLOCK" ]; then echo "[${CONTROL}] '${STATUS:-<none>}' effect BLOCK (enforced) — failing closed"; _rc=1;
            elif [ "$STATUS" = "PASS" ]; then echo "[${CONTROL}] PASS";
            elif [ "$MODE" = "disabled" ]; then echo "[${CONTROL}] DISABLED — allowed";
            else
              echo "[${CONTROL}] ADVISORY '${STATUS:-<none>}' — not blocking"
              # An advisory FAIL passes green — annotate the review (when enabled) so it isn't silently ignored.
              if [ "$STATUS" = "FAIL" ]; then advisory_review_note "$CONTROL" "$BODY"; fi
            fi
          fi
          rm -f "$BODY"   # a gate submits many controls per job — don't leak a temp per submission
          return $_rc
        }
        ci_env_init
        SRC=$(jq -n --arg prov "$SUP_PROVIDER" --arg pid "$SUP_EXTERNAL_ID" --arg comp "$COMPONENT_NAME" \
          --arg pipe "$SUP_PIPELINE_ID" --arg job "$SUP_JOB_ID" --arg ref "$SUP_REF" --arg commit "$SUP_COMMIT_SHA" \
          '{ provider: $prov, externalProjectId: $pid, component: $comp, pipelineId: $pipe, jobId: $job, commitSha: $commit, ref: $ref }')
        mkev() {  # $1=controlId $2=evidenceType $3=evidenceIdSuffix $4=idemPrefix $5=payload FILE -> envelope on stdout
          jq -n --arg control "$1" --arg etype "$2" --arg prov "$SUP_PROVIDER" --arg pid "$SUP_EXTERNAL_ID" \
            --arg comp "$COMPONENT_NAME" --arg pipe "$SUP_PIPELINE_ID" --arg observed "$OBSERVED_AT" --arg suffix "$3" \
            --arg idem "$4-${SUP_PIPELINE_ID}-${SUP_JOB_ID}" --argjson src "$SRC" --slurpfile payload "$5" \
            '{ controlId: $control, scope: "REPOSITORY", idempotencyKey: $idem,
               evidence: { evidenceId: ($prov + "-" + $pid + "-" + $comp + "-pipeline-" + $pipe + "-" + $suffix),
                 evidenceType: $etype, observedAt: $observed, source: $src, artifacts: [], payload: $payload[0] } }'
        }

        # submit_control <controlId> <evidenceType> <suffix> <idemPrefix> <payload-file>: build the envelope to a
        # file and POST it. Wraps mkev+supervise so a caller never holds a large evidence string in argv. Sets RC=1
        # on failure (the caller declares RC and reads it).
        submit_control() {
          _ev="$(mktemp)"
          mkev "$1" "$2" "$3" "$4" "$5" > "$_ev"
          supervise "$1" "$_ev" || RC=1
          rm -f "$_ev"
        }

        # submit_deploy_control <controlId> <phase: pre|post> <payload JSON>: one DEPLOYMENT-scope submission.
        #
        # The deploy gate used to carry its own copy of everything above — its own envelope, its own curl, its own
        # reading of effect/status. That copy predated the token being MINTED rather than handed over, so it had
        # neither caching nor a re-mint on a lapsed token; it just read the environment. Routing it through
        # `supervise` leaves one submit path for every gate, so a change to fail-closed handling lands in all of
        # them at once instead of in whichever copy someone remembered.
        #
        # The payload stays in argv here, unlike the repository-scope path: a deployment event is a handful of
        # fields, not a 200 KB dependency inventory.
        submit_deploy_control() {
          _ev="$(mktemp)"
          jq -n --arg control "$1" --arg phase "$2" --arg prov "$SUP_PROVIDER" --arg pid "$SUP_EXTERNAL_ID" \
            --arg comp "$COMPONENT_NAME" --arg pipe "$SUP_PIPELINE_ID" --arg job "$SUP_JOB_ID" \
            --arg env "$ENVIRONMENT_NAME" --arg observed "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson src "$SRC" --argjson payload "$3" \
            '{ controlId: $control, scope: "DEPLOYMENT",
               idempotencyKey: ($control + "-" + $phase + "-" + $pipe + "-" + $job + "-" + $env),
               evidence: {
                 evidenceId: ($prov + "-" + $pid + "-" + $comp + "-pipeline-" + $pipe + "-" + $env + "-deployment"),
                 evidenceType: "DEPLOYMENT_EVENT", observedAt: $observed,
                 source: $src, artifacts: [], payload: $payload } }' > "$_ev"
          echo "── ${2}-deploy ──"
          supervise "$1" "$_ev"; _rc=$?
          rm -f "$_ev"
          return $_rc
        }
        # SD-2.4.2 helpers for a component that runs MORE THAN ONE test runner — sourced by
        # supervise/mr_gate/test-evidence.sh and submit-controls.sh, and by tests/bats/test-evidence.bats.
        #
        # They are functions in lib/ rather than lines in those scripts for one reason: the logic decides what the
        # control is told, and the way it goes wrong is silent. A zero submitted instead of skipped blocks a
        # merge request on a runner that had nothing to run here; an idempotency key that does not carry the
        # runner makes the second submission REPLACE the first, and a component with four runners reports
        # whichever went last — both look like a working gate from the outside.

        # test_summary_from <file> -> {tool, summary} on stdout, whatever the file is.
        #
        # A consumer running four runners had to convert each one's output into a summary before the gate would
        # look at it — a reader for `go test -json`, one for `opa test --format=json`, one for minitest, all three
        # of which live in this repository, in test_summary.py, where a consumer's job cannot reach them. So the
        # same three algorithms existed twice, and the copies drift silently: fix a count in one and the other
        # keeps reporting the old number, with nothing to say which one reached the control.
        #
        # The FILE NAME carries what the consumer knows and this cannot guess: `<runner>.<format>.<ext>`. So
        # `go-test.go.json` is go's event stream, read as `go`, recorded as the runner `go-test`. A name with no
        # recognised format is read as a pre-built summary — the shape this directory held before — so the two
        # coexist rather than one replacing the other.
        # test_summary_format <file> -> the reader to use, or empty when the file IS a summary.
        #
        # Split from test_summary_from so it can be tested: the READING is covered by tests/test_reports.py, which
        # runs test_summary.py directly, but the decision made from a file name is shell and has its own way of
        # being wrong — see the `go.json` case below.
        test_summary_format() {
          local base stem fmt
          base=$(basename "$1")
          stem="${base%.*}"
          # A format segment only exists when the stem still holds a dot. Without this, `go.json` — a perfectly
          # ordinary name for a PRE-BUILT summary — parses as format `go`, its contents are read as an event
          # stream that yields nothing, and the runner disappears from the evidence without a word.
          case "$stem" in
            *.*) fmt="${stem##*.}" ;;
            *)   return 0 ;;
          esac
          case "$fmt" in
            junit|jest|go|opa|minitest) printf '%s' "$fmt" ;;
            *) return 0 ;;
          esac
        }

        # test_summary_runner <file> -> the runner name the evidence records.
        test_summary_runner() {
          local base stem
          base=$(basename "$1")
          stem="${base%.*}"
          if [ -n "$(test_summary_format "$1")" ]; then
            printf '%s' "${stem%.*}"
          else
            printf '%s' "$stem"
          fi
        }

        test_summary_from() {
          local file="$1" fmt
          # CONTENT DECIDES BEFORE THE NAME. A file that already carries `tool` and `summary` IS a summary,
          # whatever it is called — so a consumer that has been writing pre-built summaries keeps working even if
          # one of them happens to be named `<x>.go.json`, which the naming rule below would otherwise read as a
          # go event stream and reduce to nothing. The name is consulted only when the content does not answer.
          if jq -e 'type == "object" and has("tool") and has("summary")' "$file" >/dev/null 2>&1; then
            jq -c '{tool, summary}' "$file"
            return
          fi
          fmt=$(test_summary_format "$file")
          if [ -n "$fmt" ]; then
            python3 - "$(test_summary_runner "$file")" "$file" "$fmt" <<'TESTSUMMARY'
        import glob, json, re, sys, xml.etree.ElementTree as ET

        # Turns whatever the suite wrote into the ONE summary the SD-2.4.2 evidence carries:
        # {tool:{name,version}, summary:{total,passed,failed,skipped,errors}}.
        #
        # Five formats are built in, because five are what the estate's runners actually produce. `junit` covers
        # gradle, maven, pytest and anything with a JUnit reporter. `jest` reads jest's own `--json` output, which
        # exists because jest writes no JUnit without the extra `jest-junit` dependency — and asking a project to
        # add one to satisfy a report means editing its lockfile, which the CI install then has to accept under
        # `--frozen-lockfile`. A format nobody can adopt without changing their dependencies is one that gets
        # worked around with a hand-rolled converter in every repository that meets it.
        #
        # `go`, `opa` and `minitest` were exactly that hand-rolled converter, living in a platform repository
        # because this file did not read what those runners write. `go test -json` is a STREAM of events rather
        # than a report, `opa test --format=json` an array of per-test results, and minitest prints a summary
        # line and nothing machine-readable at all. A repository that runs four runners has to submit four
        # summaries, and until these were here it had to write its own reader for three of them.
        tool, pattern = sys.argv[1], sys.argv[2]
        fmt = sys.argv[3] if len(sys.argv) > 3 else "auto"


        def _counted_suites(node):
            """The suites whose counts are the report's, each test once.

            A `<testsuite>` may NEST: PHPUnit writes root -> class -> data-provider suites, and every level carries the
            totals of everything under it. Summing every level counted one run three times over (141 tests read as
            458). So a suite that states `tests` is taken whole and its children are not visited; only a suite without
            counts of its own — a bare grouping element — is looked inside. Gradle and pytest write flat suites, where
            this is the same as before.
            """
            if node.tag == "testsuite" and "tests" in node.attrib:
                yield node
                return
            for child in node:
                if child.tag == "testsuite":
                    yield from _counted_suites(child)


        def junit(paths):
            t = f = e = s = 0
            for fp in paths:
                try:
                    r = ET.parse(fp).getroot()
                except Exception:
                    continue
                for su in _counted_suites(r):
                    t += int(su.get("tests", 0)); f += int(su.get("failures", 0))
                    e += int(su.get("errors", 0)); s += int(su.get("skipped", 0))
            return t, t - f - e - s, f, s, e


        def jest(paths):
            """jest --json: counts at the top level, one file per run (or per shard).

            `numRuntimeErrorTestSuites` is reported as ERRORS rather than folded into failures or dropped: a suite
            that could not be imported ran no tests at all, so counting it as zero would let a broken suite look
            like a suite with nothing to say — the shape SD-2.4.2 exists to catch.
            """
            t = p = f = s = e = 0
            for fp in paths:
                try:
                    with open(fp) as fh:
                        r = json.load(fh)
                except Exception:
                    continue
                if "numTotalTests" not in r:
                    continue                      # some other JSON that happened to match the glob
                t += r.get("numTotalTests", 0); p += r.get("numPassedTests", 0)
                f += r.get("numFailedTests", 0); s += r.get("numPendingTests", 0)
                e += r.get("numRuntimeErrorTestSuites", 0)
            return t, p, f, s, e


        def go(paths):
            """`go test -json`: a STREAM of events, one JSON object per line.

            Only events carrying a `Test` name are counted. A package-level pass/fail event repeats the verdict of
            the tests inside it, so counting both doubles every number.
            """
            p = f = s_ = 0
            for fp in paths:
                try:
                    text = open(fp).read()
                except OSError:
                    continue
                for line in text.splitlines():
                    line = line.strip()
                    if not line.startswith("{"):
                        continue
                    try:
                        event = json.loads(line)
                    except json.JSONDecodeError:
                        continue
                    if not event.get("Test"):
                        continue
                    action = event.get("Action")
                    p += action == "pass"; f += action == "fail"; s_ += action == "skip"
            return p + f + s_, p, f, s_, 0


        def opa(paths):
            """`opa test --format=json`: an array of result objects, one per test.

            A test that ERRORED carries an `error` key and is NOT a failure: the policy counts TESTS_FAILED and
            TESTS_ERRORED separately, so collapsing them reports the wrong reason for the block.
            """
            t = p = f = s_ = e = 0
            for fp in paths:
                try:
                    results = json.load(open(fp))
                except (OSError, json.JSONDecodeError):
                    continue
                if not isinstance(results, list):
                    continue
                t += len(results)
                for r in results:
                    if r.get("error"): e += 1
                    elif r.get("skip"): s_ += 1
                    elif r.get("fail"): f += 1
                    else: p += 1
            return t, p, f, s_, e


        # "12 runs, 34 assertions, 0 failures, 0 errors, 1 skips" — minitest writes no machine format, so its own
        # summary line is the report.
        MINITEST_RE = re.compile(r"(\d+) runs?, \d+ assertions?, (\d+) failures?, (\d+) errors?, (\d+) skips?")


        def minitest(paths):
            t = f = e = s_ = 0
            for fp in paths:
                try:
                    text = open(fp).read()
                except OSError:
                    continue
                for runs, failures, errors_, skips in MINITEST_RE.findall(text):
                    t += int(runs); f += int(failures); e += int(errors_); s_ += int(skips)
            return t, t - f - e - s_, f, s_, e


        def detect(paths):
            """Which reader, decided by what the suite actually wrote.

            The alternative is asking every consumer to name a format they did not choose — jest writes JSON
            because it writes no JUnit without an extra dependency, and a gradle build writes XML because that is
            what gradle does. Neither is a decision worth an input, and SD-2.4.1's analyser detection has read the
            reports rather than asked since it was written.

            JUnit first when both are present: a project that configured a JUnit reporter meant it, and a
            `build/test-results` holding both is usually a JSON that is not a report at all — coverage summaries
            live there too, which is why the jest reader ignores files without its counters.
            """
            if any(p.endswith(".xml") for p in paths):
                return "junit"
            if any(p.endswith(".json") for p in paths):
                return "jest"
            return "junit"


        # An empty glob means "wherever runners conventionally write". Asking every project to redirect its
        # reporter into one directory is asking it to configure something it already configured — gradle writes
        # build/test-results, maven writes target/surefire-reports, jest-junit defaults to ./junit.xml — and the
        # projects that get it wrong do not fail loudly: the gate finds no reports and submits a suite of zero.
        DEFAULTS = (
            "**/build/test-results/**/*.xml", "**/build/test-results/**/*.json",
            "**/test-results/**/*.xml", "**/test-results/**/*.json",
            "**/target/surefire-reports/*.xml", "**/target/failsafe-reports/*.xml",
            "**/junit*.xml", "**/jest*.json", "**/test-report*.xml", "**/test-report*.json",
        )
        # Vendored trees hold fixtures with exactly these names — a `junit.xml` under node_modules is somebody
        # else's test data, and counting it would report a suite this project never ran.
        VENDORED = ("/node_modules/", "/.git/", "/.venv/", "/vendor/", "/.tool-cache/", "/.pnpm-store/")
        patterns = [pattern] if pattern else list(DEFAULTS)
        paths = sorted({p for pat in patterns for p in glob.glob(pat, recursive=True)
                        if not any(v in f"/{p}" for v in VENDORED)})
        if fmt == "auto":
            fmt = detect(paths)
            print(f"test summary: reading {len(paths)} report(s) as {fmt}", file=sys.stderr)
        READERS = {"junit": junit, "jest": jest, "go": go, "opa": opa, "minitest": minitest}
        total, passed, failed, skipped, errors = READERS.get(fmt, junit)(paths)
        print(json.dumps({"tool": {"name": tool, "version": "ci"},
                          "summary": {"total": total, "passed": passed, "failed": failed,
                                      "skipped": skipped, "errors": errors}}))
        TESTSUMMARY
          else
            jq -c '{tool, summary}' "$file"
          fi
        }

        # extra_test_summaries <dir> [workdir] -> one normalised summary file per runner worth submitting.
        #
        # A summary totalling zero is DROPPED. A runner that found no suite in THIS component has not failed, it
        # was not applicable: pytest is not a defect in a Go module. Submitting the zero would turn "nothing to
        # run here" into NO_TESTS_EXECUTED, the vacuous pass the policy exists to reject — so a correct pipeline
        # would be blocked by a runner that correctly did nothing.
        #
        # ONE LEVEL OF SUBDIRECTORY IS AN INSTANCE: `<instance>/<tool>.<format>.<ext>`. A component running one
        # tool over several source trees submits once per tree, and the evidence id and idempotency key have to
        # differ or the second submission REPLACES the first — the component then reports whichever tree went
        # last, looking healthy.
        #
        # The directory carries it rather than the file name. `tool.name` is checked against SD-2.4.2's approved
        # set of runners, which a project cannot extend, so anything a consumer adds to the NAME to tell two trees
        # apart comes back TEST_TOOL_NOT_APPROVED — which is exactly what happened when the tree's path was put
        # there. A directory is also unique by construction, so a consumer can use the full path of the tree and
        # needs no scheme for keeping short labels from colliding.
        #
        # Files directly in the directory are unchanged: no instance, slug from `tool.name`, exactly as before.
        extra_test_summaries() {
          local dir="$1" work="${2:-}" f out tmp total inst slug n
          [ -n "$dir" ] && [ -d "$dir" ] || return 0
          [ -n "$work" ] || work=$(mktemp -d)
          mkdir -p "$work"
          tmp="$work/.reading"
          for f in "$dir"/* "$dir"/*/*; do
            [ -f "$f" ] || continue
            test_summary_from "$f" > "$tmp" 2>/dev/null || continue
            total=$(jq -r '.summary.total // 0' "$tmp" 2>/dev/null) || continue
            case "$total" in ''|*[!0-9]*) continue ;; esac
            [ "$total" -gt 0 ] || continue
            inst=""
            [ "$(dirname "$f")" = "$dir" ] || inst=$(basename "$(dirname "$f")")
            slug=$(evidence_slug "$(jq -r '.tool.name // "unknown"' "$tmp" 2>/dev/null)" "$inst")
            out="$work/$slug.summary.json"
            # Two files that reduce to one slug — one tree writing both a junit and a minitest report for the
            # same tool — would otherwise overwrite each other, which is the loss the instance exists to prevent.
            n=1
            while [ -e "$out" ]; do n=$((n + 1)); out="$work/$slug-$n.summary.json"; done
            mv "$tmp" "$out"
            printf '%s\n' "$out"
          done
          rm -f "$tmp"
        }

        # evidence_slug <tool> <instance> -> the string an evidence id and an idempotency key can carry.
        #
        # Everything outside [A-Za-z0-9_.-] becomes a dash, so names differing only in punctuation collide; that
        # is accepted rather than unnoticed, because a component with two runners named `go test` and `go/test`
        # has a naming problem this cannot fix. What must NOT happen is an empty slug, which would make every
        # runner share one key.
        #
        # LENGTH IS BOUNDED because the evidence id is built from this and the id has a limit the producer cannot
        # see. An instance naming a deep source tree pushed one past it and the request was refused by the schema
        # with a bare `INVALID_REQUEST` — no field, no reason, indistinguishable from a broken gate. Truncating
        # alone would merge two long instances into one key, so the tail carries a checksum of the full name.
        # `cksum` rather than a digest: it is POSIX and present everywhere these scripts run, and the job is to
        # keep two names apart, not to resist anyone choosing one.
        evidence_slug() {
          local name="$1" inst="${2:-}" sum
          [ -n "$name" ] && [ "$name" != "null" ] || name="unknown"
          [ -z "$inst" ] || name="$name-$inst"
          name=$(printf '%s' "$name" | tr -c 'A-Za-z0-9_.-' '-')
          if [ "${#name}" -gt 48 ]; then
            sum=$(printf '%s' "$name" | cksum | cut -d' ' -f1)
            name="$(printf '%s' "$name" | cut -c1-39)-$(printf '%s' "$sum" | cut -c1-8)"
          fi
          printf '%s' "$name"
        }

        # runner_slug <summary-file> -> the slug its evidence id and idempotency key carry.
        #
        # extra_test_summaries names its output after the slug it computed, so this reads it back rather than
        # recomputing it: the instance comes from a directory that is no longer in the path by this point, and a
        # second derivation is a second thing to get wrong. Any file this did not write — a summary handed
        # straight to the gate — falls back to `tool.name`, exactly as before.
        runner_slug() {
          local base
          base=$(basename "$1")
          case "$base" in
            *.summary.json) printf '%s' "${base%.summary.json}"; return ;;
          esac
          evidence_slug "$(jq -r '.tool.name // "unknown"' "$1" 2>/dev/null)" ""
        }

        # test_evidence_envelope <summary-file> <slug> -> the SD-2.4.2 envelope, on stdout.
        #
        # Reads the same environment the gate's other envelopes do (SUP_PROVIDER, SUP_EXTERNAL_ID, COMPONENT_NAME,
        # SUP_PIPELINE_ID, SUP_JOB_ID, OBSERVED_AT, SRC, LINKS).
        #
        # `--slurpfile` rather than `--argjson "$(cat …)"`: a summary is small, but the gate's other envelopes
        # carry a 2000-package inventory the same way, and one shape for all of them is one thing to get right.
        #
        # `{tool, summary}` PROJECTS rather than merging the file whole. A producer is free to write extra keys —
        # timings, a command line, a runner's own metadata — and `payload: (… + $summary[0])` would carry all of
        # it into evidence the policy then has to ignore. Two keys are the contract; the rest is the producer's.
        test_evidence_envelope() {
          local summary="$1" slug="$2"
          jq -n \
            --arg prov "$SUP_PROVIDER" --arg pid "$SUP_EXTERNAL_ID" --arg comp "$COMPONENT_NAME" \
            --arg pipe "$SUP_PIPELINE_ID" --arg observed "$OBSERVED_AT" --arg runner "$slug" \
            --arg idem "sd242-${slug}-${SUP_PIPELINE_ID}-${SUP_JOB_ID}" \
            --argjson src "$SRC" --slurpfile summary "$summary" --argjson links "$LINKS" \
            '{ controlId: "SD-2.4.2", scope: "REPOSITORY", idempotencyKey: $idem,
               evidence: { evidenceId: ($prov + "-" + $pid + "-" + $comp + "-pipeline-" + $pipe + "-automated-tests-" + $runner),
                 evidenceType: "TEST_REPORT", observedAt: $observed, source: $src, artifacts: [],
                 payload: ({ format: "test-report/v1" } + ($summary[0] | {tool, summary}) + $links) } }'
        }
        # Keep the SD-2.4.3 evidence under the evaluation API's inline payload cap without changing its decision.
        #
        # The service refuses an evidence payload over MAX_INLINE_EVIDENCE_PAYLOAD_BYTES (128 KiB of canonical JSON)
        # with HTTP 413, and the gate then fails the control closed. A service image on a Debian base can list a
        # thousand-odd critical/high advisories, and the whole report no longer fits.
        #
        # What the policy reads decides what can go. Counts come from `tools[].findings`; the `findings` list is only
        # ever JOINED with `exceptions` on id (+ package) — to discount a waived finding, or to report a waiver that
        # lapsed or runs too long. So above the cap the findings an exception names are always kept, then as many of
        # the rest as fit, most severe first, and a last entry `{"id": "+N more", "omitted": N}` says how many were
        # left out. The decision is identical; the full list stays in the security-scan job's artifact.
        #
        # CRITICAL: `# @@`-inlined into a plain `bash -c` step, so this defines a function and runs nothing at
        # include time; it is also sourced by tests/bats/bound-security-payload.bats.

        bound_security_findings() {  # bound_security_findings <in.json> <out.json> <max bytes>
          local in="$1" out="$2" max="$3" size
          size=$(jq -c . "$in" | wc -c | tr -d ' ')
          if [ "$size" -le "$max" ]; then
            cp "$in" "$out"
            return 0
          fi
          jq -c --argjson max "$max" '
            def rank: {"critical": 0, "high": 1, "medium": 2, "low": 3}[.severity // ""] // 4;
            ([(.exceptions // [])[]? | .id // empty] | unique) as $ids
            | (.findings // []) as $all
            | [$all[] | select((.id // "") as $i | $ids | index($i))] as $named
            | ([$all[] | select((.id // "") as $i | ($ids | index($i)) | not)] | sort_by(rank)) as $rest
            # Room left once everything but the list is in, less a reserve for the "+N more" entry.
            | ((del(.findings) | tojson | length) + ($named | tojson | length) + 64) as $used
            | (reduce $rest[] as $f ({kept: [], size: $used};
                ($f | tojson | length + 1) as $l
                | if .size + $l <= $max then .kept += [$f] | .size += $l else . end)) as $fit
            | (($rest | length) - ($fit.kept | length)) as $omitted
            | .findings = $named + $fit.kept + (if $omitted > 0 then [{id: "+\($omitted) more", omitted: $omitted}] else [] end)
          ' "$in" > "$out"
          echo "SD-2.4.3: report is ${size} bytes, over ${max}; submitting $(jq '[.findings[] | select(.omitted | not)] | length' "$out") of $(jq '.findings | length' "$in") findings" >&2
        }
        # Build each control's evidence envelope into a FILE and submit the file. The dependency inventory (2000+
        # packages) and the security-scan report (findings + waivers) can be hundreds of KB — reading them as jq
        # `--slurpfile` from their files (and POSTing via curl @file) keeps them off the argv, which otherwise
        # overflows ("Argument list too long"). Small values (summaries, links) stay as --argjson.

        WORK="$(mktemp -d)"
        LINKS=$(jq -n --arg reporturl "$REPORT_URL" --arg pipeurl "$SUP_PIPELINE_URL" --arg joburl "$SUP_JOB_URL" \
          '{ report: { present: true, mediaType: "text/html", uri: $reporturl }, links: { pipeline: $pipeurl, gateJob: $joburl, checksArtifacts: $reporturl } }')
        # Security controls link to the SECURITY-SCAN job's artifacts (raw opengrep/trivy/osv/gitleaks reports
        # + SBOM), not the code-checks job's.
        SEC_LINKS=$(jq -n --arg reporturl "$SEC_REPORT_URL" --arg pipeurl "$SUP_PIPELINE_URL" --arg joburl "$SUP_JOB_URL" \
          '{ report: { present: true, mediaType: "application/json", uri: $reporturl }, links: { pipeline: $pipeurl, gateJob: $joburl, securityScanArtifacts: $reporturl } }')
        jq -n --arg prov "$SUP_PROVIDER" --arg pid "$SUP_EXTERNAL_ID" --arg comp "$COMPONENT_NAME" --arg pipe "$SUP_PIPELINE_ID" \
          --arg observed "$OBSERVED_AT" --arg idem "sd241-${SUP_PIPELINE_ID}-${SUP_JOB_ID}" \
          --argjson src "$SRC" --argjson summary "$ANALYSIS_SUMMARY" --argjson links "$LINKS" \
          '{ controlId: "SD-2.4.1", scope: "REPOSITORY", idempotencyKey: $idem,
             evidence: { evidenceId: ($prov + "-" + $pid + "-" + $comp + "-pipeline-" + $pipe + "-static-analysis"),
               evidenceType: "STATIC_ANALYSIS_REPORT", observedAt: $observed, source: $src, artifacts: [],
               payload: ({ format: "static-analysis-report/v1" } + $summary + $links) } }' > "$WORK/ev241.json"
        jq -n --arg prov "$SUP_PROVIDER" --arg pid "$SUP_EXTERNAL_ID" --arg comp "$COMPONENT_NAME" --arg pipe "$SUP_PIPELINE_ID" \
          --arg observed "$OBSERVED_AT" --arg idem "sd242-${SUP_PIPELINE_ID}-${SUP_JOB_ID}" \
          --argjson src "$SRC" --argjson summary "$TEST_SUMMARY" --argjson links "$LINKS" \
          '{ controlId: "SD-2.4.2", scope: "REPOSITORY", idempotencyKey: $idem,
             evidence: { evidenceId: ($prov + "-" + $pid + "-" + $comp + "-pipeline-" + $pipe + "-automated-tests"),
               evidenceType: "TEST_REPORT", observedAt: $observed, source: $src, artifacts: [],
               payload: ({ format: "test-report/v1" } + $summary + $links) } }' > "$WORK/ev242.json"
        # SCM-3.1 (trusted dependency sources) — payload is the dependency-inventory/v1 from the code-checks job.
        if [ -f supervisory/dependency-inventory.json ]; then
          INV_FILE=supervisory/dependency-inventory.json
        else
          echo "SCM-3.1: no dependency inventory from code-checks — submitting empty (policy fails closed)"
          echo '{"format":"dependency-inventory/v1"}' > "$WORK/inv.json"; INV_FILE="$WORK/inv.json"
        fi
        jq -n --arg prov "$SUP_PROVIDER" --arg pid "$SUP_EXTERNAL_ID" --arg comp "$COMPONENT_NAME" --arg pipe "$SUP_PIPELINE_ID" \
          --arg observed "$OBSERVED_AT" --arg idem "scm31-${SUP_PIPELINE_ID}-${SUP_JOB_ID}" \
          --argjson src "$SRC" --slurpfile inv "$INV_FILE" --argjson links "$LINKS" \
          '{ controlId: "SCM-3.1", scope: "REPOSITORY", idempotencyKey: $idem,
             evidence: { evidenceId: ($prov + "-" + $pid + "-" + $comp + "-pipeline-" + $pipe + "-dependency-inventory"),
               evidenceType: "DEPENDENCY_INVENTORY", observedAt: $observed, source: $src, artifacts: [], payload: ($inv[0] + $links) } }' > "$WORK/ev_scm31.json"
        # SD-2.4.3 (security scans) — payload is the security-scan/v1 from the security-scan job.
        if [ -f supervisory/security-scan.json ]; then
          SEC_FILE=supervisory/security-scan.json
        else
          echo "SD-2.4.3: no security-scan report — submitting empty (policy fails closed)"
          echo '{"format":"security-scan/v1"}' > "$WORK/sec.json"; SEC_FILE="$WORK/sec.json"
        fi
        # Under the API's inline payload cap (128 KiB), less a margin for the links merged in below.
        bound_security_findings "$SEC_FILE" "$WORK/sec-bounded.json" "${SD243_PAYLOAD_MAX_BYTES:-126976}"
        SEC_FILE="$WORK/sec-bounded.json"
        jq -n --arg prov "$SUP_PROVIDER" --arg pid "$SUP_EXTERNAL_ID" --arg comp "$COMPONENT_NAME" --arg pipe "$SUP_PIPELINE_ID" \
          --arg observed "$OBSERVED_AT" --arg idem "sd243-${SUP_PIPELINE_ID}-${SUP_JOB_ID}" \
          --argjson src "$SRC" --slurpfile sec "$SEC_FILE" --argjson links "$SEC_LINKS" \
          '{ controlId: "SD-2.4.3", scope: "REPOSITORY", idempotencyKey: $idem,
             evidence: { evidenceId: ($prov + "-" + $pid + "-" + $comp + "-pipeline-" + $pipe + "-security-scan"),
               evidenceType: "SECURITY_SCAN_REPORT", observedAt: $observed, source: $src, artifacts: [], payload: ($sec[0] + $links) } }' > "$WORK/ev_sec.json"
        # One SD-2.4.2 envelope per EXTRA runner, each naming itself. The evidenceId and the idempotency key carry
        # the runner too — without that the second submission would replace the first rather than join it, and a
        # component with four runners would end up reporting whichever one happened to go last.
        EXTRA_EVIDENCE=""
        for summary in ${EXTRA_SUMMARIES:-}; do
          safe=$(runner_slug "$summary")
          out="$WORK/ev242-${safe}.json"
          test_evidence_envelope "$summary" "$safe" > "$out"
          EXTRA_EVIDENCE="${EXTRA_EVIDENCE}${out} "
        done

        RC=0
        supervise "SD-2.4.1" "$WORK/ev241.json" || RC=1
        supervise "SD-2.4.2" "$WORK/ev242.json" || RC=1
        for extra in ${EXTRA_EVIDENCE:-}; do
          supervise "SD-2.4.2" "$extra" || RC=1
        done
        supervise "SCM-3.1" "$WORK/ev_scm31.json" || RC=1
        supervise "SD-2.4.3" "$WORK/ev_sec.json" || RC=1
        exit $RC

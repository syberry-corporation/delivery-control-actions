        SEC_NEED_DEPS=true
        [ "${SCAN_TARGET:-image}" = "sources" ] && SEC_NEED_DEPS=false

        sec_install() {  # sec_install <tool> [<what a failure means>]
          install_pinned_tool "$1" "${SEC_TOOLS_DIR}" "${SEC_TOOLS_DIR}/.archives" \
            || echo "$1 install failed${2:+ — $2}" >&2
        }

        warn_deprecated_version_input trivy "$TRIVY_VERSION" "$TRIVY_PIN_VERSION"
        if [ "$SEC_NEED_DEPS" != true ]; then
          echo "trivy: not needed for scan_target=sources" >&2
        else
          sec_install trivy
        fi

        warn_deprecated_version_input opengrep "$OPENGREP_VERSION" "$OPENGREP_PIN_VERSION"
        if [ "$SEC_OS" = windows ]; then
          echo "opengrep: no native Windows binary — code (SAST) dimension skipped; run under WSL to cover it" >&2
        else
          sec_install opengrep
        fi

        warn_deprecated_version_input osv-scanner "$OSV_SCANNER_VERSION" "$OSV_SCANNER_PIN_VERSION"
        if [ "$SEC_NEED_DEPS" != true ]; then
          echo "osv-scanner: not needed for scan_target=sources" >&2
        else
          sec_install osv-scanner
        fi

        warn_deprecated_version_input syft "$SYFT_VERSION" "$SYFT_PIN_VERSION"
        sec_install syft

        warn_deprecated_version_input gitleaks "$GITLEAKS_VERSION" "$GITLEAKS_PIN_VERSION"
        sec_install gitleaks

        if [ "${BUILD_CACHE:-false}" = "true" ] && [ "${SCAN_TARGET:-image}" = "image" ]; then
          warn_deprecated_version_input buildx "$BUILDX_VERSION" "$BUILDX_PIN_VERSION"
          export DOCKER_CONFIG="${DOCKER_CONFIG:-$HOME/.docker}"
          mkdir -p "${DOCKER_CONFIG}/cli-plugins"
          sec_install buildx "the build will fall back to the legacy builder"
          [ -x "${SEC_TOOLS_DIR}/docker-buildx" ] \
            && cp "${SEC_TOOLS_DIR}/docker-buildx" "${DOCKER_CONFIG}/cli-plugins/docker-buildx"
        fi

        if [ "$SEC_NEED_DEPS" = true ] && [ "${TRIVY_DB_FROM_ECR:-true}" = "true" ]; then
          if ! command -v aws >/dev/null 2>&1; then
            echo "trivy-db: trivy_db_from_ecr is on, but the aws CLI is not on PATH - using trivy's default DB sources" >&2
          else
            TDB_ACCOUNT="$(ecs_task_account)" || TDB_ACCOUNT=""
            if [ -z "$TDB_ACCOUNT" ]; then
              echo "trivy-db: trivy_db_from_ecr is on, but the account could not be resolved from ECS task metadata - using trivy's default DB sources" >&2
            else
              TDB_REGION="${AWS_REGION:-us-east-2}"
              TDB_REGISTRY="${TDB_ACCOUNT}.dkr.ecr.${TDB_REGION}.amazonaws.com"
              TDB_TOKEN="$(aws ecr get-login-password --region "$TDB_REGION" 2>/dev/null)" || TDB_TOKEN=""
              if [ -z "$TDB_TOKEN" ]; then
                echo "trivy-db: trivy_db_from_ecr is on, but an ECR token could not be obtained for ${TDB_REGISTRY} - using trivy's default DB sources" >&2
              else
                export DOCKER_CONFIG="${DOCKER_CONFIG:-$CI_PROJECT_DIR/.sec-cache/docker}"
                mkdir -p "$DOCKER_CONFIG"

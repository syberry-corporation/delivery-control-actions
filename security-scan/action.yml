            [ "$found" = 1 ] && return 0
            [ "$lookup" = ancestor ] && [ -n "$dir" ] || return 0
            case "$dir" in */*) dir="${dir%/*}" ;; *) dir="" ;; esac
          done
        }

        _locks_gradle_entries() {
          local facts="$1" prefix="$2" row dir build lock lockfiles
          jq -c '.projects[]? | select((.configurations // 0) > 0)' "$facts" | while IFS= read -r row; do
            dir=$(printf '%s' "$row" | jq -r '.dir')
            [ "$dir" = "." ] && dir=""
            build=$(printf '%s' "$row" | jq -r '.buildFile // "build.gradle"')
            lock=$(printf '%s' "$row" | jq -r '.lockfile // "gradle.lockfile"')
            dir="${prefix}${dir}"; dir="${dir%/}"
            _locks_skipped "${dir:+$dir/}$build" && continue
            lockfiles="[]"
            if [ -f "$_LOCKS_TOP/${dir:+$dir/}$lock" ]; then
              lockfiles="[$(_locks_lockfile_json "${dir:+$dir/}$lock")]"
            fi
            printf '%s' "$row" | jq -c --arg m "${dir:+$dir/}$build" --argjson l "$lockfiles" \
              '{ecosystem: "gradle", path: $m, lockfiles: $l, unpinned: 0, unpinnedSample: [],
                lockMode: (.lockMode // null), unlockedConfigurations: (.unlocked // [])}'
          done
        }

        collect_dependency_locks() {
          local gradle_facts="${1:-}" prefix f base rule eco lookup dir entries names n lockfiles
          if ! _LOCKS_TOP=$(git rev-parse --show-toplevel 2>/dev/null); then
            jq -cn '{format: "dependency-lock/v1", git: false, manifests: []}'
            return 0
          fi
          prefix=$(git rev-parse --show-prefix 2>/dev/null)
          entries=$(mktemp)

          git ls-files -- . | while IFS= read -r f; do
            base="${f##*/}"
            rule=$(_locks_rule "$base")
            [ -n "$rule" ] || continue
            f="${prefix}${f}"
            _locks_skipped "$f" && continue
            set -- $rule
            eco="$1"; lookup="$2"; shift 2
            [ "$eco" = gradle ] && [ -n "$gradle_facts" ] && [ -s "$gradle_facts" ] && continue
            _locks_declares "$eco" "$_LOCKS_TOP/$f" || continue
            case "$f" in */*) dir="${f%/*}" ;; *) dir="" ;; esac
            case "$lookup" in
              self) lockfiles="[$(_locks_lockfile_json "$f")]" ;;
              none) lockfiles="[]" ;;
              *) lockfiles=$(_locks_find "$dir" "$lookup" "$@" | jq -cs '.') ;;
            esac
            names=$(_locks_unpinned "$eco" "$_LOCKS_TOP/$f" | jq -Rcs 'split("\n") | map(select(length > 0))')
            n=$(printf '%s' "$names" | jq 'length')
            jq -cn --arg e "$eco" --arg p "$f" --argjson l "$lockfiles" --argjson n "$n" --argjson s "$names" \
              '{ecosystem: $e, path: $p, lockfiles: $l, unpinned: $n, unpinnedSample: ($s | unique | .[0:20])}'
          done > "$entries"

          if [ -n "$gradle_facts" ] && [ -s "$gradle_facts" ]; then
            _locks_gradle_entries "$gradle_facts" "$prefix" >> "$entries"
          fi

          jq -cs --arg root "${prefix:-.}" --arg ex "${DEPENDENCY_LOCKS_EXCLUDE:-}" \
            '{format: "dependency-lock/v1", git: true, root: ($root | sub("/$"; "")),
              excluded: ($ex | split(" ") | map(select(length > 0))), manifests: .}' "$entries"
          rm -f "$entries"
        }

        _locks_findings() {
          jq -r '
            if .git == false then "NOT_A_GIT_WORK_TREE\t.\tcannot tell a committed lockfile from a generated one"
            else .manifests[]? as $m
              | ( if $m.ecosystem == "maven" then "LOCKFILE_UNSUPPORTED\t\($m.path)\tMaven has no lockfile format"
                  elif ($m.lockfiles | length) == 0 then "LOCKFILE_MISSING\t\($m.path)\tno lockfile"
                  else empty end ),
                ( $m.lockfiles[] | select(.tracked | not)
                  | "LOCKFILE_NOT_COMMITTED\t\($m.path)\t\(.path) is not in git" ),
                ( $m.lockfiles[] | select(.modifiedByBuild)
                  | "LOCKFILE_OUT_OF_SYNC\t\($m.path)\tthe build rewrote \(.path)" ),
                ( select(($m | has("lockMode")) and ($m.lockfiles | length) > 0 and $m.lockMode != "STRICT")
                  | "LOCK_MODE_NOT_STRICT\t\($m.path)\tdependencyLocking lockMode is \($m.lockMode // "DEFAULT")" ),
                ( select(($m.unlockedConfigurations // []) | length > 0)
                  | "CONFIGURATION_NOT_LOCKED\t\($m.path)\t\($m.unlockedConfigurations | .[0:10] | join(", "))" ),
                ( select(($m.unpinned // 0) > 0)
                  | "DEPENDENCY_NOT_PINNED\t\($m.path)\t\($m.unpinned): \($m.unpinnedSample | join(", "))" )
            end' "$1"
        }

        assert_dependency_locks() {
          local locks="$1" mode="${2:-enforce}" findings count outcome tmp
          case "$mode" in enforce|report) ;; *) echo "dependency-locks: mode must be 'enforce' or 'report', got '${mode}'" >&2; return 1 ;; esac

          if [ ! -s "$locks" ]; then
            echo "dependency-locks: no facts at '${locks}' — the collector did not run" >&2
            [ "$mode" = enforce ] && return 1
            return 0
          fi

          findings=$(_locks_findings "$locks")
          count=$(printf '%s' "$findings" | grep -c . || true)
          if [ "$count" = 0 ]; then outcome=pass; else outcome=fail; fi

          tmp="${locks}.tmp"
          jq --arg mode "$mode" --arg outcome "$outcome" --argjson n "$count" \
            '. + {check: {name: "dependency-locks", mode: $mode, outcome: $outcome, findings: $n}}' "$locks" > "$tmp" \
            && mv "$tmp" "$locks"

          if [ "$outcome" = pass ]; then
            echo "dependency-locks: $(jq '.manifests | length' "$locks") manifest(s), every one locked"
            return 0
          fi

          {
            echo ""
            if [ "$mode" = enforce ]; then echo "DEPENDENCY LOCKS FAILED — ${count} finding(s):"
            else echo "dependency-locks: ${count} finding(s) — REPORTED, not enforced (the merge-request gate records mode=report):"; fi
            printf '%s\n' "$findings" | head -n 40 | awk -F '\t' '{ printf "  %-24s %s — %s\n", $1, $2, $3 }'
            [ "$count" -gt 40 ] && echo "  … and $((count - 40)) more (supervisory/dependency-locks.json)"
            echo ""
            echo "  Commit the lockfile the manifest's own tool writes, and install from it:"
            echo "    gradle  — dependencyLocking { lockAllConfigurations(); lockMode = LockMode.STRICT }, commit gradle.lockfile"
            echo "    npm     — package-lock.json / pnpm-lock.yaml / yarn.lock; npm ci, pnpm --frozen-lockfile"
            echo "    python  — uv.lock / poetry.lock / Pipfile.lock, or a requirements.txt with '==' on every line (pip-compile)"
            echo "    php     — composer.lock        ruby — Gemfile.lock        go — go.sum        rust — Cargo.lock"
            echo "    tofu    — 'version:' on every Terrafile mod with a remote source"
            echo "  A path that is not the project's own (a fixture, a vendored tree) goes in dependency_locks_exclude."
          } >&2
          [ "$mode" = enforce ] && return 1
          return 0
        }
        _locks_mode="${DEPENDENCY_LOCKS_CHECK:-enforce}"
        if [ "${REQUIRE_DEPENDENCY_LOCKS:-}" = "false" ] && [ "$_locks_mode" = "enforce" ]; then
          echo "dependency-locks: REQUIRE_DEPENDENCY_LOCKS=false is deprecated — running in 'report'. Use the" >&2
          echo "                  dependency_locks_check input; the merge-request gate records the mode either way." >&2
          _locks_mode=report
        fi
        _locks_facts=""
        [ -s supervisory/.gradle-locking.json ] && _locks_facts=supervisory/.gradle-locking.json
        mkdir -p supervisory
        collect_dependency_locks "$_locks_facts" > supervisory/dependency-locks.json
        assert_dependency_locks supervisory/dependency-locks.json "$_locks_mode"

        _sha256_of() {  # _sha256_of <file> → hex digest on stdout
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | cut -d' ' -f1
          elif command -v busybox >/dev/null 2>&1 && busybox sha256sum "$1" >/dev/null 2>&1; then
            busybox sha256sum "$1" | cut -d' ' -f1
          elif command -v openssl >/dev/null 2>&1; then
            openssl dgst -sha256 "$1" | awk '{print $NF}'
          else
            return 1
          fi
        }

        fetch_verified() {  # fetch_verified <url> <expected sha256> <dest>
          fetch_url "$1" > "$3" || { echo "fetch_verified: could not download $1" >&2; rm -f "$3"; return 1; }
          _fv_actual="$(_sha256_of "$3")" || {
            echo "fetch_verified: no sha256 tool in this image, refusing to use an unverified $3" >&2
            rm -f "$3"; return 1
          }
          if [ "$_fv_actual" != "$2" ]; then
            rm -f "$3"
            echo "fetch_verified: CHECKSUM MISMATCH for $1" >&2
            echo "  expected $2" >&2
            echo "  actual   $_fv_actual" >&2
            echo "  If this followed a version bump, update the matching *_sha256_* input; otherwise treat the" >&2
            echo "  download as untrusted and do not re-run until you know why it changed." >&2
            return 1
          fi
        }

        ensure_verified_pinned() {
          _evp_label="$1"; _evp_url="$2"; _evp_expected="$3"; _evp_dest="$4"

          if [ -z "$_evp_expected" ]; then
            echo "$_evp_label: no pinned checksum for this platform in tools_config.yml -- refusing to trust $_evp_dest" >&2
            return 1
          fi

          if [ -f "$_evp_dest" ]; then
            _evp_actual="$(_sha256_of "$_evp_dest" 2>/dev/null)"
            if [ "$_evp_actual" = "$_evp_expected" ]; then
              echo "$_evp_label: reused from cache (sha256 matches the pinned value)" >&2
              return 0
            fi
            echo "$_evp_label: cached copy does not match the pinned checksum -- discarding" >&2
            rm -f "$_evp_dest"
          fi

          fetch_url "$_evp_url" > "$_evp_dest" 2>/dev/null || {
            echo "$_evp_label: download failed" >&2
            rm -f "$_evp_dest"
            return 1
          }
          _evp_actual="$(_sha256_of "$_evp_dest")" || {
            echo "$_evp_label: no sha256 tool in this image, refusing to trust $_evp_dest" >&2
            rm -f "$_evp_dest"
            return 1
          }
          if [ "$_evp_actual" != "$_evp_expected" ]; then
            echo "$_evp_label: CHECKSUM MISMATCH against the pinned value for $_evp_dest (expected $_evp_expected, got $_evp_actual) -- discarding, not installed" >&2
            rm -f "$_evp_dest"
            return 1
          fi
        }

        warn_deprecated_version_input() {
          [ -n "$2" ] || return 0
          if [ "$2" != "$3" ]; then
            echo "$1: input version '$2' is ignored (deprecated) -- installing the pinned $3 from tools_config.yml instead" >&2
          else
            echo "$1: input version '$2' matches the current pin -- the input is deprecated and no longer needed (will be removed in a future major)" >&2
          fi
        }

        install_pinned_tool() {
          _ipt_tool="$1"; _ipt_bin_dir="$2"; _ipt_arc_dir="$3"; _ipt_label="${4:-$1}"
          _ipt_prefix="$(printf '%s' "$_ipt_tool" | tr 'a-z-' 'A-Z_')"
          eval "_ipt_version=\${${_ipt_prefix}_PIN_VERSION:-}; _ipt_binary=\${${_ipt_prefix}_PIN_BINARY:-}"
          eval "_ipt_url=\${${_ipt_prefix}_PIN_URL:-}; _ipt_sha=\${${_ipt_prefix}_PIN_SHA256:-}"
          eval "_ipt_archive=\${${_ipt_prefix}_PIN_ARCHIVE:-}"
          if [ -z "$_ipt_binary" ]; then
            echo "$_ipt_label: no pins for $_ipt_tool in this script — the caller needs a '# @@pins $_ipt_tool' marker" >&2
            return 1
          fi
          echo "$_ipt_label: pinned ${_ipt_version} (${SEC_OS:-?}/${SEC_ARCH:-?})" >&2
          mkdir -p "$_ipt_bin_dir" "$_ipt_arc_dir"
          if [ -n "$_ipt_archive" ]; then
            _ipt_dest="${_ipt_arc_dir}/${_ipt_tool}-${_ipt_version}-${SEC_OS:-}-${SEC_ARCH:-}.${_ipt_archive}"
            ensure_verified_pinned "$_ipt_label" "$_ipt_url" "$_ipt_sha" "$_ipt_dest" || return 1
            rm -f "${_ipt_bin_dir}/${_ipt_binary}"
            tar -xzf "$_ipt_dest" -C "$_ipt_bin_dir" "$_ipt_binary" >&2 || {
              echo "$_ipt_label: $_ipt_dest has no $_ipt_binary in it — not a $_ipt_tool release archive" >&2
              return 1
            }
          else
            ensure_verified_pinned "$_ipt_label" "$_ipt_url" "$_ipt_sha" "${_ipt_bin_dir}/${_ipt_binary}" || return 1
          fi
          chmod +x "${_ipt_bin_dir}/${_ipt_binary}"
        }

                [ -s "$TDB_CONFIG_FILE" ] || echo '{}' > "$TDB_CONFIG_FILE"
                TDB_AUTH="$(printf 'AWS:%s' "$TDB_TOKEN" | base64 | tr -d '\n')"
                if command -v jq >/dev/null 2>&1; then
                  TDB_NEW_CONFIG="$(jq --arg reg "$TDB_REGISTRY" --arg auth "$TDB_AUTH" \
                    '.auths[$reg] = {auth: $auth}' "$TDB_CONFIG_FILE")" \
                    && printf '%s' "$TDB_NEW_CONFIG" > "$TDB_CONFIG_FILE"
                else
                  echo "trivy-db: no jq available to merge ${TDB_CONFIG_FILE} - using trivy's default DB sources" >&2
                  TDB_TOKEN=""
                fi
                if [ -n "$TDB_TOKEN" ]; then
                  TDB_ECR_BASE="${TDB_REGISTRY}/ecr-public/aquasecurity"
                  export TRIVY_DB_REPOSITORY="${TDB_ECR_BASE}/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2"
                  export TRIVY_JAVA_DB_REPOSITORY="${TDB_ECR_BASE}/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1"
                  echo "trivy-db: DB sources: ${TDB_REGISTRY}/ecr-public/... first, mirror.gcr.io/ghcr.io as fallback" >&2
                fi

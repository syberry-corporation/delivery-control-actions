name: 'Security scan and dependency inventory'
description: >-
  Runs the Syberry security scan (Trivy, OpenGrep, osv-scanner, gitleaks — pinned and checksum-verified)
  and writes the two files the pull-request gate submits for SD-2.4.3 and SCM-3.1:
  `supervisory/security-scan.json` and `supervisory/dependency-inventory.json`. The same scripts as the
  GitLab `security-scan` jobs, so a component scores the same on either forge.
inputs:
  toolchain:
    description: 'How the dependency inventory is read: php | node | java | python'
    required: true
  project_path:
    description: 'Path to the component within the repository'
    default: '.'
  scan_target:
    description: >-
      `image` (default): build a throwaway image from `dockerfile` and scan it — for a component that ships
      a container. `filesystem`: scan the source tree only — for one that does not (a static frontend).
    default: 'image'
  dockerfile:
    description: 'Dockerfile the image scan builds, relative to the build context'
    default: 'Dockerfile'
  build_context:
    description: 'Docker build context, repository-root-relative. Empty: the component directory.'
    default: ''
  scan_path:
    description: 'Path (relative to the component) the code dimension scans'
    default: '.'
  opengrep_config:
    description: 'OpenGrep ruleset(s) for the code (SAST) dimension'
    default: 'p/security-audit'
  exceptions_file:
    description: 'Time-boxed waivers (id, package, reason, expires_on), relative to the component'
    default: 'ci/security/security-exceptions.json'
  trivy_ignorefile:
    description: 'Ignore file `trivy config` reads for misconfiguration findings. Empty: `.trivyignore`.'
    default: ''
  fail_on_findings:
    description: 'Fail this step on unwaived critical/high findings (the evidence is written either way)'
    default: 'true'
  dependency_locks_check:
    description: '`enforce` (default) fails the step on a manifest without a committed lockfile; `report` keeps it green and records the check as off in supervisory/dependency-locks.json'
    default: 'enforce'
  dependency_locks_exclude:
    description: 'Space-separated repository-relative globs the lock check skips (fixtures, vendored trees)'
    default: ''
  component_class:
    description: '`service` (default) or `wrapper` (a thin layer over a vendor image: filesystem scan only)'
    default: 'service'
  package_manager:
    description: 'node only — npm | yarn | pnpm. Empty: detected from the lockfile.'
    default: ''
  install_command:
    description: >-
      node only — how dependencies are installed before the inventory is read. Empty runs the package
      manager's frozen install, which enables corepack first; on Node < 16.9 (no corepack) pass it
      explicitly, e.g. `yarn install --frozen-lockfile`.
    default: ''
  codeartifact_url:
    description: 'java/node/python — a CodeArtifact repository URL to resolve through (needs AWS credentials)'
    default: ''

# The report files land under `<project_path>/supervisory/`. Upload that directory WITH its prefix (e.g.
# `path: <project_path>/supervisory/`, then download to the same path) for the PR gate to find them.
runs:
  using: composite
  steps:
    - name: Scan
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        PROJECT_PATH: ${{ inputs.project_path }}
        SCAN_TARGET: ${{ inputs.scan_target }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        BUILD_CONTEXT_INPUT: ${{ inputs.build_context }}
        SCAN_PATH: ${{ inputs.scan_path }}
        OPENGREP_CONFIG: ${{ inputs.opengrep_config }}
        EXCEPTIONS_FILE: ${{ inputs.exceptions_file }}
        TRIVY_IGNOREFILE_PATH: ${{ inputs.trivy_ignorefile }}
        FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
        DEPENDENCY_LOCKS_CHECK: ${{ inputs.dependency_locks_check }}
        DEPENDENCY_LOCKS_EXCLUDE: ${{ inputs.dependency_locks_exclude }}
        COMPONENT_CLASS: ${{ inputs.component_class }}
        PACKAGE_MANAGER: ${{ inputs.package_manager }}
        INSTALL_COMMAND: ${{ inputs.install_command }}
        CODEARTIFACT_URL: ${{ inputs.codeartifact_url }}
        # The trivy DB comes from the runner account's ECR pull-through cache on our own runners. A
        # GitHub-hosted runner is in no account of ours, so it reads trivy's public mirrors directly.
        TRIVY_DB_FROM_ECR: 'false'
        # osv-scanner against its local database rather than one API call per package, as on GitLab.
        OSV_OFFLINE: 'true'
        # A GitHub-hosted runner's docker is a plain daemon: no buildx registry cache to point at.
        BUILD_CACHE: 'false'
        # The scanner inputs the GitLab block still accepts are deprecated there; versions come from
        # tools_config.yml either way. Declared empty so the shared scripts read them under `set -u`.
        TRIVY_VERSION: ''
        OPENGREP_VERSION: ''
        OSV_SCANNER_VERSION: ''
        SYFT_VERSION: ''
        GITLEAKS_VERSION: ''
        BUILDX_VERSION: ''
      run: |
        # --- define: fetch_url ---
        # Fetch a URL to stdout with whichever downloader the job's image happens to have.
        #
        # Most blocks run on an image that ships curl, which is why curl is tried first. The container-build
        # blocks do not: the <workload>-build tag runs upstream kaniko (`executor:*-debug`, mirrored), which is
        # the executor plus busybox and — by the image's explicit design — nothing else. There is no curl in it.
        #
        # There is a wget: busybox provides `/busybox/wget`, `/busybox` is already on that image's PATH, and
        # `ssl_client` sits beside it so TLS works. So the only thing standing between the SBOM/provenance steps
        # and a working download was the literal name `curl`.
        #
        # The bootstrap container cannot paper over this: it symlinks a fixed list of busybox applets into the
        # job's PATH (sh, cat, tar, sed, awk, …) and neither curl nor wget is on that list.
        #
        # CRITICAL: this file is `# @@`-inlined into a caller script that runs as a plain `bash -c` step, not
        # sourced. The body is therefore only a function definition — nothing executes at inclusion time, and the
        # `return` below is function-scoped, so it cannot short-circuit the caller's remaining script steps.
        #
        # https ONLY, including across redirects. Every caller passes an https URL, but a 30x can point anywhere,
        # and both curl -L and urllib will happily follow one down to plain http — at which point the bytes are
        # whatever the network says they are. These are executables we then run, so the downgrade is refused.
        fetch_url() {  # fetch_url <url>  → response body on stdout
          case "$1" in https://*) ;; *) echo "fetch_url: refusing non-https URL: $1" >&2; return 1 ;; esac
          if command -v curl >/dev/null 2>&1; then
            curl -fsSL --proto '=https' --proto-redir '=https' "$1"
          elif command -v wget >/dev/null 2>&1; then
            # busybox wget has no --proto equivalent, and its built-in TLS does not validate certificates at all.
            # It is reached only on the kaniko image, where every caller pairs it with fetch_verified's pinned
            # sha256 — that checksum, not the transport, is what makes those downloads trustworthy.
            wget -qO- "$1"
          elif command -v python3 >/dev/null 2>&1; then
            # The toolchain images ship neither curl nor wget: `python:*-slim` has no curl AND no wget (nor jq,
            # nor git), so both branches above miss and every on-demand tool install died on
            # `curl: command not found` the first time a python job ran on a dynamic runner. python3 is by
            # definition present on those images.
            #
            # This path is STRONGER than the wget one, not a grudging last resort: urllib validates certificates
            # and hostnames by default (verified against expired/self-signed/wrong-host/untrusted-root).
            # copyfileobj streams — .read() would hold the whole body in memory, and awscli-exe is ~70 MiB
            # against the 512 MiB an `s`-sized lambda runner gets.
            python3 - "$1" <<'FETCH_URL_PY'
        import shutil, sys, urllib.request

        response = urllib.request.urlopen(sys.argv[1], timeout=60)
        # .url is the FINAL url after any redirects, and the body has not been transferred yet — it moves only
        # when copyfileobj asks for it. So bailing out here means nothing fetched over plain http is ever written.
        if not response.url.startswith("https://"):
            raise SystemExit("fetch_url: redirected off https to " + response.url)
        shutil.copyfileobj(response, sys.stdout.buffer)
        FETCH_URL_PY
          else
            echo "fetch_url: no curl, wget or python3 in this image" >&2
            return 1
          fi
        }

        # fetch_link_local <url> → response body on stdout. The OPPOSITE guard to fetch_url's, and deliberately
        # in the same file so the two contracts are read together.
        #
        # `fetch_url` refuses anything that is not https because what it fetches is executables that then run.
        # That guard is unconditional on purpose, and a caller who needs the ECS task metadata endpoint cannot
        # simply be allowed through it: that endpoint is `http://169.254.170.2/v4/<id>`, plain http, served by
        # the agent on the host, and it will never be anything else. Pointed at it, fetch_url printed
        # `refusing non-https URL` and returned 1 — which is correct, and which is how the security scan's layer
        # cache spent every run reporting that it could not resolve its account.
        #
        # So this one refuses everything EXCEPT the two link-local metadata addresses. Neither function can be
        # misused for the other's job: one cannot fetch metadata, the other cannot fetch a binary.
        #
        # What makes the missing https guard acceptable here is not that the data is unimportant — it is that
        # there is no network between us and the source. 169.254.0.0/16 is not routable off the host; the reply
        # comes from the agent in the same task. TLS would be protecting the loopback from itself.
        fetch_link_local() {  # fetch_link_local <url>  → response body on stdout
          case "$1" in
            http://169.254.170.2/*|http://169.254.169.254/*) ;;
            *) echo "fetch_link_local: refusing non-link-local URL: $1" >&2; return 1 ;;
          esac
          # Same three-way chain as above and for the same reason — the toolchain images disagree about which of
          # curl, wget and python3 they ship — minus the `--proto '=https'` flags, which would reject this URL.
          # Short timeouts throughout: a link-local endpoint answers in milliseconds or is not there at all, and
          # a caller that falls back to "no layer cache" must not first hang the job for a minute finding out.
          if command -v curl >/dev/null 2>&1; then
            curl -fsS --max-time 5 "$1"
          elif command -v wget >/dev/null 2>&1; then
            wget -qO- -T 5 "$1"
          elif command -v python3 >/dev/null 2>&1; then
            python3 -c 'import sys,urllib.request;sys.stdout.write(urllib.request.urlopen(sys.argv[1],timeout=5).read().decode())' "$1"
          else
            echo "fetch_link_local: no curl, wget or python3 available" >&2
            return 1
          fi
        }
        # --- install ---
        # --- @requires: fetch_url ---
        if [ -n "${GITHUB_ACTIONS:-}" ]; then
          : "${CI_PROJECT_DIR:=${GITHUB_WORKSPACE:-$PWD}}"
          : "${CI_COMMIT_SHA:=${GITHUB_SHA:-}}"
          : "${CI_COMMIT_SHORT_SHA:=$(printf '%s' "${GITHUB_SHA:-}" | cut -c1-8)}"
          : "${CI_COMMIT_REF_NAME:=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}}"
          : "${CI_SERVER_URL:=${GITHUB_SERVER_URL:-https://github.com}}"
          : "${CI_PROJECT_PATH:=${GITHUB_REPOSITORY:-}}"
          : "${CI_PROJECT_URL:=${CI_SERVER_URL}/${CI_PROJECT_PATH}}"
          : "${CI_PIPELINE_ID:=${GITHUB_RUN_ID:-}}"
          : "${CI_JOB_URL:=${CI_PROJECT_URL}/actions/runs/${GITHUB_RUN_ID:-}/attempts/${GITHUB_RUN_ATTEMPT:-1}}"
          _cgn_wf="${GITHUB_WORKFLOW_REF:-}"; _cgn_wf="${_cgn_wf%%@*}"; _cgn_wf="${_cgn_wf#*/}"; _cgn_wf="${_cgn_wf#*/}"
          : "${CI_CONFIG_PATH:=${_cgn_wf:-.github/workflows}}"
          export CI_PROJECT_DIR CI_COMMIT_SHA CI_COMMIT_SHORT_SHA CI_COMMIT_REF_NAME CI_SERVER_URL CI_PROJECT_PATH \
            CI_PROJECT_URL CI_PIPELINE_ID CI_JOB_URL CI_CONFIG_PATH
        fi
        cd "$CI_PROJECT_DIR"
        SEC_CACHE_COMPONENT="${PROJECT_PATH//\//-}"
        SEC_TOOLS_DIR="${RUNNER_TEMP:-/tmp}/sec-cache/bin"
        TRIVY_CACHE_DIR="${RUNNER_TEMP:-/tmp}/sec-cache/trivy"
        export SEC_CACHE_COMPONENT SEC_TOOLS_DIR TRIVY_CACHE_DIR
        set -uo pipefail

        if [ "${COMPONENT_CLASS:-service}" = "wrapper" ]; then
          if [ "${SCAN_TARGET:-image}" != "filesystem" ]; then
            echo "security scan: componentClass=wrapper — forcing scan_target=filesystem (vendor image is not scanned)" >&2
            SCAN_TARGET=filesystem
            export SCAN_TARGET
          fi
        fi

        mkdir -p "$SEC_TOOLS_DIR" "$TRIVY_CACHE_DIR"
        export PATH="${SEC_TOOLS_DIR}:${HOME}/.local/bin:${HOME}/.opengrep/cli/latest:${PATH}"
        SEC_PATH_PREFIX=""
        case "$PROJECT_PATH" in ""|.|./) ;; *) SEC_PATH_PREFIX="${PROJECT_PATH%/}" ;; esac
        export SEC_PATH_PREFIX

        cd "$PROJECT_PATH" || exit 1

        SEC_BUILD_CONTEXT="${CI_PROJECT_DIR}/${BUILD_CONTEXT_INPUT:-}"
        [ -n "${BUILD_CONTEXT_INPUT:-}" ] || SEC_BUILD_CONTEXT="${CI_PROJECT_DIR}/${PROJECT_PATH}"
        export SEC_BUILD_CONTEXT
        echo "security scan: docker build context ${SEC_BUILD_CONTEXT}" >&2

        BASE_IMAGE=""
        _dockerfile_path="${SEC_BUILD_CONTEXT}/${DOCKERFILE}"
        if [ -r "$_dockerfile_path" ]; then
          BASE_IMAGE=$(awk '
            tolower($1) == "from" {
              for (i = 2; i <= NF; i++) {
                if ($i ~ /^--/) continue          # skip --platform=linux/amd64
                if (tolower($i) == "as") break     # AS <alias> — done, no more image tokens
                print $i
                exit
              }
            }' "$_dockerfile_path" | head -n 1)
        fi
        export BASE_IMAGE
        echo "security scan: base image = ${BASE_IMAGE:-<not detected>}" >&2

        for extra in ${BUILD_CONTEXT_EXTRAS:-}; do
          [ -e "$CI_PROJECT_DIR/$extra" ] || { echo "build context extra '$extra' does not exist"; exit 1; }
          rm -rf "${SEC_BUILD_CONTEXT:?}/$(basename "$extra")"
          cp -r "$CI_PROJECT_DIR/$extra" "${SEC_BUILD_CONTEXT}/$(basename "$extra")"
        done

        touch "${SEC_BUILD_CONTEXT}/.dockerignore"
        for ignore in .sec-cache .tool-cache .gradle node_modules .pnpm-store; do
          grep -qxF "$ignore" "${SEC_BUILD_CONTEXT}/.dockerignore" 2>/dev/null \
            || echo "$ignore" >> "${SEC_BUILD_CONTEXT}/.dockerignore"
        done


        mkdir -p supervisory
        IMAGE_TAG="sec-scan-${CI_COMMIT_SHORT_SHA}:mr"
        # The dependency inventory is the one toolchain-specific step: which lockfile, and whether it needs
        # the dependencies installed to be read. Same scripts, same order as each GitLab toolchain's job.
        # The `@@` markers sit at the step's own column, NOT indented under their branch: the inliner keeps
        # a script's indentation relative to its marker, and a heredoc's closing word must start the line.
        case "$TOOLCHAIN" in
          php)

        INVENTORY_MAX_ENTRIES="${INVENTORY_MAX_ENTRIES:-200}"

        collapse_inventory() {
          jq --argjson max "$INVENTORY_MAX_ENTRIES" '
            def common_prefix($urls):
              ($urls | map(split("/"))) as $parts
              | $parts[0] as $first
              | [ foreach range(0; $first | length) as $i
                    (true; . and all($parts[]; (.[$i]? // null) == $first[$i]);
                     if . then $first[$i] else empty end) ]
              | join("/") | if endswith("/") then . else . + "/" end;

            if ((.dependencies // []) | length) <= $max then .
            else
              .dependencies |= ([ group_by(.source | capture("^(?<host>[a-z]+://[^/]+)").host // .source)[]
                | { name: (if length == 1 then .[0].name else "\(length) packages (e.g. \(.[0].name))" end),
                    version: (if length == 1 then .[0].version else "" end),
                    source: (if length == 1 then .[0].source else common_prefix(map(.source)) end),
                    packages: length,
                    unversioned: (map(select((.version // "" | gsub("^\\s+|\\s+$"; "")) == "")) | length) } ])
              | .collapsed = true
            end'
        }


        inventory_pnpm() {
          yq -o=json '.' "$1" | jq '{
            format: "dependency-inventory/v1",
            dependencies: ([ (.packages // {}) | to_entries[]
              | { name: (.key | sub("@[^@]+$"; "")),
                  version: ((.key | capture("@(?<v>[^@]+)$").v) // ""),
                  source: (.value.resolution.tarball // "https://registry.npmjs.org/") } ] | unique_by(.source)) }'
        }

        inventory_npm() {
          jq '{
            format: "dependency-inventory/v1",
            dependencies: ([ (.packages // {}) | to_entries[]
              | select(.value.resolved and (.value.link != true))
              | { name: (.key | sub("^node_modules/"; "")), version: (.value.version // ""), source: .value.resolved } ] | unique) }' "$1"
        }

        inventory_yarn() {
          awk '
            /^[^ #].*:$/ {
              header = $0
              sub(/:$/, "", header)
              split(header, alts, ", ")
              name = alts[1]
              gsub(/"/, "", name)
              at = match(name, /@[^@]*$/)
              if (at > 1) name = substr(name, 1, at - 1)
              version = ""; source = ""
              next
            }
            /^  version / { version = $2; gsub(/"/, "", version) }
            /^  resolved / {
              source = $2; gsub(/"/, "", source)
              if (name != "" && source != "") printf "%s\t%s\t%s\n", name, version, source
              name = ""
            }
          ' "$1" | jq -R -s '{
            format: "dependency-inventory/v1",
            dependencies: ([ split("\n")[] | select(length > 0) | split("\t")
              | { name: .[0], version: .[1], source: .[2] } ] | unique) }'
        }

        inventory_pip() {
          jq -s '{format:"dependency-inventory/v1",
            dependencies:([.[].install[]? | {name:.metadata.name, version:.metadata.version, source:(.download_info.url // "")}] | unique)}' "$@"
        }

        inventory_composer() {
          jq '{
            format: "dependency-inventory/v1",
            dependencies: ([ ((.packages // []) + (.["packages-dev"] // []))[]
              | { name: .name, version: (.version // ""), source: (.dist.url // .source.url // "") }
              | select(.source != "") ] | unique) }' "$1"
        }

        emit_inventory() {
          case "$2" in
            pnpm) inventory_pnpm "$1" | collapse_inventory ;;
            npm) inventory_npm "$1" | collapse_inventory ;;
            yarn) inventory_yarn "$1" | collapse_inventory ;;
            composer) inventory_composer "$1" | collapse_inventory ;;
            *) echo '{"format":"dependency-inventory/v1"}' ;;
          esac
        }


        source_excludes() {  # source_excludes  -> prints a space-separated list of directory names
          local base="build target out dist node_modules .pnpm-store .pipcache .gradle .tool-cache .sec-cache"
          local d
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            for d in */ .*/; do
              d="${d%/}"
              case "$d" in .|..|.git) continue ;; esac
              [ -d "$d" ] || continue
              if [ -z "$(git ls-files -- "$d" 2>/dev/null | head -n1)" ]; then
                case " $base " in *" $d "*) ;; *) base="$base $d" ;; esac
              fi
            done
          fi
          printf '%s' "$base"
        }
        INVENTORY_MAX_ENTRIES="${INVENTORY_MAX_ENTRIES:-200}"

        collapse_inventory() {
          jq --argjson max "$INVENTORY_MAX_ENTRIES" '
            def common_prefix($urls):
              ($urls | map(split("/"))) as $parts
              | $parts[0] as $first
              | [ foreach range(0; $first | length) as $i
                    (true; . and all($parts[]; (.[$i]? // null) == $first[$i]);
                     if . then $first[$i] else empty end) ]
              | join("/") | if endswith("/") then . else . + "/" end;

            if ((.dependencies // []) | length) <= $max then .
            else
              .dependencies |= ([ group_by(.source | capture("^(?<host>[a-z]+://[^/]+)").host // .source)[]
                | { name: (if length == 1 then .[0].name else "\(length) packages (e.g. \(.[0].name))" end),
                    version: (if length == 1 then .[0].version else "" end),
                    source: (if length == 1 then .[0].source else common_prefix(map(.source)) end),
                    packages: length,
                    unversioned: (map(select((.version // "" | gsub("^\\s+|\\s+$"; "")) == "")) | length) } ])
              | .collapsed = true
            end'
        }

        inventory_syft() {
          _syft_dir="${1:-.}"
          if ! command -v syft >/dev/null 2>&1; then
            echo "SCM-3.1: syft not available — cross-ecosystem discovery skipped" >&2
            echo '{"format":"dependency-inventory/v1","dependencies":[]}'
            return 0
          fi

          _syft_abs=$(cd "$_syft_dir" 2>/dev/null && pwd -P) || {
            echo "SCM-3.1: ${_syft_dir} is not a directory — cross-ecosystem discovery skipped" >&2
            echo '{"format":"dependency-inventory/v1","dependencies":[]}'
            return 0
          }

          _syft_excludes=""
          for _syft_x in $(source_excludes) .git .terraform .terraspace-cache; do
            _syft_excludes="${_syft_excludes} --exclude ./**/${_syft_x}/**"
          done
          if ! syft scan "dir:${_syft_abs}" \
                 ${_syft_excludes} \
                 -o cyclonedx-json="${_syft_abs}/.syft-inventory.json" -q >&2 2>/dev/null; then
            echo "SCM-3.1: syft scan failed — cross-ecosystem discovery skipped" >&2
            echo '{"format":"dependency-inventory/v1","dependencies":[]}'
            return 0
          fi

          jq -c '
            def src($t):
              if   $t == "pypi"   then "https://files.pythonhosted.org/"
              elif $t == "npm"    then "https://registry.npmjs.org/"
              elif $t == "golang" then "https://proxy.golang.org/"
              elif $t == "gem"    then "https://rubygems.org/"
              elif $t == "maven"  then "https://repo.maven.apache.org/maven2/"
              elif $t == "github" then "https://github.com/"
              else "" end;
            {format: "dependency-inventory/v1",
             dependencies: [ .components[]?
               | select(.purl != null and .purl != "")
               | (.purl | split(":")[1] | split("/")[0]) as $type
               | src($type) as $s
               | select($s != "")
               | {name: (.name // ""), version: (.version // ""), source: $s} ]
               | unique_by([.name, .version, .source]) }
          ' "${_syft_abs}/.syft-inventory.json"

          rm -f "${_syft_abs}/.syft-inventory.json"
        }

        merge_inventories() {  # merge_inventories <primary.json> <secondary.json>
          jq -s -c '
            if (.[0] | has("dependencies") | not) then .[0]
            else
              (.[0].dependencies // []) as $primary
              | ($primary | map([.name, .version])) as $seen
              | (.[0] | del(.dependencies)) + {format: "dependency-inventory/v1",
                 dependencies: ($primary + [ (.[1].dependencies // [])[]
                                             | select(([.name, .version] | IN($seen[])) | not) ])}
            end
          ' "$1" "$2"
        }

        augment_with_discovery() {
          _aug_file="$1"
          [ -s "$_aug_file" ] || return 0
          _aug_dir=$(dirname "$_aug_file")

          inventory_syft . > "${_aug_dir}/.discovered.json" || return 0
          _aug_n=$(jq '.dependencies | length' "${_aug_dir}/.discovered.json" 2>/dev/null || echo 0)

          if merge_inventories "$_aug_file" "${_aug_dir}/.discovered.json" > "${_aug_dir}/.merged.json" \
               && [ -s "${_aug_dir}/.merged.json" ]; then
            if command -v collapse_inventory >/dev/null 2>&1; then
              collapse_inventory < "${_aug_dir}/.merged.json" > "${_aug_dir}/.collapsed.json" \
                && mv "${_aug_dir}/.collapsed.json" "${_aug_dir}/.merged.json"
              rm -f "${_aug_dir}/.collapsed.json"
            fi
            mv "${_aug_dir}/.merged.json" "$_aug_file"
            echo "SCM-3.1: ${_aug_n} dependency/ies discovered across ecosystems, merged in" >&2
          else
            echo "SCM-3.1: merge of discovered dependencies failed — keeping the toolchain inventory" >&2
            rm -f "${_aug_dir}/.merged.json"
          fi
          rm -f "${_aug_dir}/.discovered.json"
        }
        mkdir -p supervisory
        if [ -f composer.lock ]; then
          emit_inventory composer.lock composer > supervisory/dependency-inventory.json
          echo "SCM-3.1: composer inventory from composer.lock with $(jq '(.dependencies // []) | length' supervisory/dependency-inventory.json) source(s)"

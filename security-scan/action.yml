        ecs_task_account() {
          [ -n "${ECS_CONTAINER_METADATA_URI_V4:-}" ] || return 0
          command -v jq >/dev/null 2>&1 || return 0
          fetch_link_local "${ECS_CONTAINER_METADATA_URI_V4}/task" 2>/dev/null \
            | jq -r '.TaskARN // empty' | cut -d: -f5
        }

        sec_scan_build_image() {
          _sbi_dockerfile="$1"; _sbi_tag="$2"; _sbi_context="$3"
          if [ "${BUILD_CACHE:-false}" != "true" ]; then
            docker build -f "$_sbi_dockerfile" -t "$_sbi_tag" "$_sbi_context" >&2
            return
          fi
          if ! docker buildx version >/dev/null 2>&1; then
            echo "sec-scan: build_cache asked for, but docker buildx is not available - falling back to plain docker build" >&2
            docker build -f "$_sbi_dockerfile" -t "$_sbi_tag" "$_sbi_context" >&2
            return
          fi
          _sbi_account="$(ecs_task_account)" || _sbi_account=""
          if [ -z "$_sbi_account" ]; then
            echo "sec-scan: build_cache asked for, but the account could not be resolved from ECS task metadata - falling back to plain docker build" >&2
            docker build -f "$_sbi_dockerfile" -t "$_sbi_tag" "$_sbi_context" >&2
            return
          fi
          _sbi_registry="${_sbi_account}.dkr.ecr.${AWS_REGION:-us-east-2}.amazonaws.com"
          _sbi_ref="${_sbi_registry}/build-cache:sec-${SEC_CACHE_COMPONENT:-unknown}"
          _sbi_cache_ref="${_sbi_ref}-cache"
          if ! command -v aws >/dev/null 2>&1; then
            echo "sec-scan: build_cache asked for, but the aws CLI is not on PATH - the job must declare it in requires: - falling back to plain docker build" >&2
            docker build -f "$_sbi_dockerfile" -t "$_sbi_tag" "$_sbi_context" >&2
            return
          fi
          if command -v aws >/dev/null 2>&1; then
            aws ecr get-login-password --region "${AWS_REGION:-us-east-2}" 2>/dev/null \
              | docker login --username AWS --password-stdin "$_sbi_registry" >/dev/null 2>&1 \
              || {
                echo "sec-scan: ECR login for build cache failed - falling back to plain docker build" >&2
                docker build -f "$_sbi_dockerfile" -t "$_sbi_tag" "$_sbi_context" >&2
                return
              }
          fi
          echo "sec-scan: buildx layer cache: ${_sbi_ref}" >&2
          _sbi_builder=""
          if docker buildx create --name sec-scan --driver docker-container \
              --driver-opt "image=${SEC_BUILDKIT_IMAGE:-moby/buildkit:v0.33.0}" \
              --bootstrap >/dev/null 2>&1; then
            _sbi_builder="sec-scan"
          else
            echo "sec-scan: no docker-container builder - using the inline cache, so earlier build stages will not be cached" >&2
          fi
          if [ -n "$_sbi_builder" ]; then
            docker buildx build \
              --builder "$_sbi_builder" \
              --load \
              -f "$_sbi_dockerfile" \
              -t "$_sbi_tag" \
              --cache-from="type=registry,ref=${_sbi_cache_ref}" \
              --cache-from="type=registry,ref=${_sbi_ref}" \
              --cache-to="type=registry,ref=${_sbi_cache_ref},mode=max" \
              "$_sbi_context" >&2 || return
          else
            docker buildx build \
              --load \
              -f "$_sbi_dockerfile" \
              -t "$_sbi_tag" \
              -t "$_sbi_ref" \
              --cache-from="type=registry,ref=${_sbi_cache_ref}" \
              --cache-from="type=registry,ref=${_sbi_ref}" \
              --cache-to="type=inline" \
              "$_sbi_context" >&2 || return
            docker push "$_sbi_ref" >/dev/null \
              || echo "sec-scan: could not push the layer cache to ${_sbi_ref} - the next run rebuilds from scratch (the registry's own message is above)" >&2
          fi
        }


        blocking_findings() {
          jq --arg today "$2" '. as $r
            | [ .findings[]? | select(.severity=="critical" or .severity=="high") | . as $f
                | select(($r.exceptions // []) | any(.id==$f.id and (.package=="" or .package==$f.package) and .expires_on>=$today) | not) ]' \
            "$1"
        }

        _osv_defs='def sev($g): (($g.max_severity // "" | tonumber?) // -1);
          def bucket($n): if $n>=9 then "critical" elif $n>=7 then "high" elif $n>=4 then "medium" elif $n>0 then "low" else "unknown" end;'

        _osv_key='(($p.package.name // "") + "|" + (($p.package.ecosystem // "") | tostring) + "|" + ((.ids // []) | sort | join(",")))'

        osv_counts() {
          jq -n --slurpfile o "$1" "$_osv_defs"'
            [ $o[0].results[]?.packages[]? as $p | $p.groups[]?
              | {k:'"$_osv_key"', b:bucket(sev(.))} ] | unique_by(.k) | map(.b) as $b
            | {critical:([$b[]|select(.=="critical")]|length), high:([$b[]|select(.=="high")]|length),
               medium:([$b[]|select(.=="medium")]|length), low:([$b[]|select(.=="low")]|length),
               unknown:([$b[]|select(.=="unknown")]|length)}'
        }

        osv_findings() {
          jq -n --slurpfile o "$1" "$_osv_defs"'
            [ $o[0].results[]?.packages[]? as $p | $p.groups[]? | . as $g | bucket(sev($g)) as $sv
              | select($sv=="critical" or $sv=="high")
              | {k:'"$_osv_key"',
                 v:{id:($g.ids[0] // ($g.aliases // [])[0] // "OSV-UNKNOWN"), severity:$sv,
                    dimension:"dependencies", package:($p.package.name // ""), tool:"osv-scanner"}} ]
            | unique_by(.k) | map(.v)'
        }

        resolution_guidance() {
          _rg_blocking="$1"
          _rg_exceptions="$2"
          _rg_allowlist="$(dirname "$_rg_exceptions")/gitleaks-allowlist.txt"

          printf '\nHOW TO RESOLVE\n'
          for _rg_dim in $(printf '%s' "$_rg_blocking" | jq -r '[.[].dimension] | unique | .[]'); do
            _rg_n=$(printf '%s' "$_rg_blocking" | jq --arg d "$_rg_dim" '[.[]|select(.dimension==$d)]|length')
            _rg_id=$(printf '%s' "$_rg_blocking" | jq -r --arg d "$_rg_dim" 'map(select(.dimension==$d))[0].id')
            _rg_pkg=$(printf '%s' "$_rg_blocking" | jq -r --arg d "$_rg_dim" 'map(select(.dimension==$d))[0].package')
            printf '\n  %s — %s finding(s)\n' "$_rg_dim" "$_rg_n"
            case "$_rg_dim" in
              secrets)
                printf '    A REAL credential is never waived: rotate it, remove it from the source (and from the\n'
                printf '    history if it was pushed), then re-run. A waiver would leave a live secret in the repo.\n'
                printf '    A FALSE positive — an identifier or business key the generic rules misread — goes in\n'
                printf '    %s, which does not expire:\n' "$_rg_allowlist"
                printf '      line:^my\\.property\\.name=          one LINE, wherever it appears (PREFERRED)\n'
                printf '      (^|/)path/to/data\\.json$           a PATH: that file stops being scanned entirely\n'
                printf '    Prefer the line: form — a path exclusion also hides a credential added to that file later.\n'
                printf '    This finding is at: %s\n' "$_rg_pkg"
                ;;
              dependencies)
                printf '    Fix: raise the package to the version the scanner reports as fixed, in the manifest that\n'
                printf '    declares it, and commit the refreshed lockfile. Where a package arrives transitively the\n'
                printf '    override goes where the resolution is decided, not where the package is named:\n'
                printf '      python  — pin in requirements.txt / pyproject, re-resolve (pip-compile)\n'
                printf '      node    — `overrides` (npm) or `resolutions` (yarn/pnpm), then refresh the lockfile\n'
                printf '      go      — `go get <mod>@<version>`, which updates go.mod and go.sum together\n'
                printf '      ruby    — raise the floor in the Gemfile, then `bundle update <gem>`\n'
                printf '      java    — if a BOM manages the version, override the managed one (ext[%s] in\n' "'<lib>.version'"
                printf '                build.gradle): io.spring.dependency-management wins over `constraints { strictly }`\n'
                printf '    If the package is compiled INTO a vendored binary this repository does not build, there is\n'
                printf '    no version to raise here and the fix is an upstream release — that is a defer, not a fix.\n'
                _rg_defer=plain
                ;;
              image)
                printf '    This is a package in the SCANNED IMAGE, not a dependency this repository declares, so\n'
                printf '    there is usually nothing in a manifest to raise. In order of preference:\n'
                printf '      - rebuild on a newer base image (the fix is normally already published there);\n'
                printf '      - upgrade the package explicitly in the Dockerfile (`apk upgrade <pkg>`, `apt-get\n'
                printf '        install --only-upgrade <pkg>`) — check first that a fixed version actually exists,\n'
                printf '        because an upgrade that changes nothing reads like a fix and is not one;\n'
                printf '      - drop the package, if what pulled it in is not needed in the final stage.\n'
                printf '    A base image that has not shipped the fix yet is a defer, not a fix.\n'
                _rg_defer=plain
                ;;
              code)
                printf '    Fix the reported code path. If you are not going to, there are TWO mechanisms and they\n'
                printf '    do not mean the same thing — pick by whether the finding is WRONG or merely UNFIXED.\n'
                printf '\n'
                printf '    (1) The rule does not apply to this code and never will. Ignore it AT THE LINE, which is\n'
                printf '    where the reason belongs and where a reviewer meets it in the diff.\n'
                printf '\n'
                printf '    The comment is the one the REPORTING scanner reads. They do not read each other'"'"'s, and\n'
                printf '    a finding is suppressed only by its own:\n'
                _rg_tkey='(if (.tool // "")=="" then "-" else .tool end)'
                for _rg_tool in $(printf '%s' "$_rg_blocking" | jq -r --arg d "$_rg_dim" \
                      "[.[]|select(.dimension==\$d)|$_rg_tkey]|unique|.[]"); do
                  _rg_tid=$(printf '%s' "$_rg_blocking" | jq -r --arg d "$_rg_dim" --arg t "$_rg_tool" \
                    "map(select(.dimension==\$d and $_rg_tkey==\$t))[0].id")
                  [ "$_rg_tool" = - ] && _rg_lbl='' || _rg_lbl="   [$_rg_tool]"
                  case "$_rg_tool" in
                    opengrep)
                      printf '      # nosemgrep: %s  <why the rule is wrong here>%s\n' "$_rg_tid" "$_rg_lbl"
                      printf '      <the line it fires on>\n'
                      printf '        Honoured ONLY on the offending line or the one directly above it, so nothing\n'
                      printf '        may come between them — and a Dockerfile instruction cannot carry a trailing\n'
                      printf '        comment, so there it has to be the line above.\n'
                      ;;
                    *)
                      printf '      #trivy:ignore:%s  <why the rule is wrong here>%s\n' "$_rg_tid" "$_rg_lbl"
                      printf '      <the line it fires on>\n'
                      printf '        Do NOT add `exp:` — the expiry is not honoured on an inline ignore, so one\n'
                      printf '        written with a date looks time-boxed and lasts forever. Time-boxed is (2).\n'
                      ;;
                  esac
                done
                printf '    Permanent, and scoped to that one rule in that one file. It does NOT reach the evidence:\n'
                printf '    the finding is never reported at all, so it is the wrong tool for a real finding.\n'
                printf '\n'
                printf '    If BOTH scanners fire on the SAME line, they cannot both be answered inline: each wants\n'
                printf '    the line directly above, and there is only one. Give it to opengrep — its only other\n'
                printf '    option is excluding the file from scanning entirely, which hides every other rule on it\n'
                printf '    too — and move trivy'"'"'s half to a `.trivyignore` beside the code, which is file-scoped by\n'
                printf '    design. Putting them the other way round silently hands the finding back to opengrep.\n'
                _rg_defer=numbered
                ;;
              *)
                printf '    Fix it, or add a documented waiver (id + package + reason + expires_on) to %s.\n' "$_rg_exceptions"
                ;;
            esac

            if [ -n "${_rg_defer:-}" ]; then
              if [ "$_rg_defer" = numbered ]; then _rg_lead='(2) '; else _rg_lead=''; fi
              _rg_defer=
              printf '\n'
              printf '    %sThe finding is REAL and cannot be fixed yet. Defer it, time-boxed, in %s:\n' "$_rg_lead" "$_rg_exceptions"
              printf '      {"exceptions": [{"id": "%s", "package": "%s",\n' "$_rg_id" "$_rg_pkg"
              printf '                       "reason": "why this cannot be fixed yet", "expires_on": "YYYY-MM-DD"}]}\n'
              printf '    An empty "package" waives that id wherever it appears; naming one scopes the waiver to it.\n'
              printf '    expires_on is within ~1 month and re-checked against the SERVER clock, so a date in the\n'
              printf '    past or too far out does not help. This one DOES reach the evidence: the policy records a\n'
              printf '    SECURITY_FINDING_WAIVED advisory, so the audit log carries the discount and its reason.\n'
            fi
          done
        }

        osv_scan_flags() {
          _osf_cache="$1"
          _osf_marker="$_osf_cache/.osv-db-fetched"
          _osf_max_age_h="${OSV_DB_MAX_AGE_HOURS:-12}"
          _osf_fresh=false
          if [ -f "$_osf_marker" ]; then
            _osf_ts="$(cat "$_osf_marker" 2>/dev/null)"
            case "$_osf_ts" in ''|*[!0-9]*) _osf_ts=0 ;; esac
            _osf_now="$(date +%s)"
            [ "$_osf_ts" -gt "$_osf_now" ] && _osf_ts=0
            [ $(( (_osf_now - _osf_ts) / 3600 )) -lt "$_osf_max_age_h" ] && _osf_fresh=true
          fi
          if [ "$_osf_fresh" = "true" ] \
             && [ -n "$(find "$_osf_cache" -path '*/osv-scalibr/*/all.zip' 2>/dev/null | head -1)" ]; then
            echo "--offline-vulnerabilities"
          else
            echo "--offline-vulnerabilities --download-offline-databases"
          fi
        }

        osv_run() {
          _or_err="$(mktemp)"
          _or_flags="$(osv_scan_flags "$XDG_CACHE_HOME")"
          _or_sub=""
          while [ $# -gt 0 ]; do
            case "$1" in scan|source|image) _or_sub="$_or_sub $1"; shift ;; *) break ;; esac
          done
          osv-scanner $_or_sub $_or_flags "$@" 2>"$_or_err"
          _or_rc=$?
          if ! printf '%s' "$_or_flags" | grep -q -- '--download-offline-databases' \
             && grep -q 'no offline version of the OSV database is available' "$_or_err"; then
            echo "dependencies (cross-check): osv-scanner needs an ecosystem the cached databases don't have yet — refreshing" >&2
            _or_flags="--offline-vulnerabilities --download-offline-databases"
            osv-scanner $_or_sub $_or_flags "$@" 2>"$_or_err"
            _or_rc=$?
          fi
          cat "$_or_err" >&2
          if printf '%s' "$_or_flags" | grep -q -- '--download-offline-databases' \
             && { [ "$_or_rc" -eq 0 ] || [ "$_or_rc" -eq 1 ]; } \
             && ! grep -q 'unable to fetch OSV database' "$_or_err"; then
            date +%s > "$XDG_CACHE_HOME/.osv-db-fetched"
          fi
          rm -f "$_or_err"
          return "$_or_rc"
        }

        TOOLS='[]'; FINDINGS='[]'


        source_excludes() {  # source_excludes  -> prints a space-separated list of directory names
          local base="build target out dist node_modules .pnpm-store .pipcache .gradle .tool-cache .sec-cache"
          local d
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            for d in */ .*/; do
              d="${d%/}"
              case "$d" in .|..|.git) continue ;; esac
              [ -d "$d" ] || continue
              if [ -z "$(git ls-files -- "$d" 2>/dev/null | head -n1)" ]; then
                case " $base " in *" $d "*) ;; *) base="$base $d" ;; esac
              fi
            done
          fi
          printf '%s' "$base"
        }

        gitleaks_write_config() {  # gitleaks_write_config <out.toml> <allowlist-file> [excluded-dir ...]
          local out="$1" allowlist="$2" extra="" lines="" x entry escaped
          shift 2
          for x in "$@"; do
            extra="$extra, \"(^|/)$(printf '%s' "$x" | sed 's/\./\\\\./g')/\""
          done
          if [ -f "$allowlist" ]; then
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              escaped=$(printf '%s' "$entry" | sed 's/\\/\\\\/g')
              case "$entry" in
                line:*) lines="$lines, \"(?m)${escaped#line:}\"" ;;
                *) extra="$extra, \"$escaped\"" ;;
              esac
            done <<EOF
        $(grep -vE '^\s*(#|$)' "$allowlist")
        EOF
            echo "secrets: gitleaks allowlist extended from ${allowlist}" >&2
          fi
          {
            printf '%s\n' '[extend]' 'useDefault = true' '' '[allowlist]' 'description = "supervisory tool cache + this job'"'"'s own scan outputs"' 'paths = ["\\.sec-cache/", "(^|/)(og|tvfs|tvimg|tvdep|tvcfg|osv|osv-src|osv-merged|gitleaks)\\.json$", "(^|/)\\.(sec-[a-z]+|osv-findings)\\.json$", "(^|/)gitleaks-sec\\.toml$", "(^|/)sbom\\.cdx\\.json$", "(^|/)supervisory/"'"$extra"']'
            [ -n "$lines" ] && printf '%s\n' 'regexTarget = "line"' 'regexes = ['"${lines#, }"']'
          } > "$out"
          cat >> "$out" <<'GITLEAKS_RULES'
        # Secret formats gitleaks' default rules miss, added on top of them for every component.
        #
        # generic-api-key accepts `=`, `:`, `=>` and the like as a separator but not `,`, and a value of 10-150
        # `[\w.=-]` characters; measured on gitleaks 8.21.2 and 8.30.1, both miss these. Rules here match a FORMAT,
        # never an entropy guess: a rule that fires on ordinary code is a rule people learn to waive.

        [[rules]]
        id = "laravel-app-key"
        description = "Laravel APP_KEY"
        regex = '''APP_KEY\s*=\s*['"]?(base64:[A-Za-z0-9+/]{43}=)'''
        secretGroup = 1
        keywords = ["app_key"]

        # Anchored to the start of a line: WordPress core documents example salts in a doc comment.
        [[rules]]
        id = "wordpress-auth-key"
        description = "WordPress authentication key or salt"
        regex = '''(?m)^\s*define\(\s*['"](?:AUTH|SECURE_AUTH|LOGGED_IN|NONCE)_(?:KEY|SALT)['"]\s*,\s*['"](.{64})['"]\s*\)'''
        secretGroup = 1
        keywords = ["_key", "_salt"]
        GITLEAKS_RULES
        }

        gitleaks_scan() {
          _gls_dir="$1"; _gls_config="$2"; _gls_report="$3"; _gls_allowlist="$4"
          shift 4
          gitleaks_write_config "$_gls_config" "$_gls_allowlist" "$@"
          gitleaks dir "$_gls_dir" --config "$_gls_config" --redact --no-banner \
            --report-format json --report-path "$_gls_report" --exit-code 0 >&2 || return 1
          [ -f "$_gls_report" ] || echo '[]' > "$_gls_report"
        }
        SRC_EXCLUDES="$(source_excludes)"
        echo "secrets/code: scanning tracked source only; skipping: $SRC_EXCLUDES" >&2

        OG_EXCLUDES=""
        for _x in $SRC_EXCLUDES; do OG_EXCLUDES="$OG_EXCLUDES --exclude=$_x"; done
        if command -v opengrep >/dev/null 2>&1 \
           && opengrep scan --config "$OPENGREP_CONFIG" $OG_EXCLUDES --json --output og.json "$SCAN_PATH" >&2 && [ -s og.json ]; then
          H=$(jq '[.results[]?|select(.extra.severity=="ERROR")]|length' og.json)
          M=$(jq '[.results[]?|select(.extra.severity=="WARNING")]|length' og.json)
          L=$(jq '[.results[]?|select(.extra.severity=="INFO")]|length' og.json)
          TOOLS=$(echo "$TOOLS" | jq --argjson h "$H" --argjson m "$M" --argjson l "$L" \
            '. + [{name:"opengrep",dimension:"code",findings:{critical:0,high:$h,medium:$m,low:$l,unknown:0}}]')
          FINDINGS=$(echo "$FINDINGS" | jq --slurpfile og og.json \
            '. + [$og[0].results[]?|select(.extra.severity=="ERROR")|{id:.check_id,severity:"high",dimension:"code",package:"",tool:"opengrep"}]')
          echo "code: opengrep high=$H medium=$M low=$L" >&2
        else
          echo "code: opengrep produced no result — dimension left uncovered" >&2
        fi

        run_misconfig() {
          _scanners="$1" _path="$2"
          [ -n "$_scanners" ] || return 0
          command -v trivy >/dev/null 2>&1 || return 0
          set --
          if [ -n "${TRIVY_IGNOREFILE_PATH:-}" ]; then
            if [ -f "$TRIVY_IGNOREFILE_PATH" ]; then
              set -- --ignorefile "$TRIVY_IGNOREFILE_PATH"
            else
              echo "code: trivy_ignorefile '$TRIVY_IGNOREFILE_PATH' does not exist - scanning without it" >&2
            fi
          fi
          if trivy config --misconfig-scanners "$_scanners" "$@" \
               --format json --exit-code 0 \
               --output tvcfg.json "$_path" >&2 && [ -s tvcfg.json ]; then
            C=$(jq '[.Results[]?.Misconfigurations[]?|select(.Severity=="CRITICAL")]|length' tvcfg.json)
            H=$(jq '[.Results[]?.Misconfigurations[]?|select(.Severity=="HIGH")]|length' tvcfg.json)
            M=$(jq '[.Results[]?.Misconfigurations[]?|select(.Severity=="MEDIUM")]|length' tvcfg.json)
            L=$(jq '[.Results[]?.Misconfigurations[]?|select(.Severity=="LOW")]|length' tvcfg.json)
            TOOLS=$(echo "$TOOLS" | jq --argjson c "$C" --argjson h "$H" --argjson m "$M" --argjson l "$L" \
              '. + [{name:"trivy-config",dimension:"code",findings:{critical:$c,high:$h,medium:$m,low:$l,unknown:0}}]')
            FINDINGS=$(echo "$FINDINGS" | jq --slurpfile tc tvcfg.json --arg prefix "${SEC_PATH_PREFIX:-}" \
              '. + [$tc[0].Results[]? as $r | $r.Misconfigurations[]?
                    | select(.Severity=="CRITICAL" or .Severity=="HIGH")
                    | {id:.ID, severity:(.Severity|ascii_downcase), dimension:"code",
                       package:(if $prefix == "" then $r.Target else $prefix + "/" + $r.Target end),
                       tool:"trivy-config"}]')
            echo "code: trivy config ($_scanners) critical=$C high=$H medium=$M low=$L" >&2
          else
            echo "code: trivy config produced no result - $_scanners misconfiguration not covered" >&2
          fi
          rm -f tvcfg.json
        }

        if [ "${DOCKERFILE_MISCONFIG:-false}" = "true" ] \
           && [ -n "$(find "$SCAN_PATH" -name 'Dockerfile' -o -name '*.Dockerfile' 2>/dev/null | head -1)" ]; then
          run_misconfig dockerfile "$SCAN_PATH"
        fi

        TF_SCAN_PATH="${TERRAFORM_SCAN_PATH:-}"
        if [ -n "$TF_SCAN_PATH" ] && [ ! -d "$TF_SCAN_PATH" ]; then
          echo "code: terraform_scan_path '$TF_SCAN_PATH' does not exist - terraform misconfiguration not covered" >&2
          TF_SCAN_PATH=""
          TERRAFORM_MISCONFIG="false"
        fi
        [ -n "$TF_SCAN_PATH" ] || TF_SCAN_PATH="$SCAN_PATH"
        if [ "${TERRAFORM_MISCONFIG:-false}" = "true" ] \
           && [ -n "$(find "$TF_SCAN_PATH" -name '*.tf' 2>/dev/null | head -1)" ]; then
          run_misconfig terraform "$TF_SCAN_PATH"
        fi

        if [ "${OSV_OFFLINE:-false}" = "true" ]; then
          XDG_CACHE_HOME="${CI_PROJECT_DIR:-$PWD}/.sec-cache/osv"
          export XDG_CACHE_HOME
          mkdir -p "$XDG_CACHE_HOME"
          echo "dependencies (cross-check): osv-scanner offline, databases under $XDG_CACHE_HOME" >&2
        fi

        if [ "$SCAN_TARGET" = "sources" ]; then
          echo "dependencies/image: no manifest and no image in this component — see the project inventory" >&2
        elif [ "$SCAN_TARGET" = "filesystem" ]; then
          if command -v trivy >/dev/null 2>&1 \
             && trivy fs --scanners vuln --format json --output tvfs.json "$SCAN_PATH" >&2 && [ -s tvfs.json ]; then
            dvc(){ jq --arg s "$1" '[.Results[]?|select(.Class=="lang-pkgs")|.Vulnerabilities[]?|select(.Severity==$s)]|length' tvfs.json; }
            TOOLS=$(echo "$TOOLS" | jq --argjson c "$(dvc CRITICAL)" --argjson h "$(dvc HIGH)" --argjson m "$(dvc MEDIUM)" --argjson l "$(dvc LOW)" --argjson u "$(dvc UNKNOWN)" \
              '. + [{name:"trivy",dimension:"dependencies",findings:{critical:$c,high:$h,medium:$m,low:$l,unknown:$u}}]')
            FINDINGS=$(echo "$FINDINGS" | jq --slurpfile tv tvfs.json '
              . + [ $tv[0].Results[]? | .Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH") |
                    {id:.VulnerabilityID, severity:(.Severity|ascii_downcase), dimension:"dependencies",
                     package:(.PkgName // ""), tool:"trivy"} ]')
            echo "dependencies: trivy fs recorded (image dimension N/A for a static artifact)" >&2
          else
            echo "dependencies: trivy fs produced no result — dimension left uncovered" >&2
          fi
          if command -v osv-scanner >/dev/null 2>&1; then
            if [ "${OSV_OFFLINE:-false}" = "true" ]; then
              osv_run scan source --recursive "$SCAN_PATH" --format json --output-file osv.json || true
            else
              osv-scanner scan source --recursive "$SCAN_PATH" --format json --output-file osv.json >&2 || true
            fi
          fi
        elif command -v trivy >/dev/null 2>&1 \
           && sec_scan_build_image "$DOCKERFILE" "$IMAGE_TAG" "${SEC_BUILD_CONTEXT:-.}" \
           && trivy image --scanners vuln,secret --format json --output tvimg.json "$IMAGE_TAG" >&2 && [ -s tvimg.json ]; then
          trivy fs --scanners vuln --format json --output tvfs.json \
            $(for _x in $SRC_EXCLUDES; do printf ' --skip-dirs %s' "$_x"; done) "$SCAN_PATH" >&2 \
            || echo "dependencies: trivy fs over the sources produced no result" >&2
          [ -s tvfs.json ] || echo '{"Results":[]}' > tvfs.json
          jq -n --slurpfile img tvimg.json --slurpfile fs tvfs.json '
            [ ($img[0].Results[]? | select(.Class=="lang-pkgs") | .Vulnerabilities[]?),
              ($fs[0].Results[]?  | .Vulnerabilities[]?) ]
            | unique_by(.VulnerabilityID + "|" + (.PkgName // ""))' > tvdep.json
          dvc(){ jq --arg s "$1" '[.[]|select(.Severity==$s)]|length' tvdep.json; }
          ivc(){ jq --arg s "$1" '([.Results[]?|select(.Class=="os-pkgs")|.Vulnerabilities[]?|select(.Severity==$s)]|length) + ([.Results[]?|select(.Class=="secret")|.Secrets[]?|select(.Severity==$s)]|length)' tvimg.json; }
          TOOLS=$(echo "$TOOLS" | jq --argjson c "$(dvc CRITICAL)" --argjson h "$(dvc HIGH)" --argjson m "$(dvc MEDIUM)" --argjson l "$(dvc LOW)" --argjson u "$(dvc UNKNOWN)" \
            '. + [{name:"trivy",dimension:"dependencies",findings:{critical:$c,high:$h,medium:$m,low:$l,unknown:$u}}]')
          TOOLS=$(echo "$TOOLS" | jq --argjson c "$(ivc CRITICAL)" --argjson h "$(ivc HIGH)" --argjson m "$(ivc MEDIUM)" --argjson l "$(ivc LOW)" --argjson u "$(ivc UNKNOWN)" \
            '. + [{name:"trivy",dimension:"image",findings:{critical:$c,high:$h,medium:$m,low:$l,unknown:$u}}]')
          FINDINGS=$(echo "$FINDINGS" | jq --slurpfile dep tvdep.json '
            . + [ $dep[0][] | select(.Severity=="CRITICAL" or .Severity=="HIGH") |
                  {id:.VulnerabilityID, severity:(.Severity|ascii_downcase), dimension:"dependencies",
                   package:(.PkgName // ""), tool:"trivy"} ]')
          FINDINGS=$(echo "$FINDINGS" | jq --slurpfile tv tvimg.json '
            . + [ $tv[0].Results[]? | select(.Class!="lang-pkgs") |
                  (.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH") |
                    {id:.VulnerabilityID, severity:(.Severity|ascii_downcase), dimension:"image",
                     package:(.PkgName // ""), tool:"trivy"}),
                  (.Secrets[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH") |
                    {id:.RuleID, severity:(.Severity|ascii_downcase), dimension:"image",
                     package:(.Target // ""), tool:"trivy"}) ]')
          echo "dependencies + image: trivy image + trivy fs recorded" >&2
          trivy image --format cyclonedx --output sbom.cdx.json "$IMAGE_TAG" >&2 || echo "sbom: trivy cyclonedx failed" >&2
          docker rmi "$IMAGE_TAG" >/dev/null 2>&1 || true
          if command -v osv-scanner >/dev/null 2>&1; then
            if [ "${OSV_OFFLINE:-false}" = "true" ]; then
              [ -s sbom.cdx.json ] && { osv_run scan --sbom=sbom.cdx.json --format json --output-file osv.json || true; }
              osv_run scan source --recursive "$SCAN_PATH" --format json --output-file osv-src.json || true
            else
              [ -s sbom.cdx.json ] && { osv-scanner scan --sbom=sbom.cdx.json --format json --output-file osv.json >&2 || true; }
              osv-scanner scan source --recursive "$SCAN_PATH" --format json --output-file osv-src.json >&2 || true
            fi
            if [ -s osv-src.json ]; then
              [ -s osv.json ] || echo '{"results":[]}' > osv.json
              jq -s '{results: (map(.results // []) | add)}' osv.json osv-src.json > osv-merged.json \
                && mv osv-merged.json osv.json
            fi
          fi
        else
          echo "SECURITY SCAN FAILED — scan_target=image, but the image scan produced no result." >&2
          echo '  Checked in order: docker CLI on PATH, a reachable daemon (DOCKER_HOST), `docker build` of' >&2
          echo "  ${DOCKERFILE}, then trivy over the built image. The step's own output is above." >&2
          echo "  Use scan_target: filesystem for a component that has no image to scan." >&2
          exit 1
        fi

        if [ -s osv.json ]; then
          TOOLS=$(echo "$TOOLS" | jq --argjson f "$(osv_counts osv.json)" '. + [{name:"osv-scanner",dimension:"dependencies",findings:$f}]')
          osv_findings osv.json > .osv-findings.json
          FINDINGS=$(echo "$FINDINGS" | jq --slurpfile add .osv-findings.json '. + $add[0]')
          rm -f .osv-findings.json
          echo "dependencies (cross-check): osv-scanner recorded" >&2
        else
          echo "dependencies (cross-check): skipped (no osv-scanner result / no SBOM or lockfile)" >&2
        fi

        if command -v gitleaks >/dev/null 2>&1; then
          if gitleaks_scan "$SCAN_PATH" gitleaks-sec.toml gitleaks.json \
               "$(dirname "$EXCEPTIONS_FILE")/gitleaks-allowlist.txt" $SRC_EXCLUDES; then
            GN=$(jq 'length' gitleaks.json)
            TOOLS=$(echo "$TOOLS" | jq --argjson n "$GN" '. + [{name:"gitleaks",dimension:"secrets",findings:{critical:0,high:$n,medium:0,low:0,unknown:0}}]')
            FINDINGS=$(echo "$FINDINGS" | jq --slurpfile gl gitleaks.json '
              . + [ $gl[0][]? | {id:.RuleID, severity:"high", dimension:"secrets",
                                 package:((.File // "") + ":" + ((.StartLine // 0)|tostring)), tool:"gitleaks"} ]')
            echo "secrets: gitleaks high=$GN" >&2
          else
            echo "secrets: gitleaks did not run cleanly — dimension left uncovered" >&2
          fi
        else
          echo "secrets: gitleaks not available — dimension left uncovered" >&2
        fi

        EXC='[]'
        if [ -f "$EXCEPTIONS_FILE" ]; then
          if EXC=$(jq '[ (if type == "array" then .[] else .exceptions[]? end)
                         | {id, package:(.package // ""), reason:(.reason // ""), expires_on:(.expires_on // "")} ]' \
                     "$EXCEPTIONS_FILE" 2>&1); then
            echo "waivers: loaded $(echo "$EXC" | jq length) exception(s) from ${EXCEPTIONS_FILE}" >&2
          else
            echo "waivers: ${EXCEPTIONS_FILE} could not be read — ${EXC}" >&2
            echo 'waivers: expected [{id, package, reason, expires_on}, ...] or {"exceptions": [...]}' >&2
            exit 1
          fi
        fi



        project_inventory() {  # project_inventory [threshold] [tracked|tree]
          local threshold="${1:-200}"
          local mode="${2:-tracked}"

          if [ "$mode" != "tree" ] && command -v git >/dev/null 2>&1 && git rev-parse --git-dir >/dev/null 2>&1; then
            git ls-files
          else
            [ "$mode" = "tree" ] || echo "project_inventory: no git — walking the working tree instead" >&2
            find . -type f -not -path "./.git/*" | sed "s|^\./||"
          fi | jq -R -s --argjson threshold "$threshold" '
            def group_of($name):
              if ($name | ltrimstr(".") | test("\\.")) then "." + ($name | split(".") | last) else "(none)" end;

            (split("\n") | map(select(length > 0))) as $paths
            | ($paths | map(split("/") | last | {name: ., group: group_of(.)})) as $files
            | ($files | group_by(.group) | map({group: .[0].group, files: length, names: (map(.name) | unique)})) as $groups
            | {
                fileCount: ($paths | length),
                names: ([$groups[] | select(.files <= $threshold) | .names[]] | unique),
                collapsed: ([$groups[] | select(.files > $threshold) | {group, files}] | sort_by(-.files)),
                containerFiles: [$paths[] | select((split("/") | last | ascii_downcase)
                                                   | test("dockerfile|containerfile"))],
              }
          '
        }
        PROJECT_INVENTORY="$(project_inventory "${PROJECT_INVENTORY_THRESHOLD:-200}")"
        echo "project inventory: $(echo "$PROJECT_INVENTORY" | jq -c '{fileCount, names:(.names|length), collapsed}')" >&2

        DIMENSIONS=$(echo "$TOOLS" | jq '[.[].dimension] | unique | map({name:., status:"covered"})')
        for _dim in dependencies image; do
          DIMENSIONS=$(echo "$DIMENSIONS" | jq --arg d "$_dim" \
            'if any(.[]; .name == $d) then . else . + [{name:$d, status:"not_applicable"}] end')
        done

        printf '%s' "$TOOLS" > .sec-tools.json
        printf '%s' "$FINDINGS" > .sec-findings.json
        printf '%s' "$EXC" > .sec-exceptions.json
        printf '%s' "$PROJECT_INVENTORY" > .sec-project.json
        printf '%s' "$DIMENSIONS" > .sec-dimensions.json
        jq -n --slurpfile tools .sec-tools.json --slurpfile findings .sec-findings.json \
           --slurpfile exceptions .sec-exceptions.json --arg target "$SCAN_TARGET" \
           --slurpfile project .sec-project.json --slurpfile dimensions .sec-dimensions.json \
           --arg component_class "${COMPONENT_CLASS:-service}" \
           --arg base_image "${BASE_IMAGE:-}" \
          '{format:"security-scan/v1", scanTarget:$target, componentClass:$component_class,
            baseImage:$base_image, tools:$tools[0], dimensions:$dimensions[0], project:$project[0],
            findings:$findings[0], exceptions:$exceptions[0]}' > supervisory/security-scan.json
        rm -f .sec-tools.json .sec-findings.json .sec-exceptions.json .sec-project.json .sec-dimensions.json
        echo "== security-scan/v1 =="; cat supervisory/security-scan.json

        mkdir -p supervisory/reports
        for f in og.json tvimg.json osv.json gitleaks.json sbom.cdx.json; do
          [ -f "$f" ] && cp "$f" "supervisory/reports/$f" || true
        done

        if [ "${FAIL_ON_FINDINGS}" = "true" ]; then
          TODAY=$(date -u +%Y-%m-%d)
          BLOCKING=$(blocking_findings supervisory/security-scan.json "$TODAY")
          N=$(echo "$BLOCKING" | jq 'length')
          if [ "${N:-0}" -gt 0 ]; then
            echo "SECURITY CHECK FAILED — ${N} unwaived critical/high finding(s):" >&2
            echo "$BLOCKING" | jq -r '.[] | "  [\(.severity)] \(.id) (\(.dimension)) \(.package)"' >&2
            resolution_guidance "$BLOCKING" "$EXCEPTIONS_FILE" >&2
            exit 1
          fi
          echo "security check: no unwaived critical/high findings"
        fi

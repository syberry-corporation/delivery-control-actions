        [[rules.allowlists]]
        regexTarget = "line"
        regexes = [
            '''--mount=type=secret,''',
            '''import[ \t]+{[ \t\w,]+}[ \t]+from[ \t]+['"][^'"]+['"]''',
        ]
        [[rules.allowlists]]
        condition = "AND"
        paths = [
            '''\.bb$''','''\.bbappend$''','''\.bbclass$''','''\.inc$''',
        ]
        regexTarget = "line"
        regexes = [
            '''LICENSE[^=]*=\s*"[^"]+''',
            '''LIC_FILES_CHKSUM[^=]*=\s*"[^"]+''',
            '''SRC[^=]*=\s*"[a-zA-Z0-9]+''',
        ]
        GITLEAKS_RULES
        }

        gitleaks_scan() {
          _gls_dir="$1"; _gls_config="$2"; _gls_report="$3"; _gls_allowlist="$4"
          shift 4
          gitleaks_write_config "$_gls_config" "$_gls_allowlist" "$@"
          gitleaks dir "$_gls_dir" --config "$_gls_config" --redact --no-banner \
            --report-format json --report-path "$_gls_report" --exit-code 0 >&2 || return 1
          [ -f "$_gls_report" ] || echo '[]' > "$_gls_report"
        }
        SRC_EXCLUDES="$(source_excludes)"
        echo "secrets/code: scanning tracked source only; skipping: $SRC_EXCLUDES" >&2

        OG_EXCLUDES=""
        for _x in $SRC_EXCLUDES; do OG_EXCLUDES="$OG_EXCLUDES --exclude=$_x"; done
        if command -v opengrep >/dev/null 2>&1 \
           && opengrep scan --config "$OPENGREP_CONFIG" $OG_EXCLUDES --json --output og.json "$SCAN_PATH" >&2 && [ -s og.json ]; then
          H=$(jq '[.results[]?|select(.extra.severity=="ERROR")]|length' og.json)
          M=$(jq '[.results[]?|select(.extra.severity=="WARNING")]|length' og.json)
          L=$(jq '[.results[]?|select(.extra.severity=="INFO")]|length' og.json)
          TOOLS=$(echo "$TOOLS" | jq --argjson h "$H" --argjson m "$M" --argjson l "$L" \
            '. + [{name:"opengrep",dimension:"code",findings:{critical:0,high:$h,medium:$m,low:$l,unknown:0}}]')
          FINDINGS=$(echo "$FINDINGS" | jq --slurpfile og og.json \
            '. + [$og[0].results[]?|select(.extra.severity=="ERROR")|{id:.check_id,severity:"high",dimension:"code",package:"",tool:"opengrep"}]')
          echo "code: opengrep high=$H medium=$M low=$L" >&2
        else
          echo "code: opengrep produced no result — dimension left uncovered" >&2
        fi

        run_misconfig() {
          _scanners="$1" _path="$2"
          [ -n "$_scanners" ] || return 0
          command -v trivy >/dev/null 2>&1 || return 0
          set --
          if [ -n "${TRIVY_IGNOREFILE_PATH:-}" ]; then
            if [ -f "$TRIVY_IGNOREFILE_PATH" ]; then
              set -- --ignorefile "$TRIVY_IGNOREFILE_PATH"
            else
              echo "code: trivy_ignorefile '$TRIVY_IGNOREFILE_PATH' does not exist - scanning without it" >&2
            fi
          fi
          if trivy config --misconfig-scanners "$_scanners" "$@" \
               --format json --exit-code 0 \
               --output tvcfg.json "$_path" >&2 && [ -s tvcfg.json ]; then
            C=$(jq '[.Results[]?.Misconfigurations[]?|select(.Severity=="CRITICAL")]|length' tvcfg.json)
            H=$(jq '[.Results[]?.Misconfigurations[]?|select(.Severity=="HIGH")]|length' tvcfg.json)
            M=$(jq '[.Results[]?.Misconfigurations[]?|select(.Severity=="MEDIUM")]|length' tvcfg.json)
            L=$(jq '[.Results[]?.Misconfigurations[]?|select(.Severity=="LOW")]|length' tvcfg.json)
            TOOLS=$(echo "$TOOLS" | jq --argjson c "$C" --argjson h "$H" --argjson m "$M" --argjson l "$L" \
              '. + [{name:"trivy-config",dimension:"code",findings:{critical:$c,high:$h,medium:$m,low:$l,unknown:0}}]')
            FINDINGS=$(echo "$FINDINGS" | jq --slurpfile tc tvcfg.json --arg prefix "${SEC_PATH_PREFIX:-}" \
              '. + [$tc[0].Results[]? as $r | $r.Misconfigurations[]?
                    | select(.Severity=="CRITICAL" or .Severity=="HIGH")
                    | {id:.ID, severity:(.Severity|ascii_downcase), dimension:"code",
                       package:(if $prefix == "" then $r.Target else $prefix + "/" + $r.Target end),
                       tool:"trivy-config"}]')
            echo "code: trivy config ($_scanners) critical=$C high=$H medium=$M low=$L" >&2
          else
            echo "code: trivy config produced no result - $_scanners misconfiguration not covered" >&2
          fi
          rm -f tvcfg.json
        }

        if [ "${DOCKERFILE_MISCONFIG:-false}" = "true" ] \
           && [ -n "$(find "$SCAN_PATH" -name 'Dockerfile' -o -name '*.Dockerfile' 2>/dev/null | head -1)" ]; then
          run_misconfig dockerfile "$SCAN_PATH"
        fi

        TF_SCAN_PATH="${TERRAFORM_SCAN_PATH:-}"
        if [ -n "$TF_SCAN_PATH" ] && [ ! -d "$TF_SCAN_PATH" ]; then
          echo "code: terraform_scan_path '$TF_SCAN_PATH' does not exist - terraform misconfiguration not covered" >&2
          TF_SCAN_PATH=""
          TERRAFORM_MISCONFIG="false"
        fi
        [ -n "$TF_SCAN_PATH" ] || TF_SCAN_PATH="$SCAN_PATH"
        if [ "${TERRAFORM_MISCONFIG:-false}" = "true" ] \
           && [ -n "$(find "$TF_SCAN_PATH" -name '*.tf' 2>/dev/null | head -1)" ]; then
          run_misconfig terraform "$TF_SCAN_PATH"
        fi

        if [ "${OSV_OFFLINE:-false}" = "true" ]; then
          XDG_CACHE_HOME="${CI_PROJECT_DIR:-$PWD}/.sec-cache/osv"
          export XDG_CACHE_HOME
          mkdir -p "$XDG_CACHE_HOME"
          echo "dependencies (cross-check): osv-scanner offline, databases under $XDG_CACHE_HOME" >&2
        fi

        if [ "$SCAN_TARGET" = "sources" ]; then
          echo "dependencies/image: no manifest and no image in this component — see the project inventory" >&2
        elif [ "$SCAN_TARGET" = "filesystem" ]; then
          if command -v trivy >/dev/null 2>&1 \
             && trivy fs --scanners vuln --format json --output tvfs.json "$SCAN_PATH" >&2 && [ -s tvfs.json ]; then
            dvc(){ jq --arg s "$1" '[.Results[]?|select(.Class=="lang-pkgs")|.Vulnerabilities[]?|select(.Severity==$s)]|length' tvfs.json; }
            TOOLS=$(echo "$TOOLS" | jq --argjson c "$(dvc CRITICAL)" --argjson h "$(dvc HIGH)" --argjson m "$(dvc MEDIUM)" --argjson l "$(dvc LOW)" --argjson u "$(dvc UNKNOWN)" \
              '. + [{name:"trivy",dimension:"dependencies",findings:{critical:$c,high:$h,medium:$m,low:$l,unknown:$u}}]')
            FINDINGS=$(echo "$FINDINGS" | jq --slurpfile tv tvfs.json '
              . + [ $tv[0].Results[]? | .Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH") |
                    {id:.VulnerabilityID, severity:(.Severity|ascii_downcase), dimension:"dependencies",
                     package:(.PkgName // ""), tool:"trivy"} ]')
            echo "dependencies: trivy fs recorded (image dimension N/A for a static artifact)" >&2
          else
            echo "dependencies: trivy fs produced no result — dimension left uncovered" >&2
          fi
          if command -v osv-scanner >/dev/null 2>&1; then
            if [ "${OSV_OFFLINE:-false}" = "true" ]; then
              osv_run scan source --recursive "$SCAN_PATH" --format json --output-file osv.json || true
            else
              osv-scanner scan source --recursive "$SCAN_PATH" --format json --output-file osv.json >&2 || true
            fi
          fi
        elif command -v trivy >/dev/null 2>&1 \
           && sec_scan_build_image "$DOCKERFILE" "$IMAGE_TAG" "${SEC_BUILD_CONTEXT:-.}" \
           && trivy image --scanners vuln,secret --format json --output tvimg.json "$IMAGE_TAG" >&2 && [ -s tvimg.json ]; then
          trivy fs --scanners vuln --format json --output tvfs.json \
            $(for _x in $SRC_EXCLUDES; do printf ' --skip-dirs %s' "$_x"; done) "$SCAN_PATH" >&2 \
            || echo "dependencies: trivy fs over the sources produced no result" >&2
          [ -s tvfs.json ] || echo '{"Results":[]}' > tvfs.json
          jq -n --slurpfile img tvimg.json --slurpfile fs tvfs.json '
            [ ($img[0].Results[]? | select(.Class=="lang-pkgs") | .Vulnerabilities[]?),
              ($fs[0].Results[]?  | .Vulnerabilities[]?) ]
            | unique_by(.VulnerabilityID + "|" + (.PkgName // ""))' > tvdep.json
          dvc(){ jq --arg s "$1" '[.[]|select(.Severity==$s)]|length' tvdep.json; }
          ivc(){ jq --arg s "$1" '([.Results[]?|select(.Class=="os-pkgs")|.Vulnerabilities[]?|select(.Severity==$s)]|length) + ([.Results[]?|select(.Class=="secret")|.Secrets[]?|select(.Severity==$s)]|length)' tvimg.json; }
          TOOLS=$(echo "$TOOLS" | jq --argjson c "$(dvc CRITICAL)" --argjson h "$(dvc HIGH)" --argjson m "$(dvc MEDIUM)" --argjson l "$(dvc LOW)" --argjson u "$(dvc UNKNOWN)" \
            '. + [{name:"trivy",dimension:"dependencies",findings:{critical:$c,high:$h,medium:$m,low:$l,unknown:$u}}]')
          TOOLS=$(echo "$TOOLS" | jq --argjson c "$(ivc CRITICAL)" --argjson h "$(ivc HIGH)" --argjson m "$(ivc MEDIUM)" --argjson l "$(ivc LOW)" --argjson u "$(ivc UNKNOWN)" \
            '. + [{name:"trivy",dimension:"image",findings:{critical:$c,high:$h,medium:$m,low:$l,unknown:$u}}]')
          FINDINGS=$(echo "$FINDINGS" | jq --slurpfile dep tvdep.json '
            . + [ $dep[0][] | select(.Severity=="CRITICAL" or .Severity=="HIGH") |
                  {id:.VulnerabilityID, severity:(.Severity|ascii_downcase), dimension:"dependencies",
                   package:(.PkgName // ""), tool:"trivy"} ]')
          FINDINGS=$(echo "$FINDINGS" | jq --slurpfile tv tvimg.json '
            . + [ $tv[0].Results[]? | select(.Class!="lang-pkgs") |
                  (.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH") |
                    {id:.VulnerabilityID, severity:(.Severity|ascii_downcase), dimension:"image",
                     package:(.PkgName // ""), tool:"trivy"}),
                  (.Secrets[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH") |
                    {id:.RuleID, severity:(.Severity|ascii_downcase), dimension:"image",
                     package:(.Target // ""), tool:"trivy"}) ]')
          echo "dependencies + image: trivy image + trivy fs recorded" >&2
          trivy image --format cyclonedx --output sbom.cdx.json "$IMAGE_TAG" >&2 || echo "sbom: trivy cyclonedx failed" >&2
          docker rmi "$IMAGE_TAG" >/dev/null 2>&1 || true
          if command -v osv-scanner >/dev/null 2>&1; then
            if [ "${OSV_OFFLINE:-false}" = "true" ]; then
              [ -s sbom.cdx.json ] && { osv_run scan --sbom=sbom.cdx.json --format json --output-file osv.json || true; }
              osv_run scan source --recursive "$SCAN_PATH" --format json --output-file osv-src.json || true
            else
              [ -s sbom.cdx.json ] && { osv-scanner scan --sbom=sbom.cdx.json --format json --output-file osv.json >&2 || true; }
              osv-scanner scan source --recursive "$SCAN_PATH" --format json --output-file osv-src.json >&2 || true
            fi
            if [ -s osv-src.json ]; then
              [ -s osv.json ] || echo '{"results":[]}' > osv.json
              jq -s '{results: (map(.results // []) | add)}' osv.json osv-src.json > osv-merged.json \
                && mv osv-merged.json osv.json
            fi
          fi
        else
          echo "SECURITY SCAN FAILED — scan_target=image, but the image scan produced no result." >&2
          echo '  Checked in order: docker CLI on PATH, a reachable daemon (DOCKER_HOST), `docker build` of' >&2
          echo "  ${DOCKERFILE}, then trivy over the built image. The step's own output is above." >&2
          echo "  Use scan_target: filesystem for a component that has no image to scan." >&2
          exit 1
        fi

        if [ -s osv.json ]; then
          TOOLS=$(echo "$TOOLS" | jq --argjson f "$(osv_counts osv.json)" '. + [{name:"osv-scanner",dimension:"dependencies",findings:$f}]')
          osv_findings osv.json > .osv-findings.json
          FINDINGS=$(echo "$FINDINGS" | jq --slurpfile add .osv-findings.json '. + $add[0]')
          rm -f .osv-findings.json
          echo "dependencies (cross-check): osv-scanner recorded" >&2
        else
          echo "dependencies (cross-check): skipped (no osv-scanner result / no SBOM or lockfile)" >&2
        fi

        if command -v gitleaks >/dev/null 2>&1; then
          if gitleaks_scan "$SCAN_PATH" gitleaks-sec.toml gitleaks.json \
               "$(dirname "$EXCEPTIONS_FILE")/gitleaks-allowlist.txt" $SRC_EXCLUDES; then
            GN=$(jq 'length' gitleaks.json)
            TOOLS=$(echo "$TOOLS" | jq --argjson n "$GN" '. + [{name:"gitleaks",dimension:"secrets",findings:{critical:0,high:$n,medium:0,low:0,unknown:0}}]')
            FINDINGS=$(echo "$FINDINGS" | jq --slurpfile gl gitleaks.json '
              . + [ $gl[0][]? | {id:.RuleID, severity:"high", dimension:"secrets",
                                 package:((.File // "") + ":" + ((.StartLine // 0)|tostring)), tool:"gitleaks"} ]')
            echo "secrets: gitleaks high=$GN" >&2
          else
            echo "secrets: gitleaks did not run cleanly — dimension left uncovered" >&2
          fi
        else
          echo "secrets: gitleaks not available — dimension left uncovered" >&2
        fi

        EXC='[]'
        if [ -f "$EXCEPTIONS_FILE" ]; then
          if EXC=$(jq '[ (if type == "array" then .[] else .exceptions[]? end)
                         | {id, package:(.package // ""), reason:(.reason // ""), expires_on:(.expires_on // "")} ]' \
                     "$EXCEPTIONS_FILE" 2>&1); then
            echo "waivers: loaded $(echo "$EXC" | jq length) exception(s) from ${EXCEPTIONS_FILE}" >&2
          else
            echo "waivers: ${EXCEPTIONS_FILE} could not be read — ${EXC}" >&2
            echo 'waivers: expected [{id, package, reason, expires_on}, ...] or {"exceptions": [...]}' >&2
            exit 1
          fi
        fi



        project_inventory() {  # project_inventory [threshold] [tracked|tree]
          local threshold="${1:-200}"
          local mode="${2:-tracked}"

          if [ "$mode" != "tree" ] && command -v git >/dev/null 2>&1 && git rev-parse --git-dir >/dev/null 2>&1; then
            git ls-files
          else
            [ "$mode" = "tree" ] || echo "project_inventory: no git — walking the working tree instead" >&2
            find . -type f -not -path "./.git/*" | sed "s|^\./||"
          fi | jq -R -s --argjson threshold "$threshold" '
            def group_of($name):
              if ($name | ltrimstr(".") | test("\\.")) then "." + ($name | split(".") | last) else "(none)" end;

            (split("\n") | map(select(length > 0))) as $paths
            | ($paths | map(split("/") | last | {name: ., group: group_of(.)})) as $files
            | ($files | group_by(.group) | map({group: .[0].group, files: length, names: (map(.name) | unique)})) as $groups
            | {
                fileCount: ($paths | length),
                names: ([$groups[] | select(.files <= $threshold) | .names[]] | unique),
                collapsed: ([$groups[] | select(.files > $threshold) | {group, files}] | sort_by(-.files)),
                containerFiles: [$paths[] | select((split("/") | last | ascii_downcase)
                                                   | test("dockerfile|containerfile"))],
              }
          '
        }
        PROJECT_INVENTORY="$(project_inventory "${PROJECT_INVENTORY_THRESHOLD:-200}")"
        echo "project inventory: $(echo "$PROJECT_INVENTORY" | jq -c '{fileCount, names:(.names|length), collapsed}')" >&2

        DIMENSIONS=$(echo "$TOOLS" | jq '[.[].dimension] | unique | map({name:., status:"covered"})')
        for _dim in dependencies image; do
          DIMENSIONS=$(echo "$DIMENSIONS" | jq --arg d "$_dim" \
            'if any(.[]; .name == $d) then . else . + [{name:$d, status:"not_applicable"}] end')
        done

        printf '%s' "$TOOLS" > .sec-tools.json
        printf '%s' "$FINDINGS" > .sec-findings.json
        printf '%s' "$EXC" > .sec-exceptions.json
        printf '%s' "$PROJECT_INVENTORY" > .sec-project.json
        printf '%s' "$DIMENSIONS" > .sec-dimensions.json
        jq -n --slurpfile tools .sec-tools.json --slurpfile findings .sec-findings.json \
           --slurpfile exceptions .sec-exceptions.json --arg target "$SCAN_TARGET" \
           --slurpfile project .sec-project.json --slurpfile dimensions .sec-dimensions.json \
           --arg component_class "${COMPONENT_CLASS:-service}" \
           --arg base_image "${BASE_IMAGE:-}" \
          '{format:"security-scan/v1", scanTarget:$target, componentClass:$component_class,
            baseImage:$base_image, tools:$tools[0], dimensions:$dimensions[0], project:$project[0],
            findings:$findings[0], exceptions:$exceptions[0]}' > supervisory/security-scan.json
        rm -f .sec-tools.json .sec-findings.json .sec-exceptions.json .sec-project.json .sec-dimensions.json
        echo "== security-scan/v1 =="; cat supervisory/security-scan.json

        mkdir -p supervisory/reports
        for f in og.json tvimg.json osv.json gitleaks.json sbom.cdx.json; do
          [ -f "$f" ] && cp "$f" "supervisory/reports/$f" || true
        done

        if [ "${FAIL_ON_FINDINGS}" = "true" ]; then
          TODAY=$(date -u +%Y-%m-%d)
          BLOCKING=$(blocking_findings supervisory/security-scan.json "$TODAY")
          N=$(echo "$BLOCKING" | jq 'length')
          if [ "${N:-0}" -gt 0 ]; then
            echo "SECURITY CHECK FAILED — ${N} unwaived critical/high finding(s):" >&2
            echo "$BLOCKING" | jq -r '.[] | "  [\(.severity)] \(.id) (\(.dimension)) \(.package)"' >&2
            resolution_guidance "$BLOCKING" "$EXCEPTIONS_FILE" >&2
            exit 1
          fi
          echo "security check: no unwaived critical/high findings"
        fi

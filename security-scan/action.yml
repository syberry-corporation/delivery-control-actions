        case "$(uname -s)" in
          Linux) SEC_OS=linux ;;
          Darwin) SEC_OS=darwin ;;
          MINGW*|MSYS*|CYGWIN*) SEC_OS=windows ;;
          *) SEC_OS=linux ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64) SEC_ARCH=amd64 ;;
          arm64|aarch64) SEC_ARCH=arm64 ;;
          *) SEC_ARCH=amd64 ;;
        esac

        TRIVY_PIN_VERSION="0.74.0"
        TRIVY_PIN_BINARY="trivy"
        case "${SEC_OS:-}_${SEC_ARCH:-}" in
          darwin_amd64) TRIVY_PIN_URL="https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_macOS-64bit.tar.gz"; TRIVY_PIN_SHA256="472816f6888dda689d075c30254d4210b4d1035acf365aa72332f584c2f60485"; TRIVY_PIN_ARCHIVE="tar.gz" ;;
          darwin_arm64) TRIVY_PIN_URL="https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_macOS-ARM64.tar.gz"; TRIVY_PIN_SHA256="1caada5e0e2091909357c7525d3aa76f4b660b13821bc143b190c7483e31cc11"; TRIVY_PIN_ARCHIVE="tar.gz" ;;

          linux_amd64) TRIVY_PIN_URL="https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz"; TRIVY_PIN_SHA256="2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"; TRIVY_PIN_ARCHIVE="tar.gz" ;;

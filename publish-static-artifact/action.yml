        # The zip, the SBOM and the statement were written into the build folder; they are published now and
        # would otherwise be deployed with the site on the next `aws s3 sync` of that folder.
        rm -f "./$version.zip" "./$version.sbom.cdx.json" "./$version.provenance.json"

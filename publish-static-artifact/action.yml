name: 'Publish static artifact with SBOM and provenance'
description: >-
  Packages a built folder (a frontend's `build/`, a lambda bundle) as `<version>.zip`, publishes it to the
  artifact bucket together with its CycloneDX SBOM and SLSA v1 provenance, and writes the metadata file
  `supervise-build-gate-artifact` and `supervise-deploy-gate` read. The same scripts as the GitLab static
  artifact build, so an artifact carries the same evidence on either forge.

name: 'Publish static artifact with SBOM and provenance'
description: >-
  Packages a built folder (a frontend's `build/`, a lambda bundle) as `<version>.zip`, publishes it to the
  artifact bucket together with its CycloneDX SBOM and SLSA v1 provenance, and writes the metadata file
  `supervise-build-gate-artifact` and `supervise-deploy-gate` read. The same scripts as the GitLab static
  artifact build, so an artifact carries the same evidence on either forge.
inputs:
  artifact_base_uri:
    description: >-
      Where to publish: `s3://<bucket>[/<prefix>]`. The bucket must be a trusted artifact bucket (its name
      ends in `-prod-s3-artifacts`). The caller must already hold AWS credentials that can write it.
    required: true
  version:
    description: 'Artifact version — environment-agnostic, e.g. 1.0.42. The zip is `<version>.zip`.'
    required: true
  project_path:
    description: 'Path to the component within the repository'
    default: '.'
  build_folder:
    description: 'The folder to package, relative to the component (build it BEFORE this step)'
    default: 'build'
  trivy_version:
    description: 'trivy release used for the SBOM (without the leading v)'
    default: '0.72.0'
outputs:
  metadata_file:
    description: 'Absolute path of the metadata file (ARTIFACT_* / SBOM_* / PROVENANCE_*) — pass it to the gates'
    value: ${{ steps.publish.outputs.metadata_file }}
  location:
    description: 'The published zip: s3://…/<version>.zip'
    value: ${{ steps.publish.outputs.location }}
  digest:
    description: 'sha256 of the published zip'
    value: ${{ steps.publish.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Package, SBOM, provenance, upload
      id: publish
      shell: bash
      env:
        ARTIFACT_BASE_URI: ${{ inputs.artifact_base_uri }}
        version: ${{ inputs.version }}
        PROJECT_PATH: ${{ inputs.project_path }}
        BUILD_FOLDER: ${{ inputs.build_folder }}
        TRIVY_VERSION: ${{ inputs.trivy_version }}
        PROVENANCE_BUILD_TYPE: 'https://github.com/syberry-corporation/delivery-control-actions/publish-static-artifact@v1'
      run: |
        set -euo pipefail
        if [ -n "${GITHUB_ACTIONS:-}" ]; then
          : "${CI_PROJECT_DIR:=${GITHUB_WORKSPACE:-$PWD}}"
          : "${CI_COMMIT_SHA:=${GITHUB_SHA:-}}"
          : "${CI_COMMIT_SHORT_SHA:=$(printf '%s' "${GITHUB_SHA:-}" | cut -c1-8)}"
          : "${CI_COMMIT_REF_NAME:=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}}"
          : "${CI_SERVER_URL:=${GITHUB_SERVER_URL:-https://github.com}}"
          : "${CI_PROJECT_PATH:=${GITHUB_REPOSITORY:-}}"
          : "${CI_PROJECT_URL:=${CI_SERVER_URL}/${CI_PROJECT_PATH}}"
          : "${CI_PIPELINE_ID:=${GITHUB_RUN_ID:-}}"
          : "${CI_JOB_URL:=${CI_PROJECT_URL}/actions/runs/${GITHUB_RUN_ID:-}/attempts/${GITHUB_RUN_ATTEMPT:-1}}"
          _cgn_wf="${GITHUB_WORKFLOW_REF:-}"; _cgn_wf="${_cgn_wf%%@*}"; _cgn_wf="${_cgn_wf#*/}"; _cgn_wf="${_cgn_wf#*/}"
          : "${CI_CONFIG_PATH:=${_cgn_wf:-.github/workflows}}"
          export CI_PROJECT_DIR CI_COMMIT_SHA CI_COMMIT_SHORT_SHA CI_COMMIT_REF_NAME CI_SERVER_URL CI_PROJECT_PATH \
            CI_PROJECT_URL CI_PIPELINE_ID CI_JOB_URL CI_CONFIG_PATH
        fi
        # A GitHub run is identified by its workflow run, not by a runner job id.
        PROVENANCE_BUILDER_ID="${CI_PROJECT_URL}/actions/runs/${GITHUB_RUN_ID:-}"
        export PROVENANCE_BUILDER_ID
        artifact_base="${ARTIFACT_BASE_URI%/}"
        case "$artifact_base" in s3://?*) ;; *) echo "artifact_base_uri must be s3://<bucket>[/<prefix>] (got '$ARTIFACT_BASE_URI')" >&2; exit 1 ;; esac
        artifact_repo="${artifact_base#s3://}"; artifact_repo="${artifact_repo%%/*}"
        proj_dir="$CI_PROJECT_DIR/$PROJECT_PATH"
        env_out="$CI_PROJECT_DIR/static-artifact.env"
        [ -d "$proj_dir/$BUILD_FOLDER" ] || { echo "no build folder at $PROJECT_PATH/$BUILD_FOLDER — build before publishing" >&2; exit 1; }
        # GitHub-hosted runners ship zip; a self-hosted one may not, and the step would otherwise die halfway,
        # after the SBOM, with "zip: command not found".
        command -v zip >/dev/null 2>&1 || { echo "publish-static-artifact: 'zip' is required on the runner" >&2; exit 1; }
        BIN_DIR="${CI_PROJECT_DIR}/.tool-cache/bin"; mkdir -p "$BIN_DIR"; export PATH="${BIN_DIR}:${PATH}"; SBOM_PRESENT=false
        if ! command -v trivy >/dev/null 2>&1; then
          curl -fsSL "https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh" | sh -s -- -b "$BIN_DIR" "v${TRIVY_VERSION}" >&2 || echo "trivy install failed" >&2
        fi
        if command -v trivy >/dev/null 2>&1 \
           && trivy fs --format cyclonedx --output "$proj_dir/${BUILD_FOLDER}/$version.sbom.cdx.json" "$proj_dir" >&2; then
          SBOM_PRESENT=true
        else
          echo "SBOM: trivy did not produce a result — SD-1.4 will fail closed" >&2
        fi
        cd "$proj_dir/$BUILD_FOLDER"


        project_inventory() {  # project_inventory [threshold] [tracked|tree]
          local threshold="${1:-200}"
          local mode="${2:-tracked}"

          if [ "$mode" != "tree" ] && command -v git >/dev/null 2>&1 && git rev-parse --git-dir >/dev/null 2>&1; then
            git ls-files
          else
            [ "$mode" = "tree" ] || echo "project_inventory: no git — walking the working tree instead" >&2
            find . -type f -not -path "./.git/*" | sed "s|^\./||"
          fi | jq -R -s --argjson threshold "$threshold" '
            def group_of($name):
              if ($name | ltrimstr(".") | test("\\.")) then "." + ($name | split(".") | last) else "(none)" end;

            (split("\n") | map(select(length > 0))) as $paths
            | ($paths | map(split("/") | last | {name: ., group: group_of(.)})) as $files
            | ($files | group_by(.group) | map({group: .[0].group, files: length, names: (map(.name) | unique)})) as $groups
            | {
                fileCount: ($paths | length),
                names: ([$groups[] | select(.files <= $threshold) | .names[]] | unique),
                collapsed: ([$groups[] | select(.files > $threshold) | {group, files}] | sort_by(-.files)),
                containerFiles: [$paths[] | select((split("/") | last | ascii_downcase)
                                                   | test("dockerfile|containerfile"))],
              }
          '
        }

        artifact_inventory="$(cd "$proj_dir/$BUILD_FOLDER" && project_inventory "${ARTIFACT_INVENTORY_THRESHOLD:-200}" tree | tr -d '\n')"
        echo "artifact inventory: $(echo "$artifact_inventory" | jq -c '{fileCount, names: (.names | length), collapsed}')"
        zip -r "$version.zip" . -x "$version.sbom.cdx.json" >> /dev/null
        artifact_sha="$(sha256sum "$version.zip" | awk '{print $1}')"; artifact_digest="sha256:${artifact_sha}"
        artifact_size="$(wc -c < "$version.zip" | tr -d ' ')"
        artifact_location="${artifact_base}/$version.zip"
        prov_present=false; prov_type="https://slsa.dev/provenance/v1"
        if jq -n --arg name "$version.zip" --arg sha "$artifact_sha" --arg pt "$prov_type" \
              --arg builder "${PROVENANCE_BUILDER_ID:-gitlab-runner/${CI_PIPELINE_ID}}" \
              --arg buildType "${PROVENANCE_BUILD_TYPE:?PROVENANCE_BUILD_TYPE is set by the block or the action}" \
              --arg commit "$CI_COMMIT_SHA" --arg ref "$CI_COMMIT_REF_NAME" --arg proj "$CI_PROJECT_PATH" \
              --arg invocation "$CI_JOB_URL" --arg pipe "$CI_PIPELINE_ID" \
              '{ "_type":"https://in-toto.io/Statement/v1",
                 subject:[{name:$name, digest:{sha256:$sha}}], predicateType:$pt,
                 predicate:{ buildDefinition:{ buildType:$buildType,
                               externalParameters:{project:$proj, ref:$ref, commit:$commit},
                               internalParameters:{pipelineId:$pipe} },
                             runDetails:{ builder:{id:$builder}, metadata:{invocationId:$invocation} } } }' \
              > "$version.provenance.json"; then
          prov_present=true
        fi
        prov_sha="$(sha256sum "$version.provenance.json" | awk '{print $1}')"
        aws s3 cp "./$version.zip" "$artifact_location" --checksum-algorithm SHA256
        sbom_location="${artifact_base}/$version.sbom.cdx.json"; sbom_sha=""

        if [ "$SBOM_PRESENT" = true ] && [ -f "$version.sbom.cdx.json" ]; then
          sbom_sha="$(sha256sum "$version.sbom.cdx.json" | awk '{print $1}')"
          aws s3 cp "./$version.sbom.cdx.json" "$sbom_location" --checksum-algorithm SHA256
        else
          sbom_location=""
        fi
        prov_location="${artifact_base}/$version.provenance.json"
        aws s3 cp "./$version.provenance.json" "$prov_location" --checksum-algorithm SHA256
        {
          echo "ARTIFACT_NAME=$version.zip"
          echo "ARTIFACT_VERSION=$version"
          echo "ARTIFACT_DIGEST=$artifact_digest"
          echo "ARTIFACT_BUCKET=$artifact_repo"
          echo "ARTIFACT_LOCATION=$artifact_location"
          echo "ARTIFACT_SIZE_BYTES=$artifact_size"
          echo "SBOM_PRESENT=$SBOM_PRESENT"
          echo "SBOM_MEDIA_TYPE=application/vnd.cyclonedx+json"
          echo "SBOM_FORMAT=CYCLONEDX"
          echo "SBOM_DIGEST=${sbom_sha:+sha256:$sbom_sha}"
          echo "SBOM_LOCATION=$sbom_location"
          echo "PROVENANCE_PRESENT=$prov_present"
          echo "PROVENANCE_PREDICATE_TYPE=$prov_type"
          echo "PROVENANCE_DIGEST=sha256:$prov_sha"
          echo "PROVENANCE_LOCATION=$prov_location"
          echo "ARTIFACT_INVENTORY=$artifact_inventory"
        } > "$env_out"
        echo "== static-artifact.env =="; cat "$env_out"
        # The zip, the SBOM and the statement were written into the build folder; they are published now and
        # would otherwise be deployed with the site on the next `aws s3 sync` of that folder.
        rm -f "./$version.zip" "./$version.sbom.cdx.json" "./$version.provenance.json"
        {
          echo "metadata_file=${env_out}"
          echo "location=${artifact_location}"
          echo "digest=${artifact_digest}"
        } >> "$GITHUB_OUTPUT"

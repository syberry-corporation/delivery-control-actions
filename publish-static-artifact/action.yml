          sbom_sha="$(sha256sum "$version.sbom.cdx.json" | awk '{print $1}')"
          aws s3 cp "./$version.sbom.cdx.json" "$sbom_location" --checksum-algorithm SHA256
        else
          sbom_location=""
        fi

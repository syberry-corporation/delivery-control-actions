          echo "ARTIFACT_VERSION=$version"
          echo "ARTIFACT_DIGEST=$artifact_digest"
          echo "ARTIFACT_BUCKET=$artifact_repo"
          echo "ARTIFACT_LOCATION=$artifact_location"
          echo "ARTIFACT_SIZE_BYTES=$artifact_size"
          echo "SBOM_PRESENT=$SBOM_PRESENT"
          echo "SBOM_MEDIA_TYPE=application/vnd.cyclonedx+json"
          echo "SBOM_FORMAT=CYCLONEDX"
          echo "SBOM_DIGEST=${sbom_sha:+sha256:$sbom_sha}"
          echo "SBOM_LOCATION=$sbom_location"
          echo "PROVENANCE_PRESENT=$prov_present"
          echo "PROVENANCE_PREDICATE_TYPE=$prov_type"
          echo "PROVENANCE_DIGEST=sha256:$prov_sha"
          echo "PROVENANCE_LOCATION=$prov_location"
          echo "ARTIFACT_INVENTORY=$artifact_inventory"

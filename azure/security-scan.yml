      # sourced. The body is therefore only a function definition — nothing executes at inclusion time, and the
      # `return` below is function-scoped, so it cannot short-circuit the caller's remaining script steps.
      #
      # https ONLY, including across redirects. Every caller passes an https URL, but a 30x can point anywhere,
      # and both curl -L and urllib will happily follow one down to plain http — at which point the bytes are
      # whatever the network says they are. These are executables we then run, so the downgrade is refused.

      if [ -f composer.lock ]; then
        emit_inventory composer.lock composer > supervisory/dependency-inventory.json
        echo "SCM-3.1: composer inventory from composer.lock with $(jq '(.dependencies // []) | length' supervisory/dependency-inventory.json) source(s)"
      elif [ -f composer.json ]; then
        echo '{"format":"dependency-inventory/v1"}' > supervisory/dependency-inventory.json
        echo "SCM-3.1: composer.json without composer.lock in $(pwd) — dependencies unknown, inventory left open (fails closed)"
      else
        echo '{"format":"dependency-inventory/v1","dependencies":[]}' > supervisory/dependency-inventory.json
        echo "SCM-3.1: no composer.json in $(pwd) — no composer dependencies"
      fi

      _NODE_LOCK=""; _NODE_KIND=""
      if [ -f package-lock.json ]; then _NODE_LOCK=package-lock.json; _NODE_KIND=npm
      elif [ -f yarn.lock ]; then _NODE_LOCK=yarn.lock; _NODE_KIND=yarn
      fi
      if [ -n "$_NODE_LOCK" ]; then
        if [ "$_NODE_KIND" = npm ]; then inventory_npm "$_NODE_LOCK"; else inventory_yarn "$_NODE_LOCK"; fi \
          > supervisory/.node-inventory.json
        if command -v merge_inventories >/dev/null 2>&1 \
             && merge_inventories supervisory/dependency-inventory.json supervisory/.node-inventory.json \
                  > supervisory/.merged.json && [ -s supervisory/.merged.json ]; then
          mv supervisory/.merged.json supervisory/dependency-inventory.json
          echo "SCM-3.1: merged $(jq '(.dependencies // []) | length' supervisory/.node-inventory.json) source(s) from ${_NODE_LOCK}"
        fi
        rm -f supervisory/.node-inventory.json supervisory/.merged.json
      fi

      command -v augment_with_discovery >/dev/null 2>&1 && augment_with_discovery supervisory/dependency-inventory.json
      echo "SCM-3.1: inventory has $(jq '(.dependencies // []) | length' supervisory/dependency-inventory.json) source(s)"
          ;;
        node)
      if [ -n "${CODEARTIFACT_URL:-}" ]; then

        _ca_rest="${CODEARTIFACT_URL#*://}"
        _ca_host="${_ca_rest%%/*}"
        _ca_path="${_ca_rest#*/}"
        _ca_label="${_ca_host%%.d.codeartifact.*}"
        CODEARTIFACT_DOMAIN="${_ca_label%-*}"
        CODEARTIFACT_DOMAIN_OWNER="${_ca_label##*-}"
        CODEARTIFACT_REGION="${_ca_host#*.d.codeartifact.}"; CODEARTIFACT_REGION="${CODEARTIFACT_REGION%%.*}"
        CODEARTIFACT_REPO="${_ca_path#*/}"; CODEARTIFACT_REPO="${CODEARTIFACT_REPO%%/*}"
        case "$CODEARTIFACT_DOMAIN_OWNER" in
          ''|*[!0-9]*) echo "codeartifact: cannot parse an account id out of $CODEARTIFACT_URL"; exit 1 ;;
        esac
        [ -n "$CODEARTIFACT_REPO" ] || { echo "codeartifact: no repository in $CODEARTIFACT_URL"; exit 1; }

        CODEARTIFACT_AUTH_TOKEN="$(aws codeartifact get-authorization-token \
          --domain "$CODEARTIFACT_DOMAIN" --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
          --region "$CODEARTIFACT_REGION" --query authorizationToken --output text)"
        [ -n "$CODEARTIFACT_AUTH_TOKEN" ] && [ "$CODEARTIFACT_AUTH_TOKEN" != "None" ] \
          || { echo "codeartifact: failed to obtain an auth token"; exit 1; }

        export CODEARTIFACT_AUTH_TOKEN CODEARTIFACT_URL
        export CODEARTIFACT_DOMAIN CODEARTIFACT_DOMAIN_OWNER CODEARTIFACT_REGION CODEARTIFACT_REPO
        export CODEARTIFACT_REPO_URL="$CODEARTIFACT_URL"
        echo "codeartifact: $CODEARTIFACT_DOMAIN ($CODEARTIFACT_DOMAIN_OWNER) in $CODEARTIFACT_REGION -> $CODEARTIFACT_URL"

        if [ "${CODEARTIFACT_TOOL:-}" = npm ] && [ -n "${CODEARTIFACT_NPM_SCOPES:-}" ]; then
          for _ca_scope in $CODEARTIFACT_NPM_SCOPES; do
            case "${_ca_scope#@}" in
              ''|*[!a-z0-9._~-]*) echo "codeartifact: '$_ca_scope' in CODEARTIFACT_NPM_SCOPES is not an npm scope"; exit 1 ;;
            esac
          done
          for _ca_scope in $CODEARTIFACT_NPM_SCOPES; do
            _ca_scope="${_ca_scope#@}"
            aws codeartifact login --tool npm --namespace "$_ca_scope" \
              --domain "$CODEARTIFACT_DOMAIN" --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
              --repository "$CODEARTIFACT_REPO" --region "$CODEARTIFACT_REGION"
          done
          echo "codeartifact: npm scopes $CODEARTIFACT_NPM_SCOPES from CodeArtifact, everything else from the public registry"
        elif [ -n "${CODEARTIFACT_TOOL:-}" ]; then
          aws codeartifact login --tool "$CODEARTIFACT_TOOL" \
            --domain "$CODEARTIFACT_DOMAIN" --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --repository "$CODEARTIFACT_REPO" --region "$CODEARTIFACT_REGION"
        fi
      fi
      if [ -n "$INSTALL_COMMAND" ]; then
        eval "$INSTALL_COMMAND"
      elif [ "$PACKAGE_MANAGER" = "pnpm" ]; then
        corepack enable
        grep -q '"packageManager"' package.json 2>/dev/null || corepack prepare "pnpm@${CI_PNPM_VERSION:-$PNPM_VERSION}" --activate
        pnpm install --frozen-lockfile --store-dir "$CI_PROJECT_DIR/.pnpm-store" --cache-dir "$CI_PROJECT_DIR/.pnpm-cache"
      elif [ "$PACKAGE_MANAGER" = "yarn" ]; then
        corepack enable
        yarn install --frozen-lockfile || yarn install --immutable
      elif [ -f ./package-lock.json ]; then
        npm ci --prefer-offline
      else
        npm install --prefer-offline
      fi
      mkdir -p supervisory
      LOCK=""; LKIND=""
      for c in pnpm-lock.yaml "$CI_PROJECT_DIR/pnpm-lock.yaml"; do [ -f "$c" ] && { LOCK="$c"; LKIND=pnpm; break; }; done
      if [ -z "$LOCK" ]; then for c in package-lock.json "$CI_PROJECT_DIR/package-lock.json"; do [ -f "$c" ] && { LOCK="$c"; LKIND=npm; break; }; done; fi
      if [ -z "$LOCK" ]; then for c in yarn.lock "$CI_PROJECT_DIR/yarn.lock"; do [ -f "$c" ] && { LOCK="$c"; LKIND=yarn; break; }; done; fi
      case "$(uname -s)" in
        Linux) SEC_OS=linux ;;
        Darwin) SEC_OS=darwin ;;
        MINGW*|MSYS*|CYGWIN*) SEC_OS=windows ;;
        *) SEC_OS=linux ;;
      esac
      case "$(uname -m)" in
        x86_64|amd64) SEC_ARCH=amd64 ;;
        arm64|aarch64) SEC_ARCH=arm64 ;;
        *) SEC_ARCH=amd64 ;;
      esac
      YQ_PIN_VERSION="4.44.3"
      YQ_PIN_BINARY="yq"
      case "${SEC_OS:-}_${SEC_ARCH:-}" in
        darwin_amd64) YQ_PIN_URL="https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_darwin_amd64"; YQ_PIN_SHA256="216ddfa03e7ba0e5aba00b236ec78324b5bfc49b610db254fe92310878baea20"; YQ_PIN_ARCHIVE="" ;;
        darwin_arm64) YQ_PIN_URL="https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_darwin_arm64"; YQ_PIN_SHA256="559a594ef7a6ebc5b81a67b7717fb3accedd266d8fa7d8352da7fec9e463f48b"; YQ_PIN_ARCHIVE="" ;;
        linux_amd64) YQ_PIN_URL="https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64"; YQ_PIN_SHA256="a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7"; YQ_PIN_ARCHIVE="" ;;
        linux_arm64) YQ_PIN_URL="https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_arm64"; YQ_PIN_SHA256="0e7e1524f68d91b3ff9b089872d185940ab0fa020a5a9052046ef10547023156"; YQ_PIN_ARCHIVE="" ;;
        *) YQ_PIN_URL=""; YQ_PIN_SHA256=""; YQ_PIN_ARCHIVE="" ;;
      esac

      _sha256_of() {  # _sha256_of <file> → hex digest on stdout
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum "$1" | cut -d' ' -f1
        elif command -v busybox >/dev/null 2>&1 && busybox sha256sum "$1" >/dev/null 2>&1; then
          busybox sha256sum "$1" | cut -d' ' -f1
        elif command -v openssl >/dev/null 2>&1; then
          openssl dgst -sha256 "$1" | awk '{print $NF}'
        else
          return 1
        fi
      }

      fetch_verified() {  # fetch_verified <url> <expected sha256> <dest>
        fetch_url "$1" > "$3" || { echo "fetch_verified: could not download $1" >&2; rm -f "$3"; return 1; }
        _fv_actual="$(_sha256_of "$3")" || {
          echo "fetch_verified: no sha256 tool in this image, refusing to use an unverified $3" >&2
          rm -f "$3"; return 1
        }
        if [ "$_fv_actual" != "$2" ]; then
          rm -f "$3"
          echo "fetch_verified: CHECKSUM MISMATCH for $1" >&2
          echo "  expected $2" >&2
          echo "  actual   $_fv_actual" >&2
          echo "  If this followed a version bump, update the matching *_sha256_* input; otherwise treat the" >&2
          echo "  download as untrusted and do not re-run until you know why it changed." >&2
          return 1
        fi
      }

      ensure_verified_pinned() {
        _evp_label="$1"; _evp_url="$2"; _evp_expected="$3"; _evp_dest="$4"

        if [ -z "$_evp_expected" ]; then
          echo "$_evp_label: no pinned checksum for this platform in tools_config.yml -- refusing to trust $_evp_dest" >&2
          return 1
        fi

        if [ -f "$_evp_dest" ]; then
          _evp_actual="$(_sha256_of "$_evp_dest" 2>/dev/null)"
          if [ "$_evp_actual" = "$_evp_expected" ]; then
            echo "$_evp_label: reused from cache (sha256 matches the pinned value)" >&2
            return 0
          fi
          echo "$_evp_label: cached copy does not match the pinned checksum -- discarding" >&2
          rm -f "$_evp_dest"
        fi

        fetch_url "$_evp_url" > "$_evp_dest" 2>/dev/null || {
          echo "$_evp_label: download failed" >&2
          rm -f "$_evp_dest"
          return 1
        }
        _evp_actual="$(_sha256_of "$_evp_dest")" || {
          echo "$_evp_label: no sha256 tool in this image, refusing to trust $_evp_dest" >&2
          rm -f "$_evp_dest"
          return 1
        }
        if [ "$_evp_actual" != "$_evp_expected" ]; then
          echo "$_evp_label: CHECKSUM MISMATCH against the pinned value for $_evp_dest (expected $_evp_expected, got $_evp_actual) -- discarding, not installed" >&2
          rm -f "$_evp_dest"
          return 1
        fi
      }

      install_pinned_tool() {
        _ipt_tool="$1"; _ipt_bin_dir="$2"; _ipt_arc_dir="$3"; _ipt_label="${4:-$1}"
        _ipt_prefix="$(printf '%s' "$_ipt_tool" | tr 'a-z-' 'A-Z_')"
        eval "_ipt_version=\${${_ipt_prefix}_PIN_VERSION:-}; _ipt_binary=\${${_ipt_prefix}_PIN_BINARY:-}"
        eval "_ipt_url=\${${_ipt_prefix}_PIN_URL:-}; _ipt_sha=\${${_ipt_prefix}_PIN_SHA256:-}"
        eval "_ipt_archive=\${${_ipt_prefix}_PIN_ARCHIVE:-}"
        if [ -z "$_ipt_binary" ]; then
          echo "$_ipt_label: no pins for $_ipt_tool in this script — the caller needs a '# @@pins $_ipt_tool' marker" >&2
          return 1
        fi
        echo "$_ipt_label: pinned ${_ipt_version} (${SEC_OS:-?}/${SEC_ARCH:-?})" >&2
        mkdir -p "$_ipt_bin_dir" "$_ipt_arc_dir"
        if [ -n "$_ipt_archive" ]; then
          _ipt_dest="${_ipt_arc_dir}/${_ipt_tool}-${_ipt_version}-${SEC_OS:-}-${SEC_ARCH:-}.${_ipt_archive}"
          ensure_verified_pinned "$_ipt_label" "$_ipt_url" "$_ipt_sha" "$_ipt_dest" || return 1
          rm -f "${_ipt_bin_dir}/${_ipt_binary}"
          tar -xzf "$_ipt_dest" -C "$_ipt_bin_dir" "$_ipt_binary" >&2 || {
            echo "$_ipt_label: $_ipt_dest has no $_ipt_binary in it — not a $_ipt_tool release archive" >&2
            return 1
          }
        else
          ensure_verified_pinned "$_ipt_label" "$_ipt_url" "$_ipt_sha" "${_ipt_bin_dir}/${_ipt_binary}" || return 1
        fi
        chmod +x "${_ipt_bin_dir}/${_ipt_binary}"
      }
      ensure_pinned_tool() {
        _ept_tool="$1"
        if [ -n "${CI_PROJECT_DIR:-}" ]; then
          _ept_cache="${CI_PROJECT_DIR}/.tool-cache"
        else
          _ept_cache="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/tool-cache"
        fi
        _ept_found="$(command -v "$_ept_tool" 2>/dev/null || true)"
        if [ -n "$_ept_found" ] && [ "$_ept_found" != "${_ept_cache}/bin/${_ept_tool}" ]; then
          echo "ensure_${_ept_tool}: present ($_ept_found)" >&2
          return 0
        fi
        install_pinned_tool "$_ept_tool" "${_ept_cache}/bin" "${_ept_cache}/.archives" "ensure_${_ept_tool}" || {
          echo "ensure_${_ept_tool}: no verified ${_ept_tool} for ${SEC_OS:-?}/${SEC_ARCH:-?} — refusing to run an unverified one" >&2
          return 1
        }
        case ":$PATH:" in *":${_ept_cache}/bin:"*) ;; *) export PATH="${_ept_cache}/bin:$PATH" ;; esac
        if ! command -v "$_ept_tool" >/dev/null 2>&1; then
          echo "ensure_${_ept_tool}: ${_ept_tool} is still not on PATH after installing it." >&2
          echo "  PATH=$PATH" >&2
          return 1
        fi
      }
      if [ "$LKIND" = "pnpm" ]; then ensure_pinned_tool yq || exit 1; fi

      INVENTORY_MAX_ENTRIES="${INVENTORY_MAX_ENTRIES:-200}"

      collapse_inventory() {
        jq --argjson max "$INVENTORY_MAX_ENTRIES" '
          def common_prefix($urls):
            ($urls | map(split("/"))) as $parts
            | $parts[0] as $first
            | [ foreach range(0; $first | length) as $i
                  (true; . and all($parts[]; (.[$i]? // null) == $first[$i]);
                   if . then $first[$i] else empty end) ]
            | join("/") | if endswith("/") then . else . + "/" end;

          if ((.dependencies // []) | length) <= $max then .
          else
            .dependencies |= ([ group_by(.source | capture("^(?<host>[a-z]+://[^/]+)").host // .source)[]
              | { name: (if length == 1 then .[0].name else "\(length) packages (e.g. \(.[0].name))" end),
                  version: (if length == 1 then .[0].version else "" end),
                  source: (if length == 1 then .[0].source else common_prefix(map(.source)) end),
                  packages: length,
                  unversioned: (map(select((.version // "" | gsub("^\\s+|\\s+$"; "")) == "")) | length) } ])
            | .collapsed = true
          end'
      }


      inventory_pnpm() {
        yq -o=json '.' "$1" | jq '{
          format: "dependency-inventory/v1",
          dependencies: ([ (.packages // {}) | to_entries[]
            | { name: (.key | sub("@[^@]+$"; "")),
                version: ((.key | capture("@(?<v>[^@]+)$").v) // ""),
                source: (.value.resolution.tarball // "https://registry.npmjs.org/") } ] | unique_by(.source)) }'
      }

      inventory_npm() {
        jq '{
          format: "dependency-inventory/v1",
          dependencies: ([ (.packages // {}) | to_entries[]
            | select(.value.resolved and (.value.link != true))
            | { name: (.key | sub("^node_modules/"; "")), version: (.value.version // ""), source: .value.resolved } ] | unique) }' "$1"
      }

      inventory_yarn() {
        awk '
          /^[^ #].*:$/ {
            header = $0
            sub(/:$/, "", header)
            split(header, alts, ", ")
            name = alts[1]
            gsub(/"/, "", name)
            at = match(name, /@[^@]*$/)
            if (at > 1) name = substr(name, 1, at - 1)
            version = ""; source = ""
            next
          }
          /^  version / { version = $2; gsub(/"/, "", version) }
          /^  resolved / {
            source = $2; gsub(/"/, "", source)
            if (name != "" && source != "") printf "%s\t%s\t%s\n", name, version, source
            name = ""
          }
        ' "$1" | jq -R -s '{
          format: "dependency-inventory/v1",
          dependencies: ([ split("\n")[] | select(length > 0) | split("\t")
            | { name: .[0], version: .[1], source: .[2] } ] | unique) }'
      }

      inventory_pip() {
        jq -s '{format:"dependency-inventory/v1",
          dependencies:([.[].install[]? | {name:.metadata.name, version:.metadata.version, source:(.download_info.url // "")}] | unique)}' "$@"
      }

      inventory_composer() {
        jq '{
          format: "dependency-inventory/v1",
          dependencies: ([ ((.packages // []) + (.["packages-dev"] // []))[]
            | { name: .name, version: (.version // ""), source: (.dist.url // .source.url // "") }
            | select(.source != "") ] | unique) }' "$1"
      }

      inventory_nuget() {  # inventory_nuget <project.assets.json>
        jq -r '((.packageFolders // {}) | keys | .[0] // "") as $root
          | (.libraries // {}) | to_entries[] | select(.value.type == "package")
          | [(.key | split("/")[0]), (.key | split("/")[1:] | join("/")), ($root + "/" + (.value.path // ""))]
          | @tsv' "$1" \
        | while IFS="$(printf '\t')" read -r _ni_name _ni_version _ni_dir; do
            _ni_src=$(jq -r '.source // ""' "${_ni_dir%/}/.nupkg.metadata" 2>/dev/null || true)
            jq -cn --arg n "$_ni_name" --arg v "$_ni_version" --arg s "$_ni_src" '{name: $n, version: $v, source: $s}'
          done \
        | jq -s '{format: "dependency-inventory/v1", dependencies: unique}'
      }

      emit_inventory() {
        case "$2" in
          pnpm) inventory_pnpm "$1" | collapse_inventory ;;
          npm) inventory_npm "$1" | collapse_inventory ;;
          yarn) inventory_yarn "$1" | collapse_inventory ;;
          composer) inventory_composer "$1" | collapse_inventory ;;
          *) echo '{"format":"dependency-inventory/v1"}' ;;
        esac
      }
      emit_inventory "$LOCK" "$LKIND" > supervisory/dependency-inventory.json


      source_excludes() {  # source_excludes  -> prints a space-separated list of directory names
        local base="build target out dist node_modules .pnpm-store .pnpm-cache .pipcache .gradle .tool-cache .sec-cache"
        local d
        if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          for d in */ .*/; do
            d="${d%/}"
            case "$d" in .|..|.git) continue ;; esac
            [ -d "$d" ] || continue
            if [ -z "$(git ls-files -- "$d" 2>/dev/null | head -n1)" ]; then
              case " $base " in *" $d "*) ;; *) base="$base $d" ;; esac
            fi
          done
        fi
        printf '%s' "$base"
      }
      INVENTORY_MAX_ENTRIES="${INVENTORY_MAX_ENTRIES:-200}"

      collapse_inventory() {
        jq --argjson max "$INVENTORY_MAX_ENTRIES" '
          def common_prefix($urls):
            ($urls | map(split("/"))) as $parts
            | $parts[0] as $first
            | [ foreach range(0; $first | length) as $i
                  (true; . and all($parts[]; (.[$i]? // null) == $first[$i]);
                   if . then $first[$i] else empty end) ]
            | join("/") | if endswith("/") then . else . + "/" end;

          if ((.dependencies // []) | length) <= $max then .
          else
            .dependencies |= ([ group_by(.source | capture("^(?<host>[a-z]+://[^/]+)").host // .source)[]
              | { name: (if length == 1 then .[0].name else "\(length) packages (e.g. \(.[0].name))" end),
                  version: (if length == 1 then .[0].version else "" end),
                  source: (if length == 1 then .[0].source else common_prefix(map(.source)) end),
                  packages: length,
                  unversioned: (map(select((.version // "" | gsub("^\\s+|\\s+$"; "")) == "")) | length) } ])
            | .collapsed = true
          end'
      }

      inventory_syft() {
        _syft_dir="${1:-.}"
        if ! command -v syft >/dev/null 2>&1; then
          echo "SCM-3.1: syft not available — cross-ecosystem discovery skipped" >&2
          echo '{"format":"dependency-inventory/v1","dependencies":[]}'
          return 0
        fi

        _syft_abs=$(cd "$_syft_dir" 2>/dev/null && pwd -P) || {
          echo "SCM-3.1: ${_syft_dir} is not a directory — cross-ecosystem discovery skipped" >&2
          echo '{"format":"dependency-inventory/v1","dependencies":[]}'
          return 0
        }

        _syft_excludes=""
        for _syft_x in $(source_excludes) .git .terraform .terraspace-cache; do
          _syft_excludes="${_syft_excludes} --exclude ./**/${_syft_x}/**"
        done
        if ! syft scan "dir:${_syft_abs}" \
               ${_syft_excludes} \
               -o cyclonedx-json="${_syft_abs}/.syft-inventory.json" -q >&2 2>/dev/null; then
          echo "SCM-3.1: syft scan failed — cross-ecosystem discovery skipped" >&2
          echo '{"format":"dependency-inventory/v1","dependencies":[]}'
          return 0
        fi

        jq -c '
          def src($t):
            if   $t == "pypi"   then "https://files.pythonhosted.org/"
            elif $t == "npm"    then "https://registry.npmjs.org/"
            elif $t == "golang" then "https://proxy.golang.org/"
            elif $t == "gem"    then "https://rubygems.org/"
            elif $t == "maven"  then "https://repo.maven.apache.org/maven2/"
            elif $t == "nuget"  then "https://api.nuget.org/"
            elif $t == "github" then "https://github.com/"
            else "" end;
          {format: "dependency-inventory/v1",
           dependencies: [ .components[]?
             | select(.purl != null and .purl != "")
             | (.purl | split(":")[1] | split("/")[0]) as $type
             | src($type) as $s
             | select($s != "")
             | {name: (.name // ""), version: (.version // ""), source: $s} ]
             | unique_by([.name, .version, .source]) }
        ' "${_syft_abs}/.syft-inventory.json"

        rm -f "${_syft_abs}/.syft-inventory.json"
      }

      merge_inventories() {  # merge_inventories <primary.json> <secondary.json>
        jq -s -c '
          if (.[0] | has("dependencies") | not) then .[0]
          else
            (.[0].dependencies // []) as $primary
            | ($primary | map([.name, .version])) as $seen
            | (.[0] | del(.dependencies)) + {format: "dependency-inventory/v1",
               dependencies: ($primary + [ (.[1].dependencies // [])[]
                                           | select(([.name, .version] | IN($seen[])) | not) ])}
          end
        ' "$1" "$2"
      }

      augment_with_discovery() {
        _aug_file="$1"
        [ -s "$_aug_file" ] || return 0
        _aug_dir=$(dirname "$_aug_file")

        inventory_syft . > "${_aug_dir}/.discovered.json" || return 0
        _aug_n=$(jq '.dependencies | length' "${_aug_dir}/.discovered.json" 2>/dev/null || echo 0)

        if merge_inventories "$_aug_file" "${_aug_dir}/.discovered.json" > "${_aug_dir}/.merged.json" \
             && [ -s "${_aug_dir}/.merged.json" ]; then
          if command -v collapse_inventory >/dev/null 2>&1; then
            collapse_inventory < "${_aug_dir}/.merged.json" > "${_aug_dir}/.collapsed.json" \
              && mv "${_aug_dir}/.collapsed.json" "${_aug_dir}/.merged.json"
            rm -f "${_aug_dir}/.collapsed.json"
          fi
          mv "${_aug_dir}/.merged.json" "$_aug_file"
          echo "SCM-3.1: ${_aug_n} dependency/ies discovered across ecosystems, merged in" >&2
        else
          echo "SCM-3.1: merge of discovered dependencies failed — keeping the toolchain inventory" >&2
          rm -f "${_aug_dir}/.merged.json"
        fi
        rm -f "${_aug_dir}/.discovered.json"
      }
      command -v augment_with_discovery >/dev/null 2>&1 && augment_with_discovery supervisory/dependency-inventory.json
      echo "SCM-3.1: ${LKIND:-no} inventory from ${LOCK:-<none>} with $(jq '(.dependencies // []) | length' supervisory/dependency-inventory.json) source(s)"
          ;;
        java)
      if [ -n "${CODEARTIFACT_URL:-}" ]; then


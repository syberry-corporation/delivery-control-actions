      collapse_inventory() {
        jq --argjson max "$INVENTORY_MAX_ENTRIES" '
          def common_prefix($urls):
            ($urls | map(split("/"))) as $parts
            | $parts[0] as $first
            | [ foreach range(0; $first | length) as $i
                  (true; . and all($parts[]; (.[$i]? // null) == $first[$i]);

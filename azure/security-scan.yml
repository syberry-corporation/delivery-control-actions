      inventory_npm() {
        jq '{
          format: "dependency-inventory/v1",
          dependencies: ([ (.packages // {}) | to_entries[]
            | select(.value.resolved and (.value.link != true))
            | { name: (.key | sub("^node_modules/"; "")), version: (.value.version // ""), source: .value.resolved } ] | unique) }' "$1"
      }

      inventory_yarn() {
        awk '
          /^[^ #].*:$/ {
            header = $0
            sub(/:$/, "", header)
            split(header, alts, ", ")
            name = alts[1]
            gsub(/"/, "", name)
            at = match(name, /@[^@]*$/)
            if (at > 1) name = substr(name, 1, at - 1)
            version = ""; source = ""
            next
          }
          /^  version / { version = $2; gsub(/"/, "", version) }
          /^  resolved / {
            source = $2; gsub(/"/, "", source)
            if (name != "" && source != "") printf "%s\t%s\t%s\n", name, version, source

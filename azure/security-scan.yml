          Gemfile) echo "ruby sibling Gemfile.lock" ;;
          gems.rb) echo "ruby sibling gems.locked" ;;
          go.mod) echo "go sibling go.sum" ;;
          Cargo.toml) echo "cargo ancestor Cargo.lock" ;;
          pyproject.toml) echo "python ancestor uv.lock poetry.lock pdm.lock pylock.toml" ;;
          Pipfile) echo "python sibling Pipfile.lock" ;;
          requirements*.in) echo "python sibling ${1%.in}.txt" ;;
          requirements*.txt) echo "python self" ;;
          build.gradle|build.gradle.kts) echo "gradle sibling gradle.lockfile" ;;
          pom.xml) echo "maven none" ;;
          *.csproj|*.fsproj|*.vbproj) echo "nuget sibling packages.lock.json" ;;
          packages.config) echo "nuget self" ;;
          Terrafile) echo "tofu self" ;;
        esac
      }

      _locks_declares() {
        case "$1" in
          npm)
            jq -e '[.dependencies, .devDependencies, .optionalDependencies]
                   | map(select(type == "object") | length) | add > 0' "$2" >/dev/null 2>&1 ;;
          composer)
            jq -e '[(.require // {}), (.["require-dev"] // {}) | keys[]]
                   | map(select(test("^(php(-64bit)?|hhvm|ext-.*|lib-.*|composer(-plugin-api|-runtime-api)?)$") | not))
                   | length > 0' "$2" >/dev/null 2>&1 ;;
          ruby) grep -Eq '^[[:space:]]*(gem|gemspec)([[:space:]]|$)' "$2" ;;
          go) grep -Eq '^require([[:space:]]|\()' "$2" ;;
          cargo) grep -Eq '^\[([A-Za-z0-9_.()"'"'"'-]+\.)?(dev-|build-)?dependencies\]' "$2" ;;
          python)
            case "$(basename "$2")" in
              pyproject.toml) _locks_pyproject_declares "$2" ;;
              *) return 0 ;;
            esac ;;
          gradle) grep -Eq '(^|[^A-Za-z])dependencies[[:space:]]*\{' "$2" ;;
          maven) grep -q '<dependency>' "$2" ;;
          nuget)
            case "$(basename "$2")" in
              packages.config) grep -q '<package ' "$2" ;;
              *) grep -q '<PackageReference' "$2" ;;
            esac ;;
          *) return 0 ;;
        esac
      }

      _locks_pyproject_declares() {
        awk '
          /^[[:space:]]*\[/ {
            sect = $0; gsub(/^[[:space:]]*\[+|\]+[[:space:]]*$/, "", sect)
            inarr = 0; next
          }
          sect == "project" && /^[[:space:]]*dependencies[[:space:]]*=/ {
            line = $0; sub(/^[^=]*=/, "", line)
            if (line ~ /["'"'"']/) found = 1
            else if (line !~ /\]/) inarr = 1
            next
          }
          inarr { if ($0 ~ /^[[:space:]]*["'"'"']/) found = 1; if ($0 ~ /\]/) inarr = 0; next }
          (sect == "project.optional-dependencies" || sect == "dependency-groups") && /["'"'"']/ { found = 1 }
          sect ~ /^tool\.poetry(\.group\.[^.]+)?\.(dev-)?dependencies$/ && /^[[:space:]]*[A-Za-z0-9_.-]+[[:space:]]*=/ {
            if ($0 !~ /^[[:space:]]*python[[:space:]]*=/) found = 1
          }
          END { exit found ? 0 : 1 }
        ' "$1"
      }

      _locks_unpinned() {
        case "$1:$(basename "$2")" in
          python:requirements*.txt)
            awk '
              function commit(s) { return match(s, /@[0-9a-f]+/) && RLENGTH == 41 }
              { sub(/\r$/, "") }
              /\\$/ { buf = buf substr($0, 1, length($0) - 1) " "; next }
              { line = buf $0; buf = "" }
              {
                sub(/(^|[[:space:]])#.*/, "", line)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
                if (line == "") next
                if (line ~ /^(-e|--editable)[[:space:]]+\./ || line ~ /^(\.|\/)/) next
                if (line ~ /^(-e|--editable)[[:space:]]/) {
                  if (!commit(line)) print line
                  next
                }
                if (line ~ /^-/) next
                req = line
                sub(/[[:space:]]*;.*/, "", req)
                sub(/[[:space:]]+--.*/, "", req)
                name = req; sub(/[[:space:]]*[][<>=!~@ (].*/, "", name)
                if (req ~ /@/) {
                  if (req !~ /(sha256|sha384|sha512)=/ && !commit(req)) print name
                  next
                }
                spec = substr(req, length(name) + 1)
                sub(/^[[:space:]]*\[[^]]*\]/, "", spec)
                if (spec !~ /^[[:space:]]*===?[[:space:]]*[^][,*<>=!~[:space:]]+[[:space:]]*$/) print name
              }
            ' "$2" ;;
          tofu:Terrafile)
            awk '
              /^[[:space:]]*#/ { next }
              /^[[:space:]]*mod[[:space:]]+"/ {
                name = $0; sub(/^[[:space:]]*mod[[:space:]]+"/, "", name); sub(/".*/, "", name)
                src = $0; if (sub(/.*source:[[:space:]]*"/, "", src)) sub(/".*/, "", src); else src = ""
                if (src ~ /^(\.|\/)/) next
                if ($0 ~ /version:[[:space:]]*"[^"]+"/) next
                print name
              }
            ' "$2" ;;
        esac
      }

      _locks_unhashed() {
        awk '
          { sub(/\r$/, "") }
          /\\$/ { buf = buf substr($0, 1, length($0) - 1) " "; next }
          { line = buf $0; buf = "" }
          {
            sub(/(^|[[:space:]])#.*/, "", line)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
            if (line == "" || line ~ /^-/ || line ~ /^(\.|\/)/) next
            if (line !~ /--hash=/) { name = line; sub(/[[:space:]]*[][<>=!~@ (;].*/, "", name); print name }
          }
        ' "$1"
      }

      _locks_skipped() {
        local path="$1" seg pat
        for seg in $_LOCKS_SKIP_SEGMENTS; do
          case "/$path" in */"$seg"/*) return 0 ;; esac
        done
        set -f
        for pat in ${DEPENDENCY_LOCKS_EXCLUDE:-}; do
          case "$path" in $pat|$pat/*) set +f; return 0 ;; esac
        done
        set +f
        return 1
      }

      _locks_lockfile_json() {
        local rel="$1" tracked=false modified=false
        if git -C "$_LOCKS_TOP" ls-files --error-unmatch -- "$rel" >/dev/null 2>&1; then
          tracked=true
          git -C "$_LOCKS_TOP" diff --quiet HEAD -- "$rel" 2>/dev/null || modified=true
        fi
        jq -cn --arg p "$rel" --argjson t "$tracked" --argjson m "$modified" \
          '{path: $p, tracked: $t, modifiedByBuild: $m}'
      }

      _locks_find() {
        local dir="$1" lookup="$2"; shift 2
        local cand found rel
        while :; do
          found=0
          for cand in "$@"; do
            rel="${dir:+$dir/}$cand"
            if [ -f "$_LOCKS_TOP/$rel" ]; then _locks_lockfile_json "$rel"; found=1; fi
          done
          [ "$found" = 1 ] && return 0
          [ "$lookup" = ancestor ] && [ -n "$dir" ] || return 0
          case "$dir" in */*) dir="${dir%/*}" ;; *) dir="" ;; esac
        done
      }

      _locks_gradle_entries() {
        local facts="$1" prefix="$2" row dir build lock lockfiles
        jq -c '.projects[]? | select((.configurations // 0) > 0)' "$facts" | while IFS= read -r row; do
          dir=$(printf '%s' "$row" | jq -r '.dir')
          [ "$dir" = "." ] && dir=""
          build=$(printf '%s' "$row" | jq -r '.buildFile // "build.gradle"')
          lock=$(printf '%s' "$row" | jq -r '.lockfile // "gradle.lockfile"')
          dir="${prefix}${dir}"; dir="${dir%/}"
          _locks_skipped "${dir:+$dir/}$build" && continue
          lockfiles="[]"
          if [ -f "$_LOCKS_TOP/${dir:+$dir/}$lock" ]; then
            lockfiles="[$(_locks_lockfile_json "${dir:+$dir/}$lock")]"
          fi
          printf '%s' "$row" | jq -c --arg m "${dir:+$dir/}$build" --argjson l "$lockfiles" \
            '{ecosystem: "gradle", path: $m, lockfiles: $l, unpinned: 0, unpinnedSample: [],
              lockMode: (.lockMode // null), unlockedConfigurations: (.unlocked // [])}'
        done
      }

      collect_dependency_locks() {
        local gradle_facts="${1:-}" prefix f base rule eco lookup dir entries names n lockfiles
        if ! _LOCKS_TOP=$(git rev-parse --show-toplevel 2>/dev/null); then
          jq -cn '{format: "dependency-lock/v1", git: false, manifests: []}'
          return 0
        fi
        prefix=$(git rev-parse --show-prefix 2>/dev/null)
        entries=$(mktemp)

        git ls-files -- . | while IFS= read -r f; do
          base="${f##*/}"
          rule=$(_locks_rule "$base")
          [ -n "$rule" ] || continue
          f="${prefix}${f}"
          _locks_skipped "$f" && continue
          set -- $rule
          eco="$1"; lookup="$2"; shift 2
          [ "$eco" = gradle ] && [ -n "$gradle_facts" ] && [ -s "$gradle_facts" ] && continue
          _locks_declares "$eco" "$_LOCKS_TOP/$f" || continue
          case "$f" in */*) dir="${f%/*}" ;; *) dir="" ;; esac
          case "$lookup" in
            self) lockfiles="[$(_locks_lockfile_json "$f")]" ;;
            none) lockfiles="[]" ;;
            *) lockfiles=$(_locks_find "$dir" "$lookup" "$@" | jq -cs '.') ;;
          esac
          names=$(_locks_unpinned "$eco" "$_LOCKS_TOP/$f" | jq -Rcs 'split("\n") | map(select(length > 0))')
          n=$(printf '%s' "$names" | jq 'length')
          hashed='{}'
          case "$eco:$base" in
            python:requirements*.txt)
              hashed=$(_locks_unhashed "$_LOCKS_TOP/$f" | jq -Rcs 'split("\n") | map(select(length > 0))
                       | {unhashed: length, unhashedSample: (unique | .[0:20])}') ;;
          esac
          jq -cn --arg e "$eco" --arg p "$f" --argjson l "$lockfiles" --argjson n "$n" --argjson s "$names" --argjson h "$hashed" \
            '{ecosystem: $e, path: $p, lockfiles: $l, unpinned: $n, unpinnedSample: ($s | unique | .[0:20])} + $h'
        done > "$entries"

        if [ -n "$gradle_facts" ] && [ -s "$gradle_facts" ]; then
          _locks_gradle_entries "$gradle_facts" "$prefix" >> "$entries"
        fi

        jq -cs --arg root "${prefix:-.}" --arg ex "${DEPENDENCY_LOCKS_EXCLUDE:-}" \
          '{format: "dependency-lock/v1", git: true, root: ($root | sub("/$"; "")),
            excluded: ($ex | split(" ") | map(select(length > 0))), manifests: .}' "$entries"
        rm -f "$entries"
      }

      _locks_findings() {
        jq -r '
          if .git == false then "NOT_A_GIT_WORK_TREE\t.\tcannot tell a committed lockfile from a generated one"
          else .manifests[]? as $m
            | ( if $m.ecosystem == "maven" then "LOCKFILE_UNSUPPORTED\t\($m.path)\tMaven has no lockfile format"
                elif ($m.lockfiles | length) == 0 then "LOCKFILE_MISSING\t\($m.path)\tno lockfile"
                else empty end ),
              ( $m.lockfiles[] | select(.tracked | not)
                | "LOCKFILE_NOT_COMMITTED\t\($m.path)\t\(.path) is not in git" ),
              ( $m.lockfiles[] | select(.modifiedByBuild)
                | "LOCKFILE_OUT_OF_SYNC\t\($m.path)\tthe build rewrote \(.path)" ),
              ( select(($m | has("lockMode")) and ($m.lockfiles | length) > 0 and $m.lockMode != "STRICT")
                | "LOCK_MODE_NOT_STRICT\t\($m.path)\tdependencyLocking lockMode is \($m.lockMode // "DEFAULT")" ),
              ( select(($m.unlockedConfigurations // []) | length > 0)
                | "CONFIGURATION_NOT_LOCKED\t\($m.path)\t\($m.unlockedConfigurations | .[0:10] | join(", "))" ),
              ( select(($m.unpinned // 0) > 0)
                | "DEPENDENCY_NOT_PINNED\t\($m.path)\t\($m.unpinned): \($m.unpinnedSample | join(", "))" ),
              ( select(($m.unhashed // 0) > 0)
                | "REQUIREMENTS_NOT_HASHED\t\($m.path)\t\($m.unhashed) without --hash (not a full lock): \($m.unhashedSample | join(", "))" )
          end' "$1"
      }

      dependency_locks_mode() {
        case "$1" in enforce|report) echo "$1"; return 0 ;; esac
        if [ "$2" = "false" ]; then echo report; else echo enforce; fi
      }

      assert_dependency_locks() {
        local locks="$1" mode="${2:-enforce}" findings count outcome tmp
        case "$mode" in enforce|report) ;; *) echo "dependency-locks: mode must be 'enforce' or 'report', got '${mode}'" >&2; return 1 ;; esac

        if [ ! -s "$locks" ]; then
          echo "dependency-locks: no facts at '${locks}' — the collector did not run" >&2
          [ "$mode" = enforce ] && return 1
          return 0
        fi

        findings=$(_locks_findings "$locks")
        count=$(printf '%s' "$findings" | grep -c . || true)
        if [ "$count" = 0 ]; then outcome=pass; else outcome=fail; fi

        tmp="${locks}.tmp"
        jq --arg mode "$mode" --arg outcome "$outcome" --argjson n "$count" \
          '. + {check: {name: "dependency-locks", mode: $mode, outcome: $outcome, findings: $n}}' "$locks" > "$tmp" \
          && mv "$tmp" "$locks"

        if [ "$outcome" = pass ]; then
          echo "dependency-locks: $(jq '.manifests | length' "$locks") manifest(s), every one locked"
          return 0
        fi

        {
          echo ""
          if [ "$mode" = enforce ]; then echo "DEPENDENCY LOCKS FAILED — ${count} finding(s):"
          else echo "dependency-locks: ${count} finding(s) — REPORTED, not enforced (the merge-request gate records mode=report):"; fi
          printf '%s\n' "$findings" | head -n 40 | awk -F '\t' '{ printf "  %-24s %s — %s\n", $1, $2, $3 }'
          [ "$count" -gt 40 ] && echo "  … and $((count - 40)) more (supervisory/dependency-locks.json)"
          echo ""
          echo "  Commit the lockfile the manifest's own tool writes, and install from it:"
          echo "    gradle  — dependencyLocking { lockAllConfigurations(); lockMode = LockMode.STRICT }, commit gradle.lockfile"
          echo "    npm     — package-lock.json / pnpm-lock.yaml / yarn.lock; npm ci, pnpm --frozen-lockfile"
          echo "    python  — uv.lock / poetry.lock / Pipfile.lock / pylock.toml, or a FULL requirements.txt with hashes:"
          echo "              mv requirements.txt requirements.in && pip-compile --generate-hashes requirements.in -o requirements.txt"
          echo "    php     — composer.lock        ruby — Gemfile.lock        go — go.sum        rust — Cargo.lock"
          echo "    tofu    — 'version:' on every Terrafile mod with a remote source"
          echo "  A path that is not the project's own (a fixture, a vendored tree) goes in dependency_locks_exclude."
        } >&2
        [ "$mode" = enforce ] && return 1
        return 0
      }

      _se_enabled() {
        [ "${GITLAB_CI:-}" = "true" ] || return 1
        [ -n "${SCAN_EVIDENCE_BUCKET:-}" ] && [ -n "${SCAN_EVIDENCE_ROLE_ARN:-}" ] || return 1
        if ! command -v aws >/dev/null 2>&1; then
          echo "scan evidence: no aws CLI - reports NOT stored (the control will fail on it)" >&2
          return 1
        fi
      }

      _se_assume() {
        if ! aws sts assume-role --role-arn "$SCAN_EVIDENCE_ROLE_ARN" \
            --role-session-name "scan-${CI_JOB_ID}" --duration-seconds 900 \
            --tags "Key=project-id,Value=${CI_PROJECT_ID}" \
            --query Credentials --output json > "$1"; then
          echo "scan evidence: could not assume $SCAN_EVIDENCE_ROLE_ARN - reports NOT stored (the control will fail on it)" >&2
          return 1
        fi
      }

      _se_put() {
        _sep_creds="$1"; _sep_src="$2"; _sep_name="$3"; _sep_tool="$4"; _sep_refs="$5"
        _sep_obj="$(dirname "$_sep_refs")/$_sep_name"
        if ! jq -c 'walk(if type == "object" then del(.lines, .metavars, .Code, .Line, .Match, .Secret)
                         elif type == "string" then sub("^(?<s>[A-Za-z][A-Za-z0-9+.-]*://)[^/@]+@"; "\(.s)")
                         else . end)' "$_sep_src" > "$_sep_obj"; then
          echo "scan evidence: $_sep_src is not JSON - not stored" >&2
          return 1
        fi
        _sep_hex="$(sha256sum "$_sep_obj" | cut -d' ' -f1)"
        _sep_key="scans/${CI_PROJECT_ID}/${CI_COMMIT_SHA}/${CI_JOB_ID}/${_sep_name}"
        if ! _sep_put="$(
            AWS_ACCESS_KEY_ID="$(jq -r .AccessKeyId "$_sep_creds")" \
            AWS_SECRET_ACCESS_KEY="$(jq -r .SecretAccessKey "$_sep_creds")" \
            AWS_SESSION_TOKEN="$(jq -r .SessionToken "$_sep_creds")" \
            aws s3api put-object --bucket "$SCAN_EVIDENCE_BUCKET" --key "$_sep_key" \
              --body "$_sep_obj" --content-type application/json \
              --checksum-algorithm SHA256 --if-none-match '*' --output json)"; then
          echo "scan evidence: upload of $_sep_key failed - not listed" >&2
          return 1
        fi
        _sep_stored="$(printf '%s' "$_sep_put" | jq -r '.ChecksumSHA256 // empty' | base64 -d 2>/dev/null | od -An -tx1 | tr -d ' \n')" || _sep_stored=""
        if [ "$_sep_stored" != "$_sep_hex" ]; then
          echo "scan evidence: S3 holds another checksum for $_sep_key (${_sep_stored:-none}) - not listed" >&2
          return 1
        fi
        jq --arg tool "$_sep_tool" --arg uri "s3://${SCAN_EVIDENCE_BUCKET}/${_sep_key}" --arg digest "sha256:${_sep_hex}" \
          '. + [{tool: $tool, s3Uri: $uri, digest: $digest}]' "$_sep_refs" > "$_sep_refs.next" \
          && mv "$_sep_refs.next" "$_sep_refs"
        echo "scan evidence: stored s3://${SCAN_EVIDENCE_BUCKET}/${_sep_key}" >&2
      }

      _se_list() {
        jq --slurpfile refs "$2" '.reports = $refs[0]' "$1" > "$1.reports" && mv "$1.reports" "$1"
      }

      store_scan_reports() {
        _ssr_dir="$1"; _ssr_summary="$2"
        _se_enabled || return 0
        if [ ! -f "$_ssr_summary" ] || [ ! -d "$_ssr_dir" ]; then
          echo "scan evidence: no summary or reports to store" >&2
          return 0
        fi
        _ssr_work="$(mktemp -d)"
        _se_assume "$_ssr_work/creds.json" || { rm -rf "$_ssr_work"; return 0; }
        echo '[]' > "$_ssr_work/refs.json"
        for _ssr_file in "$_ssr_dir"/*.json; do
          [ -f "$_ssr_file" ] || continue
          _ssr_base="$(basename "$_ssr_file")"
          case "$_ssr_base" in
            og.json)              _ssr_tool=opengrep;     _ssr_name=opengrep.json ;;
            tvimg.json)           _ssr_tool=trivy;        _ssr_name=trivy-image.json ;;
            tvfs.json)            _ssr_tool=trivy;        _ssr_name=trivy-fs.json ;;
            trivy-config-*.json)  _ssr_tool=trivy-config; _ssr_name="$_ssr_base" ;;
            osv.json)             _ssr_tool=osv-scanner;  _ssr_name=osv-scanner.json ;;
            gitleaks.json)        _ssr_tool=gitleaks;     _ssr_name=gitleaks.json ;;
            sbom.cdx.json)        _ssr_tool=trivy;        _ssr_name=sbom.cdx.json ;;
            *) continue ;;
          esac
          _se_put "$_ssr_work/creds.json" "$_ssr_file" "$_ssr_name" "$_ssr_tool" "$_ssr_work/refs.json" || true
        done
        _se_list "$_ssr_summary" "$_ssr_work/refs.json" || true
        rm -rf "$_ssr_work"
      }

      store_dependency_evidence() {
        _sde_payload="$1"; _sde_name="$2"; _sde_tool="$3"
        _se_enabled || return 0
        if [ ! -s "$_sde_payload" ]; then
          echo "scan evidence: no $_sde_payload to store" >&2
          return 0
        fi
        jq -e 'has("reports")' "$_sde_payload" >/dev/null 2>&1 && return 0
        _sde_work="$(mktemp -d)"
        echo '[]' > "$_sde_work/refs.json"
        if _se_assume "$_sde_work/creds.json"; then
          _se_put "$_sde_work/creds.json" "$_sde_payload" "$_sde_name" "$_sde_tool" "$_sde_work/refs.json" || true
        fi
        _se_list "$_sde_payload" "$_sde_work/refs.json" || true
        rm -rf "$_sde_work"
      }
      _locks_mode=$(dependency_locks_mode "${DEPENDENCY_LOCKS_CHECK:-}" "${FAIL_ON_FINDINGS:-true}")
      echo "dependency-locks: mode ${_locks_mode}"
      _locks_facts=""
      [ -s supervisory/.gradle-locking.json ] && _locks_facts=supervisory/.gradle-locking.json
      mkdir -p supervisory
      collect_dependency_locks "$_locks_facts" > supervisory/dependency-locks.json
      set +e
      assert_dependency_locks supervisory/dependency-locks.json "$_locks_mode"
      _locks_status=$?
      set -e
      store_dependency_evidence supervisory/dependency-locks.json dependency-locks.json dependency-locks
      store_dependency_evidence supervisory/dependency-inventory.json dependency-inventory.json dependency-sources
      [ "$_locks_status" -eq 0 ] || exit "$_locks_status"

      _sha256_of() {  # _sha256_of <file> → hex digest on stdout
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum "$1" | cut -d' ' -f1
        elif command -v busybox >/dev/null 2>&1 && busybox sha256sum "$1" >/dev/null 2>&1; then
          busybox sha256sum "$1" | cut -d' ' -f1
        elif command -v openssl >/dev/null 2>&1; then
          openssl dgst -sha256 "$1" | awk '{print $NF}'
        else
          return 1
        fi
      }

      fetch_verified() {  # fetch_verified <url> <expected sha256> <dest>
        fetch_url "$1" > "$3" || { echo "fetch_verified: could not download $1" >&2; rm -f "$3"; return 1; }
        _fv_actual="$(_sha256_of "$3")" || {
          echo "fetch_verified: no sha256 tool in this image, refusing to use an unverified $3" >&2
          rm -f "$3"; return 1
        }
        if [ "$_fv_actual" != "$2" ]; then
          rm -f "$3"
          echo "fetch_verified: CHECKSUM MISMATCH for $1" >&2
          echo "  expected $2" >&2
          echo "  actual   $_fv_actual" >&2
          echo "  If this followed a version bump, update the matching *_sha256_* input; otherwise treat the" >&2
          echo "  download as untrusted and do not re-run until you know why it changed." >&2
          return 1
        fi
      }

      ensure_verified_pinned() {
        _evp_label="$1"; _evp_url="$2"; _evp_expected="$3"; _evp_dest="$4"

        if [ -z "$_evp_expected" ]; then
          echo "$_evp_label: no pinned checksum for this platform in tools_config.yml -- refusing to trust $_evp_dest" >&2
          return 1
        fi

        if [ -f "$_evp_dest" ]; then
          _evp_actual="$(_sha256_of "$_evp_dest" 2>/dev/null)"
          if [ "$_evp_actual" = "$_evp_expected" ]; then
            echo "$_evp_label: reused from cache (sha256 matches the pinned value)" >&2
            return 0
          fi
          echo "$_evp_label: cached copy does not match the pinned checksum -- discarding" >&2
          rm -f "$_evp_dest"
        fi

        fetch_url "$_evp_url" > "$_evp_dest" 2>/dev/null || {
          echo "$_evp_label: download failed" >&2
          rm -f "$_evp_dest"
          return 1
        }
        _evp_actual="$(_sha256_of "$_evp_dest")" || {
          echo "$_evp_label: no sha256 tool in this image, refusing to trust $_evp_dest" >&2
          rm -f "$_evp_dest"
          return 1
        }
        if [ "$_evp_actual" != "$_evp_expected" ]; then
          echo "$_evp_label: CHECKSUM MISMATCH against the pinned value for $_evp_dest (expected $_evp_expected, got $_evp_actual) -- discarding, not installed" >&2
          rm -f "$_evp_dest"
          return 1
        fi
      }

      install_pinned_tool() {
        _ipt_tool="$1"; _ipt_bin_dir="$2"; _ipt_arc_dir="$3"; _ipt_label="${4:-$1}"
        _ipt_prefix="$(printf '%s' "$_ipt_tool" | tr 'a-z-' 'A-Z_')"
        eval "_ipt_version=\${${_ipt_prefix}_PIN_VERSION:-}; _ipt_binary=\${${_ipt_prefix}_PIN_BINARY:-}"
        eval "_ipt_url=\${${_ipt_prefix}_PIN_URL:-}; _ipt_sha=\${${_ipt_prefix}_PIN_SHA256:-}"
        eval "_ipt_archive=\${${_ipt_prefix}_PIN_ARCHIVE:-}"
        if [ -z "$_ipt_binary" ]; then
          echo "$_ipt_label: no pins for $_ipt_tool in this script — the caller needs a '# @@pins $_ipt_tool' marker" >&2
          return 1
        fi
        echo "$_ipt_label: pinned ${_ipt_version} (${SEC_OS:-?}/${SEC_ARCH:-?})" >&2
        mkdir -p "$_ipt_bin_dir" "$_ipt_arc_dir"
        if [ -n "$_ipt_archive" ]; then
          _ipt_dest="${_ipt_arc_dir}/${_ipt_tool}-${_ipt_version}-${SEC_OS:-}-${SEC_ARCH:-}.${_ipt_archive}"
          ensure_verified_pinned "$_ipt_label" "$_ipt_url" "$_ipt_sha" "$_ipt_dest" || return 1
          rm -f "${_ipt_bin_dir}/${_ipt_binary}"
          tar -xzf "$_ipt_dest" -C "$_ipt_bin_dir" "$_ipt_binary" >&2 || {
            echo "$_ipt_label: $_ipt_dest has no $_ipt_binary in it — not a $_ipt_tool release archive" >&2
            return 1
          }
        else
          ensure_verified_pinned "$_ipt_label" "$_ipt_url" "$_ipt_sha" "${_ipt_bin_dir}/${_ipt_binary}" || return 1
        fi
        chmod +x "${_ipt_bin_dir}/${_ipt_binary}"

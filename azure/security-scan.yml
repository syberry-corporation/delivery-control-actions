      inventory_pnpm() {
        yq -o=json '.' "$1" | jq '{
          format: "dependency-inventory/v1",
          dependencies: ([ (.packages // {}) | to_entries[]
            | { name: (.key | sub("@[^@]+$"; "")),
                version: ((.key | capture("@(?<v>[^@]+)$").v) // ""),

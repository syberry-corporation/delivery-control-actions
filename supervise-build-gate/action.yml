name: 'Supervisory build gate (container image)'
description: >-
  Submits SD-1.1 (automated build), SD-1.2 (source provenance), SD-1.3 (build traceability), SD-1.4 (build
  metadata / SBOM) and SD-1.5 (central artifact repository) for a container image that has already been
  pushed. The evidence is read back OUT OF THE REGISTRY — the image's own SBOM and provenance attestations —
  so the gate assesses what was published rather than what the build said it published.
inputs:
  supervisory_eval_url:
    description: 'Base URL of the Supervisory Evaluation API'
    required: true
  supervisory_project:
    description: 'Supervisory project id to submit evidence for'
    required: true
  component:
    description: 'The name of the application component'
    required: true
  image_repository:
    description: 'The image repository, without a tag or digest (e.g. <ECR_REGISTRY>/backend, with the registry taken from a variable)'
    required: true
  image_reference:
    description: 'The tag or digest that was pushed and is to be assessed'
    required: true
  supervisory_audience:
    description: 'OIDC audience the Supervisory service expects'
    default: 'supervisory-service'
  project_path:
    description: 'Path to the component within the repository'
    default: '.'
  buildx_version:
    description: 'docker buildx version to install for inspecting the image'
    default: 'v0.19.3'
  oras_version:
    description: >-
      DEPRECATED — ignored. oras is installed at the version and sha256 pinned in tools_config.yml; a
      non-empty value only prints a note when it disagrees with the pin.
    default: ''
  sbom_media_type:
    description: 'Media type recorded for the SBOM'
    default: 'application/vnd.cyclonedx+json'
  provenance_media_type:
    description: 'Media type recorded for the provenance statement'
    default: 'application/vnd.in-toto+json'

# The calling WORKFLOW must grant `id-token: write`, and must already be LOGGED IN to the registry — this
# reads the image back, it does not build or push it. On AWS that is an OIDC role assumption plus an ECR
# login in the caller, which is also what makes the AWS credentials the caller's concern rather than this
# action's.
runs:
  using: composite
  steps:
    # The verified oras archive `requires: [oras]` installs, kept between runs. Nothing in it is trusted for
    # being there: ensure_oras.sh re-verifies it against the tools_config.yml pin before extracting it. The
    # key carries the PINNED version (stamped by the generator) because a GitHub cache is immutable: under a
    # key that survived a pin bump, the new archive would never be saved and every run would download it.
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/tool-cache/.archives
        key: delivery-control-oras-1.2.0-${{ runner.os }}-${{ runner.arch }}
    - name: Submit build evidence
      shell: bash
      env:
        EVAL_URL: ${{ inputs.supervisory_eval_url }}
        SUP_PROJECT: ${{ inputs.supervisory_project }}
        COMPONENT_NAME: ${{ inputs.component }}
        SUPERVISORY_AUDIENCE: ${{ inputs.supervisory_audience }}
        PROJECT_PATH: ${{ inputs.project_path }}
        IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        IMAGE_REFERENCE: ${{ inputs.image_reference }}
        BUILDX_VERSION: ${{ inputs.buildx_version }}
        ORAS_VERSION: ${{ inputs.oras_version }}
        SBOM_MEDIA_TYPE: ${{ inputs.sbom_media_type }}
        PROVENANCE_MEDIA_TYPE: ${{ inputs.provenance_media_type }}
      run: |
        # --- define: fetch_url ---
        # Fetch a URL to stdout with whichever downloader the job's image happens to have.
        #
        # Most blocks run on an image that ships curl, which is why curl is tried first. The container-build
        # blocks do not: the <workload>-build tag runs upstream kaniko (`executor:*-debug`, mirrored), which is
        # the executor plus busybox and — by the image's explicit design — nothing else. There is no curl in it.
        #
        # There is a wget: busybox provides `/busybox/wget`, `/busybox` is already on that image's PATH, and
        # `ssl_client` sits beside it so TLS works. So the only thing standing between the SBOM/provenance steps
        # and a working download was the literal name `curl`.
        #
        # The bootstrap container cannot paper over this: it symlinks a fixed list of busybox applets into the
        # job's PATH (sh, cat, tar, sed, awk, …) and neither curl nor wget is on that list.
        #
        # CRITICAL: this file is `# @@`-inlined into a caller script that runs as a plain `bash -c` step, not
        # sourced. The body is therefore only a function definition — nothing executes at inclusion time, and the
        # `return` below is function-scoped, so it cannot short-circuit the caller's remaining script steps.
        #
        # https ONLY, including across redirects. Every caller passes an https URL, but a 30x can point anywhere,
        # and both curl -L and urllib will happily follow one down to plain http — at which point the bytes are
        # whatever the network says they are. These are executables we then run, so the downgrade is refused.
        fetch_url() {  # fetch_url <url>  → response body on stdout
          case "$1" in https://*) ;; *) echo "fetch_url: refusing non-https URL: $1" >&2; return 1 ;; esac
          if command -v curl >/dev/null 2>&1; then
            curl -fsSL --proto '=https' --proto-redir '=https' "$1"
          elif command -v wget >/dev/null 2>&1; then
            # busybox wget has no --proto equivalent, and its built-in TLS does not validate certificates at all.
            # It is reached only on the kaniko image, where every caller pairs it with fetch_verified's pinned
            # sha256 — that checksum, not the transport, is what makes those downloads trustworthy.
            wget -qO- "$1"
          elif command -v python3 >/dev/null 2>&1; then
            # The toolchain images ship neither curl nor wget: `python:*-slim` has no curl AND no wget (nor jq,
            # nor git), so both branches above miss and every on-demand tool install died on
            # `curl: command not found` the first time a python job ran on a dynamic runner. python3 is by
            # definition present on those images.
            #
            # This path is STRONGER than the wget one, not a grudging last resort: urllib validates certificates
            # and hostnames by default (verified against expired/self-signed/wrong-host/untrusted-root).
            # copyfileobj streams — .read() would hold the whole body in memory, and awscli-exe is ~70 MiB
            # against the 512 MiB an `s`-sized lambda runner gets.
            python3 - "$1" <<'FETCH_URL_PY'
        import shutil, sys, urllib.request

        response = urllib.request.urlopen(sys.argv[1], timeout=60)
        # .url is the FINAL url after any redirects, and the body has not been transferred yet — it moves only
        # when copyfileobj asks for it. So bailing out here means nothing fetched over plain http is ever written.
        if not response.url.startswith("https://"):
            raise SystemExit("fetch_url: redirected off https to " + response.url)
        shutil.copyfileobj(response, sys.stdout.buffer)
        FETCH_URL_PY
          else
            echo "fetch_url: no curl, wget or python3 in this image" >&2
            return 1
          fi
        }

        # fetch_link_local <url> → response body on stdout. The OPPOSITE guard to fetch_url's, and deliberately
        # in the same file so the two contracts are read together.
        #
        # `fetch_url` refuses anything that is not https because what it fetches is executables that then run.
        # That guard is unconditional on purpose, and a caller who needs the ECS task metadata endpoint cannot
        # simply be allowed through it: that endpoint is `http://169.254.170.2/v4/<id>`, plain http, served by
        # the agent on the host, and it will never be anything else. Pointed at it, fetch_url printed
        # `refusing non-https URL` and returned 1 — which is correct, and which is how the security scan's layer
        # cache spent every run reporting that it could not resolve its account.
        #
        # So this one refuses everything EXCEPT the two link-local metadata addresses. Neither function can be
        # misused for the other's job: one cannot fetch metadata, the other cannot fetch a binary.
        #
        # What makes the missing https guard acceptable here is not that the data is unimportant — it is that
        # there is no network between us and the source. 169.254.0.0/16 is not routable off the host; the reply
        # comes from the agent in the same task. TLS would be protecting the loopback from itself.
        fetch_link_local() {  # fetch_link_local <url>  → response body on stdout
          case "$1" in
            http://169.254.170.2/*|http://169.254.169.254/*) ;;
            *) echo "fetch_link_local: refusing non-link-local URL: $1" >&2; return 1 ;;
          esac
          # Same three-way chain as above and for the same reason — the toolchain images disagree about which of
          # curl, wget and python3 they ship — minus the `--proto '=https'` flags, which would reject this URL.
          # Short timeouts throughout: a link-local endpoint answers in milliseconds or is not there at all, and
          # a caller that falls back to "no layer cache" must not first hang the job for a minute finding out.
          if command -v curl >/dev/null 2>&1; then
            curl -fsS --max-time 5 "$1"
          elif command -v wget >/dev/null 2>&1; then
            wget -qO- -T 5 "$1"
          elif command -v python3 >/dev/null 2>&1; then
            python3 -c 'import sys,urllib.request;sys.stdout.write(urllib.request.urlopen(sys.argv[1],timeout=5).read().decode())' "$1"
          else
            echo "fetch_link_local: no curl, wget or python3 available" >&2
            return 1
          fi
        }
        # --- define: oras ---
        ensure_oras() {
          # Install oras on demand — the client the supervisory build gates discover and pull OCI referrers with.
          #
          # The SBOM and the SLSA provenance of a container image are REFERRERS of its digest in the registry, and
          # `oras discover` / `oras pull` is how a gate reads them back. Neither the GitLab supervise tag's image nor a
          # GitHub-hosted runner ships oras, and the discovery scripts tolerate its absence (`|| echo '{}'`) so that a
          # registry hiccup reads as "no referrer" rather than a crash — which means a gate WITHOUT oras does not
          # fail: it reports both referrers missing and SD-1.2/SD-1.4 fail closed while the evidence sits in the
          # registry. That is why oras is declared on the job and installed before anything runs, not left to a step.
          #
          # `ORAS_VERSION` (deprecated `oras_version`) is only compared against the pin. Body of `ensure_oras` — no
          # top-level `return`.
          # SEC_OS / SEC_ARCH: the `<os>_<arch>` key of tools_config.yml's `platforms`. Must run BEFORE `# @@pins`
          # (1.4.18 died on `SEC_OS: unbound variable`). An unknown arch reads as amd64: at worst "no pin".
          case "$(uname -s)" in
            Linux) SEC_OS=linux ;;
            Darwin) SEC_OS=darwin ;;
            MINGW*|MSYS*|CYGWIN*) SEC_OS=windows ;;
            *) SEC_OS=linux ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) SEC_ARCH=amd64 ;;
            arm64|aarch64) SEC_ARCH=arm64 ;;
            *) SEC_ARCH=amd64 ;;
          esac
          # ---- @@pins: injected from tools_config.yml by build/generate.py -- DO NOT hand-edit ----
          ORAS_PIN_VERSION="1.2.0"
          ORAS_PIN_BINARY="oras"
          case "${SEC_OS:-}_${SEC_ARCH:-}" in
            darwin_amd64) ORAS_PIN_URL="https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_darwin_amd64.tar.gz"; ORAS_PIN_SHA256="58a8494f5bce778e21d89d90c82e05bd128e7bb9d84dd190d154f8afdbf30541"; ORAS_PIN_ARCHIVE="tar.gz" ;;
            darwin_arm64) ORAS_PIN_URL="https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_darwin_arm64.tar.gz"; ORAS_PIN_SHA256="fea801b0e02c5342e749ef2860e1faebae03e93ae50e33ed40d227e089cf9435"; ORAS_PIN_ARCHIVE="tar.gz" ;;
            linux_amd64) ORAS_PIN_URL="https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz"; ORAS_PIN_SHA256="5b3f1cbb86d869eee68120b9b45b9be983f3738442f87ee5f06b00edd0bab336"; ORAS_PIN_ARCHIVE="tar.gz" ;;
            linux_arm64) ORAS_PIN_URL="https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_arm64.tar.gz"; ORAS_PIN_SHA256="27df680a39fc2fcedc549cb737891623bc696c9a92a03fd341e9356a35836bae"; ORAS_PIN_ARCHIVE="tar.gz" ;;
            *) ORAS_PIN_URL=""; ORAS_PIN_SHA256=""; ORAS_PIN_ARCHIVE="" ;;
          esac
          # ---- end @@pins ----
          # Download a file and refuse it unless it hashes to exactly what we expect.
          #
          # Why this exists: the container-build blocks run on the <workload>-build tag, whose image is upstream
          # kaniko. The only downloader there is busybox's wget, and busybox's built-in TLS does not implement
          # certificate validation at all — it says so in the job log, once per download. So the transport carries no
          # proof of who served the bytes, and these particular bytes are executables that then run in a job holding
          # push rights to ECR.
          #
          # A pinned SHA-256 makes the transport's honesty irrelevant: a substituted file fails the comparison and
          # the step stops. That is also why the checksum is pinned in the block rather than fetched alongside the
          # artifact — a checksums file served over the same unverified channel proves nothing.
          #
          # The check guards the DOWNLOAD, not the cache. A binary already in .tool-cache came from a previous run of
          # this same check and lives in the runners' own S3 bucket, which nothing outside the platform writes.
          #
          # CRITICAL: `# @@`-inlined into a plain `bash -c` step, not sourced — so this file defines functions and
          # executes nothing at include time, and `return` here is function-scoped.

          _sha256_of() {  # _sha256_of <file> → hex digest on stdout
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            elif command -v busybox >/dev/null 2>&1 && busybox sha256sum "$1" >/dev/null 2>&1; then
              busybox sha256sum "$1" | cut -d' ' -f1
            elif command -v openssl >/dev/null 2>&1; then
              openssl dgst -sha256 "$1" | awk '{print $NF}'
            else
              return 1
            fi
          }

          fetch_verified() {  # fetch_verified <url> <expected sha256> <dest>
            fetch_url "$1" > "$3" || { echo "fetch_verified: could not download $1" >&2; rm -f "$3"; return 1; }
            _fv_actual="$(_sha256_of "$3")" || {
              echo "fetch_verified: no sha256 tool in this image, refusing to use an unverified $3" >&2
              rm -f "$3"; return 1
            }
            if [ "$_fv_actual" != "$2" ]; then
              rm -f "$3"
              echo "fetch_verified: CHECKSUM MISMATCH for $1" >&2
              echo "  expected $2" >&2
              echo "  actual   $_fv_actual" >&2
              echo "  If this followed a version bump, update the matching *_sha256_* input; otherwise treat the" >&2
              echo "  download as untrusted and do not re-run until you know why it changed." >&2
              return 1
            fi
          }
          #
          # Verifies a scanner-tool download — cached OR freshly fetched — against a sha256 PINNED IN THIS
          # REPOSITORY (`tools_config.yml`, at the repo root), never against anything fetched or read at RUNTIME.
          #
          # THE TRUST ANCHOR IS THE REVIEWED MANIFEST, not a checksums file this job goes and fetches. Earlier
          # versions of this file re-fetched each project's own checksums file fresh every run; that was replaced
          # because a value ONLY a human reviewed, in a diff, at a fixed commit, is a stronger anchor than one
          # fetched over the network at job time — no dependency on a checksums file's URL shape staying stable, no
          # per-job HTTP round trip for something that never changes between releases, and one design for every tool
          # instead of two (the previous "checksums file exists" / "opengrep, which has none" split). See
          # `tools_config.yml`'s own header for how the pins are captured and kept current
          # (`build/update-tool-pins.py`), and `build/generate.py`'s `render_tool_pins()` for how they reach the
          # generated shell — install-tools.sh reads them from `<PREFIX>_PIN_URL` / `<PREFIX>_PIN_SHA256` /
          # `<PREFIX>_PIN_VERSION`, injected at BUILD time via the `# @@pins` marker, one set of three per tool.
          #
          # WHERE EACH PIN CAME FROM, PLAINLY (all captured once, out of band, not fetched by this script):
          #   trivy, gitleaks, syft, osv-scanner, buildx — each project publishes its OWN checksums file for the
          #   release (trivy/gitleaks/syft: `<name>_<version>_checksums.txt`; osv-scanner: one aggregate
          #   `osv-scanner_SHA256SUMS`; buildx: `checksums.txt`) and `build/update-tool-pins.py` reads the line for
          #   the asset this script downloads straight out of that file.
          #   opengrep — publishes NO checksums file (sigstore `.sig`/`.cert` only; verifying those needs `cosign`
          #   plus a network path to the Rekor transparency log, a materially heavier mechanism, out of scope here),
          #   so its pins are the sha256 of the release asset itself, downloaded once over HTTPS and hashed locally.
          # `tools_config.yml`'s own header repeats this per-tool, next to the actual pinned values.
          #
          # THE INVARIANT THE SHARED, UNPROTECTED `sec-scan-tools-*` CACHE DEPENDS ON: nothing restored from it is
          # ever trusted because it was already there. Every call to `ensure_verified_pinned` re-verifies the file it
          # finds against the SAME pin the caller would use for a fresh download — whether that file arrived a
          # second ago or was restored from a cache written by an entirely different (possibly unprotected) pipeline.
          # A mismatch is never run; it is discarded and re-downloaded, and if the re-download still does not match
          # the pin, the tool is simply not installed — there is no "proceed anyway, unverified" outcome left in this
          # file, because with a pin available there is nothing left to be lenient ABOUT: either the bytes match a
          # value this repository already reviewed, or they do not exist here as far as this script is concerned.
          #
          # CRITICAL: `# @@`-inlined into a plain `bash -c` step, not sourced — same contract as fetch_url.sh and
          # fetch_verified.sh: this file only defines functions, and `return` below is function-scoped.

          # ensure_verified_pinned <label> <download-url> <expected-sha256> <dest-file>
          #
          # A verified cache hit is reused with no download at all; a miss or a mismatch downloads fresh and checks
          # again against the SAME pin. An empty <expected-sha256> is refused outright — not treated as a lesser,
          # TLS-only trust level — because the caller (install-tools.sh) only omits one when tools_config.yml has no
          # entry for this platform/tool at all, which is a gap in the manifest, not a transient failure to route
          # around.
          #
          # Returns 0 with dest-file present and matching the pin; 1 if no such file could be produced, having
          # discarded anything that did not match along the way. The caller decides what "1" means for its job — see
          # install-tools.sh's own comment on fail-open (at the SCAN/dimension level, the existing convention) vs
          # fail-closed (at the TOOL level: a mismatched binary is never executed, pinned or not).
          ensure_verified_pinned() {
            _evp_label="$1"; _evp_url="$2"; _evp_expected="$3"; _evp_dest="$4"

            if [ -z "$_evp_expected" ]; then
              echo "$_evp_label: no pinned checksum for this platform in tools_config.yml -- refusing to trust $_evp_dest" >&2
              return 1
            fi

            if [ -f "$_evp_dest" ]; then
              _evp_actual="$(_sha256_of "$_evp_dest" 2>/dev/null)"
              if [ "$_evp_actual" = "$_evp_expected" ]; then
                echo "$_evp_label: reused from cache (sha256 matches the pinned value)" >&2
                return 0
              fi
              echo "$_evp_label: cached copy does not match the pinned checksum -- discarding" >&2
              rm -f "$_evp_dest"
            fi

            fetch_url "$_evp_url" > "$_evp_dest" 2>/dev/null || {
              echo "$_evp_label: download failed" >&2
              rm -f "$_evp_dest"
              return 1
            }
            _evp_actual="$(_sha256_of "$_evp_dest")" || {
              echo "$_evp_label: no sha256 tool in this image, refusing to trust $_evp_dest" >&2
              rm -f "$_evp_dest"
              return 1
            }
            if [ "$_evp_actual" != "$_evp_expected" ]; then
              echo "$_evp_label: CHECKSUM MISMATCH against the pinned value for $_evp_dest (expected $_evp_expected, got $_evp_actual) -- discarding, not installed" >&2
              rm -f "$_evp_dest"
              return 1
            fi
          }

          # warn_deprecated_version_input <label> <input-value> <pinned-version>
          #
          # `trivy_version` / `opengrep_version` / `osv_scanner_version` / `syft_version` / `gitleaks_version` /
          # `buildx_version` no longer choose what gets installed — the version, and the checksum it must match, now
          # come from tools_config.yml alone (injected at build time; see `# @@pins`). The inputs are kept ACCEPTED
          # (removing one outright is a build error for any consumer still passing it — GitLab rejects an unknown
          # component input) but default to empty and are IGNORED for real: this prints one clear note when a
          # consumer set one anyway to a value that disagrees with the pin, so the gap between "what I asked for" and
          # "what actually ran" is not silent. Nothing here changes which binary gets installed.
          warn_deprecated_version_input() {
            [ -n "$2" ] || return 0
            if [ "$2" != "$3" ]; then
              echo "$1: input version '$2' is ignored (deprecated) -- installing the pinned $3 from tools_config.yml instead" >&2
            else
              echo "$1: input version '$2' matches the current pin -- the input is deprecated and no longer needed (will be removed in a future major)" >&2
            fi
          }

          # install_pinned_tool <tool> <bin-dir> <archive-dir> [<log-label>] — the one download-verify-install for
          # every tool in tools_config.yml, from the `# @@pins <tool>` variables the caller carries (`_PIN_BINARY`,
          # `_PIN_ARCHIVE` = tar.gz or empty). Returns 1 when nothing verified was installed; never exits.
          install_pinned_tool() {
            _ipt_tool="$1"; _ipt_bin_dir="$2"; _ipt_arc_dir="$3"; _ipt_label="${4:-$1}"
            _ipt_prefix="$(printf '%s' "$_ipt_tool" | tr 'a-z-' 'A-Z_')"
            eval "_ipt_version=\${${_ipt_prefix}_PIN_VERSION:-}; _ipt_binary=\${${_ipt_prefix}_PIN_BINARY:-}"
            eval "_ipt_url=\${${_ipt_prefix}_PIN_URL:-}; _ipt_sha=\${${_ipt_prefix}_PIN_SHA256:-}"
            eval "_ipt_archive=\${${_ipt_prefix}_PIN_ARCHIVE:-}"
            if [ -z "$_ipt_binary" ]; then
              echo "$_ipt_label: no pins for $_ipt_tool in this script — the caller needs a '# @@pins $_ipt_tool' marker" >&2
              return 1
            fi
            echo "$_ipt_label: pinned ${_ipt_version} (${SEC_OS:-?}/${SEC_ARCH:-?})" >&2
            mkdir -p "$_ipt_bin_dir" "$_ipt_arc_dir"
            if [ -n "$_ipt_archive" ]; then
              _ipt_dest="${_ipt_arc_dir}/${_ipt_tool}-${_ipt_version}-${SEC_OS:-}-${SEC_ARCH:-}.${_ipt_archive}"
              ensure_verified_pinned "$_ipt_label" "$_ipt_url" "$_ipt_sha" "$_ipt_dest" || return 1
              rm -f "${_ipt_bin_dir}/${_ipt_binary}"
              tar -xzf "$_ipt_dest" -C "$_ipt_bin_dir" "$_ipt_binary" >&2 || {
                echo "$_ipt_label: $_ipt_dest has no $_ipt_binary in it — not a $_ipt_tool release archive" >&2
                return 1
              }
            else
              ensure_verified_pinned "$_ipt_label" "$_ipt_url" "$_ipt_sha" "${_ipt_bin_dir}/${_ipt_binary}" || return 1
            fi
            chmod +x "${_ipt_bin_dir}/${_ipt_binary}"
          }
          # ensure_pinned_tool <tool> — the body of a `requires:` helper for a tool pinned in tools_config.yml. Uses
          # an image's own copy if it has one; otherwise installs into `.tool-cache/` (GitLab, kept by the job's
          # `cache:`) or `$RUNNER_TEMP/tool-cache` (GitHub: never into the consumer's checkout). Returns 1 on failure.
          ensure_pinned_tool() {
            _ept_tool="$1"
            if [ -n "${CI_PROJECT_DIR:-}" ]; then
              _ept_cache="${CI_PROJECT_DIR}/.tool-cache"
            else
              _ept_cache="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/tool-cache"
            fi
            _ept_found="$(command -v "$_ept_tool" 2>/dev/null || true)"
            if [ -n "$_ept_found" ] && [ "$_ept_found" != "${_ept_cache}/bin/${_ept_tool}" ]; then
              echo "ensure_${_ept_tool}: present ($_ept_found)" >&2
              return 0
            fi
            install_pinned_tool "$_ept_tool" "${_ept_cache}/bin" "${_ept_cache}/.archives" "ensure_${_ept_tool}" || {
              echo "ensure_${_ept_tool}: no verified ${_ept_tool} for ${SEC_OS:-?}/${SEC_ARCH:-?} — refusing to run an unverified one" >&2
              return 1
            }
            case ":$PATH:" in *":${_ept_cache}/bin:"*) ;; *) export PATH="${_ept_cache}/bin:$PATH" ;; esac
            if ! command -v "$_ept_tool" >/dev/null 2>&1; then
              echo "ensure_${_ept_tool}: ${_ept_tool} is still not on PATH after installing it." >&2
              echo "  PATH=$PATH" >&2
              return 1
            fi
          }
          warn_deprecated_version_input oras "${ORAS_VERSION:-}" "$ORAS_PIN_VERSION"
          ensure_pinned_tool oras || exit 1
        }
        # --- install ---
        # --- @requires: fetch_url ---
        # --- @requires: oras ---
        ensure_oras
        set -euo pipefail
        cd "$PROJECT_PATH"
        # What the GitLab block sets from its own inputs, derived here from the one the caller gives. The
        # shared discovery scripts address referrers as `${ECR_URL}/${repository}@<digest>`, under `set -u`:
        # left unset, the step aborted the moment a referrer was FOUND — i.e. only once the build was right.
        ECR_URL="${IMAGE_REPOSITORY%%/*}"
        repository="${IMAGE_REPOSITORY#*/}"
        export DOCKER_CONFIG="${DOCKER_CONFIG:-$HOME/.docker}"
        BIN_DIR="$(mktemp -d)"; export PATH="${BIN_DIR}:${PATH}"
        case "$(uname -m)" in x86_64) ARCH=amd64 ;; aarch64|arm64) ARCH=arm64 ;; *) echo "unsupported arch $(uname -m)"; exit 1 ;; esac
        if ! docker buildx version >/dev/null 2>&1; then
          mkdir -p "$DOCKER_CONFIG/cli-plugins"
          curl -fsSL "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${ARCH}" -o "$DOCKER_CONFIG/cli-plugins/docker-buildx"
          chmod +x "$DOCKER_CONFIG/cli-plugins/docker-buildx"
        fi
        # Resolve the pushed image to its DIGEST and address it that way from here on. A tag is a moving
        # pointer: evidence about "the image at tag X" is evidence about whatever X meant at read time.
        INSPECT_JSON=$(docker buildx imagetools inspect --raw-format '{{json .}}' \
          "${IMAGE_REPOSITORY}:${IMAGE_REFERENCE#:}" 2>/dev/null \
          || docker buildx imagetools inspect --format '{{json .}}' "${IMAGE_REPOSITORY}:${IMAGE_REFERENCE#:}")
        IMAGE_DIGEST=$(echo "$INSPECT_JSON" | jq -r '.manifest.digest')
        IMAGE_BY_DIGEST="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
        echo "Assessing ${IMAGE_BY_DIGEST}"

        DISCOVER=$(oras discover "$IMAGE_BY_DIGEST" --artifact-type "$SBOM_MEDIA_TYPE" --format json 2>/dev/null || echo '{}')
        SBOM_DIGEST=$(echo "$DISCOVER" | jq -r '.manifests[0].digest // empty')
        SBOM_ARTIFACT_TYPE=$(echo "$DISCOVER" | jq -r '.manifests[0].artifactType // empty')
        case "$SBOM_ARTIFACT_TYPE" in
          *cyclonedx*) SBOM_FORMAT=CYCLONEDX ;;
          *spdx*)      SBOM_FORMAT=SPDX ;;
          *)           SBOM_FORMAT="" ;;
        esac
        if [ -n "$SBOM_DIGEST" ]; then
          SBOM_PRESENT=true; SBOM_URI="${ECR_URL}/${repository}@${SBOM_DIGEST}"
        else
          SBOM_PRESENT=false; SBOM_URI=""; echo "No SBOM referrer for ${IMAGE_BY_DIGEST}"
        fi

        PROV_DISCOVER=$(oras discover "$IMAGE_BY_DIGEST" --artifact-type "$PROVENANCE_MEDIA_TYPE" --format json 2>/dev/null || echo '{}')
        PROV_DIGEST=$(echo "$PROV_DISCOVER" | jq -r '.manifests[0].digest // empty')
        PROV_ARTIFACT_TYPE=$(echo "$PROV_DISCOVER" | jq -r '.manifests[0].artifactType // empty')
        PROV_PRESENT=false; PROV_PREDICATE='{}'; PROV_SUBJECT_DIGEST=""; PROV_PREDICATE_TYPE=""; PROV_URI=""
        if [ -n "$PROV_DIGEST" ]; then
          PROV_URI="${ECR_URL}/${repository}@${PROV_DIGEST}"
          OUT_DIR="$(mktemp -d)"
          if oras pull "$PROV_URI" -o "$OUT_DIR" 2>/dev/null; then
            STATEMENT_FILE=$(ls "$OUT_DIR"/*.json 2>/dev/null | head -1 || true)
            if [ -n "${STATEMENT_FILE:-}" ]; then
              PROV_PRESENT=true
              PROV_PREDICATE_TYPE=$(jq -r '.predicateType // empty' < "$STATEMENT_FILE")
              PROV_SUBJECT_DIGEST="sha256:$(jq -r '.subject[0].digest.sha256 // empty' < "$STATEMENT_FILE")"
              PROV_PREDICATE=$(jq -c '.predicate // {}' < "$STATEMENT_FILE")
            fi
          fi
        fi
        [ "$PROV_PRESENT" = true ] || echo "No usable provenance referrer for ${IMAGE_BY_DIGEST}"
        OBSERVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

        _ci_env_gh_event() {  # $1=jq path expression
          [ -f "${GITHUB_EVENT_PATH:-}" ] || return 0
          jq -r "$1 // empty" < "$GITHUB_EVENT_PATH" 2>/dev/null || true
        }

        _ci_env_init_gitlab() {
          SUP_PROVIDER=gitlab
          SUP_EXTERNAL_ID="${CI_PROJECT_ID:-}"
          SUP_PIPELINE_ID="${CI_PIPELINE_ID:-}"
          SUP_JOB_ID="${CI_JOB_ID:-}"
          SUP_COMMIT_SHA="${CI_COMMIT_SHA:-}"
          SUP_REF="${CI_COMMIT_REF_NAME:-}"
          SUP_REVIEW_ID="${CI_MERGE_REQUEST_IID:-}"
          SUP_PIPELINE_URL="${CI_PIPELINE_URL:-}"
          SUP_JOB_URL="${CI_JOB_URL:-}"
        }

        _ci_env_init_github() {
          SUP_PROVIDER=github
          SUP_EXTERNAL_ID="${GITHUB_REPOSITORY_ID:-}"
          SUP_PIPELINE_ID="${GITHUB_RUN_ID:-}"
          SUP_JOB_ID="${GITHUB_RUN_ID:-}-${GITHUB_RUN_ATTEMPT:-1}-${GITHUB_JOB:-}"
          SUP_REVIEW_ID="$(_ci_env_gh_event '.pull_request.number')"
          SUP_COMMIT_SHA="$(_ci_env_gh_event '.pull_request.head.sha')"
          SUP_COMMIT_SHA="${SUP_COMMIT_SHA:-${GITHUB_SHA:-}}"
          SUP_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          SUP_PIPELINE_URL="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID:-}"
          SUP_JOB_URL="${SUP_PIPELINE_URL}/attempts/${GITHUB_RUN_ATTEMPT:-1}"
        }

        ci_env_init() {
          if [ -n "${SUP_PROVIDER:-}" ]; then return 0; fi
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            _ci_env_init_github
          elif [ "${GITLAB_CI:-}" = "true" ]; then
            _ci_env_init_gitlab
          else
            echo "ci_env: neither GITLAB_CI nor GITHUB_ACTIONS is set — refusing to guess the forge" >&2
            return 1
          fi
          if [ -z "$SUP_EXTERNAL_ID" ]; then
            echo "ci_env: ${SUP_PROVIDER} did not supply a repository id — cannot attribute evidence" >&2
            return 1
          fi
          export SUP_PROVIDER SUP_EXTERNAL_ID SUP_PIPELINE_ID SUP_JOB_ID SUP_COMMIT_SHA SUP_REF SUP_REVIEW_ID
          export SUP_PIPELINE_URL SUP_JOB_URL
        }

        ci_env_id_token() {
          if [ "${SUP_PROVIDER:-}" = "github" ]; then
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              echo "ci_env: no OIDC token endpoint — the workflow (or job) is missing 'permissions: id-token: write'" >&2
              return 1
            fi
            _aud="${SUPERVISORY_AUDIENCE:-supervisory-service}"
            _tok=$(curl -sS -H "authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${_aud}" 2>/dev/null | jq -r '.value // empty')
            if [ -z "$_tok" ]; then
              echo "ci_env: the OIDC token endpoint returned no token for audience '${_aud}'" >&2
              return 1
            fi
            printf '%s' "$_tok"
            return 0
          fi
          if [ -z "${SUPERVISORY_ID_TOKEN:-}" ]; then
            echo "ci_env: SUPERVISORY_ID_TOKEN is not set — the job is missing its 'id_tokens:' declaration" >&2
            return 1
          fi
          printf '%s' "$SUPERVISORY_ID_TOKEN"
        }


        _advisory_body() {
          _when=$(jq -r '.enforcement.enforceAt // empty' < "$2"); _when=${_when:-a future release}
          _reason=$(jq -r '([.reasons[]?.message] | join("; ")) as $r | if $r == "" then "no reason reported" else $r end' < "$2")
          printf '### ⚠️ Advisory supervisory control failed — `%s`\n\n`%s` did not pass. It is **advisory** right now, so it does **not** block this pipeline.\n\n**It becomes enforced on `%s` — after that this failure WILL block the pipeline.** Please resolve it before then.\n\n**Reason:** %s\n\n%s' \
            "$1" "$1" "$_when" "$_reason" "$3"
        }

        _advisory_note_gitlab() {
          [ -n "${SUPERVISION_ADVISOR_TOKEN:-}" ] || return 0
          _api="${CI_API_V4_URL}/projects/${SUP_EXTERNAL_ID}/merge_requests/${SUP_REVIEW_ID}/notes"
          if curl -sf -H "PRIVATE-TOKEN: ${SUPERVISION_ADVISOR_TOKEN}" "${_api}?per_page=100" 2>/dev/null \
               | jq -e --arg m "$3" 'map(.body) | any(contains($m))' >/dev/null 2>&1; then
            echo "[$1] advisory note already present on !${SUP_REVIEW_ID} — skipping" >&2; return 0
          fi
          jq -n --arg b "$(_advisory_body "$1" "$2" "$3")" '{body: $b}' \
            | curl -sf -X POST -H "PRIVATE-TOKEN: ${SUPERVISION_ADVISOR_TOKEN}" -H 'content-type: application/json' --data-binary @- "$_api" >/dev/null \
            && echo "[$1] advisory note posted to !${SUP_REVIEW_ID}" >&2 \
            || echo "[$1] advisory note POST failed (non-fatal)" >&2
        }

        _advisory_note_github() {
          _tok="${SUPERVISION_ADVISOR_TOKEN:-${GITHUB_TOKEN:-}}"
          [ -n "$_tok" ] || return 0
          _api="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/issues/${SUP_REVIEW_ID}/comments"
          if curl -sf -H "authorization: Bearer ${_tok}" -H 'accept: application/vnd.github+json' "${_api}?per_page=100" 2>/dev/null \
               | jq -e --arg m "$3" 'map(.body) | any(contains($m))' >/dev/null 2>&1; then
            echo "[$1] advisory note already present on #${SUP_REVIEW_ID} — skipping" >&2; return 0
          fi
          jq -n --arg b "$(_advisory_body "$1" "$2" "$3")" '{body: $b}' \
            | curl -sf -X POST -H "authorization: Bearer ${_tok}" -H 'accept: application/vnd.github+json' -H 'content-type: application/json' --data-binary @- "$_api" >/dev/null \
            && echo "[$1] advisory note posted to #${SUP_REVIEW_ID}" >&2 \
            || echo "[$1] advisory note POST failed (non-fatal)" >&2
        }

        advisory_review_note() {
          [ -n "${SUP_REVIEW_ID:-}" ] || return 0
          _marker="<!-- supervision-advisory:$1 -->"
          if [ "${SUP_PROVIDER}" = "github" ]; then
            _advisory_note_github "$1" "$2" "$_marker"
          else
            _advisory_note_gitlab "$1" "$2" "$_marker"
          fi
        }

        _sup_token() {
          if [ -z "${_SUP_TOKEN:-}" ]; then
            _SUP_TOKEN=$(ci_env_id_token) || return 1
          fi
        }

        supervise() {
          CONTROL="$1"; EVIDENCE="$2"; _rc=0
          BODY=$(mktemp)
          _attempt=1
          while :; do
            if ! _sup_token; then
              echo "[${CONTROL}] no supervisory token — failing closed"; rm -f "$BODY"; return 1
            fi
            CODE=$(curl -sS -o "$BODY" -w '%{http_code}' -X POST "${EVAL_URL}/v1/projects/${SUP_PROJECT}/evaluations" \
              -H 'content-type: application/json' -H "authorization: Bearer ${_SUP_TOKEN}" --data-binary @"$EVIDENCE")
            if [ "$CODE" = "401" ] && [ "$_attempt" -eq 1 ] && [ "${SUP_PROVIDER}" = "github" ]; then
              _attempt=2; _SUP_TOKEN=""; continue
            fi
            break
          done
          echo "── ${CONTROL} → HTTP ${CODE} ──"; jq . < "$BODY" 2>/dev/null || cat "$BODY"
          if [ "$CODE" != "200" ]; then
            echo "[${CONTROL}] HTTP ${CODE} — failing closed"; _rc=1
          else
            EFFECT=$(jq -r '.effect // empty' < "$BODY"); STATUS=$(jq -r '.status // empty' < "$BODY"); MODE=$(jq -r '.enforcement.effectiveMode // empty' < "$BODY")
            if [ "$EFFECT" = "BLOCK" ]; then echo "[${CONTROL}] '${STATUS:-<none>}' effect BLOCK (enforced) — failing closed"; _rc=1;
            elif [ "$STATUS" = "PASS" ]; then echo "[${CONTROL}] PASS";
            elif [ "$MODE" = "disabled" ]; then echo "[${CONTROL}] DISABLED — allowed";
            else
              echo "[${CONTROL}] ADVISORY '${STATUS:-<none>}' — not blocking"
              if [ "$STATUS" = "FAIL" ]; then advisory_review_note "$CONTROL" "$BODY"; fi
            fi
          fi
          rm -f "$BODY"   # a gate submits many controls per job — don't leak a temp per submission
          return $_rc
        }
        ci_env_init
        SRC=$(jq -n --arg prov "$SUP_PROVIDER" --arg pid "$SUP_EXTERNAL_ID" --arg comp "$COMPONENT_NAME" \
          --arg pipe "$SUP_PIPELINE_ID" --arg job "$SUP_JOB_ID" --arg ref "$SUP_REF" --arg commit "$SUP_COMMIT_SHA" \
          '{ provider: $prov, externalProjectId: $pid, component: $comp, pipelineId: $pipe, jobId: $job, commitSha: $commit, ref: $ref }')
        mkev() {  # $1=controlId $2=evidenceType $3=evidenceIdSuffix $4=idemPrefix $5=payload FILE -> envelope on stdout
          jq -n --arg control "$1" --arg etype "$2" --arg prov "$SUP_PROVIDER" --arg pid "$SUP_EXTERNAL_ID" \
            --arg comp "$COMPONENT_NAME" --arg pipe "$SUP_PIPELINE_ID" --arg observed "$OBSERVED_AT" --arg suffix "$3" \
            --arg idem "$4-${SUP_PIPELINE_ID}-${SUP_JOB_ID}" --argjson src "$SRC" --slurpfile payload "$5" \
            '{ controlId: $control, scope: "REPOSITORY", idempotencyKey: $idem,
               evidence: { evidenceId: ($prov + "-" + $pid + "-" + $comp + "-pipeline-" + $pipe + "-" + $suffix),
                 evidenceType: $etype, observedAt: $observed, source: $src, artifacts: [], payload: $payload[0] } }'
        }

        submit_control() {
          _ev="$(mktemp)"
          mkev "$1" "$2" "$3" "$4" "$5" > "$_ev"
          supervise "$1" "$_ev" || RC=1
          rm -f "$_ev"
        }

        submit_deploy_control() {
          _ev="$(mktemp)"
          jq -n --arg control "$1" --arg phase "$2" --arg prov "$SUP_PROVIDER" --arg pid "$SUP_EXTERNAL_ID" \
            --arg comp "$COMPONENT_NAME" --arg pipe "$SUP_PIPELINE_ID" --arg job "$SUP_JOB_ID" \
            --arg env "$ENVIRONMENT_NAME" --arg observed "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson src "$SRC" --argjson payload "$3" \
            '{ controlId: $control, scope: "DEPLOYMENT",
               idempotencyKey: ($control + "-" + $phase + "-" + $pipe + "-" + $job + "-" + $env),
               evidence: {
                 evidenceId: ($prov + "-" + $pid + "-" + $comp + "-pipeline-" + $pipe + "-" + $env + "-deployment"),
                 evidenceType: "DEPLOYMENT_EVENT", observedAt: $observed,
                 source: $src, artifacts: [], payload: $payload } }' > "$_ev"
          echo "── ${2}-deploy ──"
          supervise "$1" "$_ev"; _rc=$?
          rm -f "$_ev"
          return $_rc
        }

        WORK="$(mktemp -d)"
        [ -n "${PROV_PREDICATE:-}" ] || PROV_PREDICATE='{}'
        printf '%s' "$INSPECT_JSON" > "$WORK/inspect.json"
        printf '%s' "$PROV_PREDICATE" > "$WORK/pred.json"
        echo '{}' > "$WORK/empty.json"
        jq -n --slurpfile output "$WORK/inspect.json" \
          '{ format: "docker-buildx-imagetools/v1", tool: { name: "docker buildx imagetools", version: "ci" }, output: $output[0] }' > "$WORK/img.json"
        jq -n --slurpfile output "$WORK/inspect.json" --argjson present "$SBOM_PRESENT" --arg f "$SBOM_FORMAT" --arg mt "$SBOM_ARTIFACT_TYPE" --arg d "$SBOM_DIGEST" --arg sd "$IMAGE_DIGEST" --arg uri "$SBOM_URI" \
          '{ format: "container-build-metadata/v1", output: $output[0], sbom: { present: $present, format: $f, mediaType: $mt, digest: $d, subjectDigest: $sd, uri: $uri } }' > "$WORK/sbom.json"
        jq -n --slurpfile output "$WORK/inspect.json" --argjson present "$PROV_PRESENT" --arg pt "$PROV_PREDICATE_TYPE" --arg mt "$PROV_ARTIFACT_TYPE" --arg d "$PROV_DIGEST" --arg sd "$PROV_SUBJECT_DIGEST" --arg uri "$PROV_URI" --slurpfile pred "$WORK/pred.json" \
          '{ format: "container-build-provenance/v1", output: $output[0], provenance: { present: $present, predicateType: $pt, mediaType: $mt, digest: $d, subjectDigest: $sd, uri: $uri, predicate: $pred[0] } }' > "$WORK/prov.json"
        RC=0
        submit_control SD-1.1 AUTOMATED_BUILD automated-build sd11 "$WORK/empty.json"
        submit_control SD-1.3 BUILD_TRACEABILITY build-traceability sd13 "$WORK/img.json"
        submit_control SD-1.5 ARTIFACT_LOCATION artifact-location sd15 "$WORK/img.json"
        submit_control SD-1.4 CONTAINER_BUILD_METADATA build-metadata sd14 "$WORK/sbom.json"
        submit_control SD-1.2 BUILD_PROVENANCE build-provenance sd12 "$WORK/prov.json"
        exit $RC
